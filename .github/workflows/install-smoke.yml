# The stranger's command, on amd64, on the oldest system docs/PLATFORMS.md claims to support.
#
# Every gate this repository has ran green on 7 September and a tester in Mallorca still could not
# install. Nothing tested the install itself, on a machine that had nothing on it, without a person
# there to press RETURN. This does.
#
# What it asserts, on every push:
#   · exit 0
#   · no interactive prompt — no terminal exists, and a hang fails on the timeout rather than waiting
#   · no sudo and no brew: both are shadowed by a fake that records the call and fails
#   · `make health` answers
#
# It runs the bootstrap byte for byte as the pipe delivers it. Only the source is overridden, with the
# same environment variables a tester can use: the tarball comes from THIS commit, served over HTTP the
# way the site serves it, so a pull request is tested rather than the last release.
name: install smoke
on: [push, pull_request]

jobs:
  amd64-linux:
    # ubuntu-22.04 is x86_64 and the oldest Linux docs/PLATFORMS.md claims (Docker Engine's own list:
    # Jammy 22.04 is the oldest supported LTS). A hosted runner is a clean VM, which is the point.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # bundle.sh reads `git describe`

      - name: build the tarball this commit would ship, and serve it the way the site does
        run: |
          mkdir -p /tmp/site/get
          bash tools/bundle.sh /tmp/site/get
          ( cd /tmp/site && python3 -m http.server 8099 >/tmp/site.log 2>&1 & )
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8099/get/SHA256 >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8099/get/SHA256

      - name: shadow sudo and brew, so a call to either is a failure and not a surprise
        run: |
          mkdir -p /tmp/notools
          for t in sudo brew; do
            printf '#!/bin/sh\necho "$0 $*" >> /tmp/forbidden\nexit 1\n' > /tmp/notools/$t
            chmod +x /tmp/notools/$t
          done
          rm -f /tmp/forbidden

      - name: the stranger's command, with no terminal and nothing to press
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai
          PLANETAI_REF: ${{ github.sha }}     # so the raw fallback resolves too, not only the local copy
        run: |
          cat > /tmp/node.json <<'JSON'
          {"name": "ci-node", "lat": 39.57, "lon": 2.65, "kind": "home", "sensor": {}}
          JSON
          # `cat install | bash -s --` is what the pipe does. </dev/null and no tty: a question here hangs,
          # and the timeout turns a hang into a red job instead of a twenty-minute wait.
          PATH="/tmp/notools:$PATH" timeout 900 bash -c 'cat install | bash -s -- --answers /tmp/node.json' </dev/null \
            2>&1 | tee /tmp/TRANSCRIPT_ok.txt
          echo "installer exit: ${PIPESTATUS[0]}"
          # The feedback contract, asserted rather than admired: named steps, elapsed times, a summary.
          grep -q "^\[1/7\] "            /tmp/TRANSCRIPT_ok.txt || { echo "no numbered steps"; exit 1; }
          grep -q "^\[7/7\] "            /tmp/TRANSCRIPT_ok.txt || { echo "never reached the last step"; exit 1; }
          grep -q "done in "               /tmp/TRANSCRIPT_ok.txt || { echo "no elapsed time on a step"; exit 1; }
          grep -q "^install OK — "         /tmp/TRANSCRIPT_ok.txt || { echo "no one-line summary"; exit 1; }
          # A filesystem path can exceed any budget and nothing can be done about it, so hold the
          # reporter's own lines — steps, heartbeats, the summary — to 100 columns, not every line.
          grep -E '^\[[0-9]+/[0-9]+\]|^ +[0-9]+s |^install (OK|FAILED)|^FAILED:' /tmp/TRANSCRIPT_ok.txt \
            | awk 'length > 100 { print "  too wide (" length "): " $0; n++ } END { exit (n > 0) }' \
            || { echo "a step line is over 100 columns"; exit 1; }

      - name: no sudo, no brew
        run: |
          if [ -s /tmp/forbidden ]; then echo "the install called:"; cat /tmp/forbidden; exit 1; fi
          echo "neither was called"

      - name: make health
        run: |
          cd /home/runner/planetai
          for i in $(seq 60); do curl -sf localhost:8080/health >/dev/null && break; sleep 2; done
          make health

      - name: it is safe to run twice, and the second run does not ask again
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai
          PLANETAI_REF: ${{ github.sha }}     # so the raw fallback resolves too, not only the local copy
        run: |
          PATH="/tmp/notools:$PATH" timeout 900 bash -c 'cat install | bash -s -- --answers /tmp/node.json' </dev/null
          [ -s /tmp/forbidden ] && { cat /tmp/forbidden; exit 1; } || true
          cd /home/runner/planetai && make health

      - name: a deliberately failed run — the step name, the reason, the resume command
        env:
          PLANETAI_SITE: http://127.0.0.1:8099
          PLANETAI_HOME: /home/runner/planetai-fail
          PLANETAI_REF: ${{ github.sha }}
        run: |
          # Point the database at a tag that does not exist. A registry outage, a typo in a compose file
          # and a wrong tag all land here, and this is the output a tester would paste into an issue.
          # Its own project AND its own database volume: the successful run above left one, and the
          # installer rightly refuses to start a node whose new .env cannot log in to an old volume.
          docker volume rm -f planetai_db >/dev/null 2>&1 || true
          cp -r . /tmp/failrun && cd /tmp/failrun
          sed -i 's|postgis/postgis:16-3.4-alpine|postgis/postgis:16-3.4-alpine-DOES-NOT-EXIST|' docker-compose.yml
          cp .env.example .env && sed -i 's|^APP_PORT=.*|APP_PORT=8123|' .env
          set +e
          COMPOSE_PROJECT_NAME=planetai_fail timeout 600 ./install.sh --name ci-fail --lat 39.57 --lon 2.65 --no-bad \
            > /tmp/TRANSCRIPT_fail.txt 2>&1
          rc=$?; set -e
          cat /tmp/TRANSCRIPT_fail.txt
          echo "installer exit: $rc"
          [ "$rc" -eq 0 ] && { echo "expected this run to FAIL and it did not"; exit 1; } || true
          grep -qE "^FAILED: .+"                            /tmp/TRANSCRIPT_fail.txt || { echo "no named step in the failure"; exit 1; }
          grep -qE "^  reason  .+"                          /tmp/TRANSCRIPT_fail.txt || { echo "no reason"; exit 1; }
          grep -q "resume  planetai setup"                 /tmp/TRANSCRIPT_fail.txt || { echo "no resume command"; exit 1; }
          grep -q "^install FAILED at step"                /tmp/TRANSCRIPT_fail.txt || { echo "no one-line summary"; exit 1; }
          grep -qi "Something went wrong"                  /tmp/TRANSCRIPT_fail.txt && { echo "still says Something went wrong"; exit 1; } || true
          echo "the failure names its step, its reason, its log and the way back"

      - name: keep both transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-transcripts
          path: |
            /tmp/TRANSCRIPT_ok.txt
            /tmp/TRANSCRIPT_fail.txt
          if-no-files-found: warn

      - name: what a tester would paste into an issue
        if: always()
        run: bash tools/preflight.sh --json || true

  # Ubuntu Server and Arch (which is what Omarchy is), from a clean userland rather than a CI image with
  # half the world preinstalled. Each container starts with no docker, no curl-installed anything and a
  # non-root user with sudo — the shape of a machine somebody just installed Linux on, which is where
  # Lucas was on 8 September. The host's docker socket is mounted, so the engine the script installs has
  # something to talk to; what is under test is the platform branch, not nested virtualisation.
  clean-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Server 22.04
            image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq curl sudo tar ca-certificates >/dev/null
          - name: Arch (what Omarchy is built on)
            image: archlinux:latest
            prep: pacman -Sy --noconfirm --quiet curl sudo tar >/dev/null
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: build the tarball this commit would ship, and serve it
        run: |
          mkdir -p /tmp/site/get && bash tools/bundle.sh /tmp/site/get
          ( cd /tmp/site && python3 -m http.server 8099 >/tmp/site.log 2>&1 & )
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8099/get/SHA256 >/dev/null 2>&1 && break; sleep 1; done
      - name: the stranger's command, on a clean ${{ matrix.name }}
        run: |
          cat > /tmp/run.sh <<'INNER'
          set -e
          PREP_PLACEHOLDER
          useradd -m -s /bin/bash tester
          echo "tester ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/tester
          # sudo and brew are shadowed: a call to either is a failure, not a surprise.
          mkdir -p /opt/notools
          for t in brew xcode-select; do printf '#!/bin/sh\necho "$0 $*" >> /tmp/forbidden\nexit 1\n' > /opt/notools/$t; chmod +x /opt/notools/$t; done
          rm -f /tmp/forbidden
          cat > /home/tester/node.json <<'JSON'
          {"name": "ci-clean", "lat": 39.95, "lon": 4.05, "kind": "home", "sensor": {}}
          JSON
          chown tester /home/tester/node.json
          su tester -c 'cd /home/tester && PATH=/opt/notools:$PATH PLANETAI_SITE=http://172.17.0.1:8099 PLANETAI_HOME=/home/tester/planetai \
            timeout 1500 bash -c "cat /work/install | bash -s -- --answers /home/tester/node.json"' </dev/null 2>&1 | tee /tmp/T.txt
          echo "installer exit: ${PIPESTATUS[0]}"
          [ -s /tmp/forbidden ] && { echo "it called:"; cat /tmp/forbidden; exit 1; } || true
          grep -q "^\[1/7\] making sure a container runtime" /tmp/T.txt || { echo "the runtime phase is not step 1"; exit 1; }
          grep -qE "^ +[0-9]+s +" /tmp/T.txt || { echo "no heartbeat during a long step"; exit 1; }
          grep -q "^install OK" /tmp/T.txt || { echo "no success summary"; exit 1; }
          echo "ok on this userland"
          INNER
          # the matrix's prep line, spliced in without YAML fighting the shell
          python3 - <<'PYP'
          import os
          s = open('/tmp/run.sh').read()
          open('/tmp/run.sh','w').write(s.replace('PREP_PLACEHOLDER', os.environ['PREP']))
          PYP
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work:ro" -v /tmp/run.sh:/run.sh:ro \
            ${{ matrix.image }} bash /run.sh
        env:
          PREP: ${{ matrix.prep }}
      - name: what a tester would paste into an issue
        if: always()
        run: bash tools/preflight.sh --json || true

  intel-mac:
    # A real Intel Mac, verified available: GitHub offers macos-15-intel and macos-26-intel. The oldest
    # Intel image, macos-13, has been retired, so there is NO hosted runner at the 13.5 floor — that
    # case stays a manual gate on a real Mac before each tag.
    #
    # These runners have no Docker daemon (licensing), so this job cannot finish an install. What it can
    # prove is the part that broke: on a Mac, the installer asks for no Xcode Command Line Tools, runs no
    # sudo, touches no Homebrew, and preflight names a runtime this macOS can actually run.
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: preflight, on Intel
        run: |
          bash tools/preflight.sh --json > /tmp/pf.json || true
          cat /tmp/pf.json
          python3 - /tmp/pf.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["arch"] == "x86_64", d["arch"]
          assert [c for c in d["checks"] if c["check"] == "os"][0]["ok"], "macOS 15 must clear the floor"
          print("  ok  Intel, above the floor")
          PY
      - name: shadow xcode-select, sudo and brew
        run: |
          mkdir -p /tmp/notools
          for t in sudo brew xcode-select git; do
            printf '#!/bin/sh\necho "$0 $*" >> /tmp/forbidden\nexit 1\n' > /tmp/notools/$t
            chmod +x /tmp/notools/$t
          done
          rm -f /tmp/forbidden
      - name: the bootstrap reaches the runtime check without asking for any of them
        env: { PLANETAI_HOME: /Users/runner/planetai }
        run: |
          cat > /tmp/node.json <<'JSON'
          {"name": "ci-node", "lat": 39.57, "lon": 2.65, "kind": "home", "sensor": {}}
          JSON
          # No daemon here, so this stops at the runtime check. It must stop there and nowhere earlier,
          # and it must not have called xcode-select, git, sudo or brew on the way.
          PATH="/tmp/notools:$PATH" timeout 600 bash -c 'cat install | bash -s -- --answers /tmp/node.json' </dev/null || true
          if [ -s /tmp/forbidden ]; then echo "the install called:"; cat /tmp/forbidden; exit 1; fi
          echo "no xcode-select, no git, no sudo, no brew"
