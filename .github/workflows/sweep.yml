# The daily sweep. Reads the repo and the site, writes ONE pinned issue and edits it in place.
# It never merges, closes, tags or ships — see the header of tools/sweep.py for why.
#
# Runs with the workflow's own token: it can edit issues in this repo and nothing else, so nothing
# here can hold or leak a secret. To have the same page reach Telegram, add one step that posts the
# issue URL to the bot — that needs TELEGRAM_BOT_TOKEN as a repository secret, and until somebody
# decides that is worth a secret in CI, GitHub's own notifications on the pinned issue are the relay.
name: sweep
on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC, once
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # every tag and every branch: the report is about all of them
      - name: sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sweep.py > /tmp/sweep.md
      - name: one issue, edited in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh issue list --state open --search 'in:title "Daily sweep"' --json number,title \
               --jq '[.[] | select(.title == "Daily sweep")] | .[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file /tmp/sweep.md
            echo "edited #$n"
          else
            url="$(gh issue create --title "Daily sweep" --body-file /tmp/sweep.md --label maintenance 2>/dev/null \
                   || gh issue create --title "Daily sweep" --body-file /tmp/sweep.md)"
            gh issue pin "$url" || true
            echo "created $url"
          fi
