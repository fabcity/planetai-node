name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # numpy for tests/test_earth.py, duckdb for the rule replays in test_nearby and test_shipped.
      # Without them those suites skip, and tests/all fails a run whose skips are not declared.
      - run: pip install pyyaml numpy duckdb
      # The app's own dependencies, so three checks stop skipping on a clean runner: test_share's
      # request half (it drives FastAPI's TestClient, and it is the only test of the share-level
      # boundary), test_ground, and `make lint`'s import-check — which exists because a function
      # called as if it were a string took the node down for an hour on 5 September.
      - run: pip install -r app/requirements.txt
      # `markdown` is the docs site's only dependency. Without it `build_docs.py --check` skips, and a
      # skip is how the site fell fifteen releases behind the node with this job green.
      - run: pip install markdown
      - run: make lint
      - name: docs match the code
        run: python3 tools/check_docs.py
      - name: rules and cells match the schema
        run: |
          pip install -q sqlglot pyyaml
          python3 tools/check_rules.py
      - name: schema applies to a real postgres (twice — idempotency)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=x -e POSTGRES_USER=planetai -e POSTGRES_DB=planetai -p 5432:5432 postgres:16-alpine
          # pg_isready answers during the entrypoint's temporary init server too, which then shuts down.
          # Wait for a real query to succeed against the final server instead.
          for i in $(seq 40); do docker exec pg psql -U planetai -d planetai -tAc 'select 1' >/dev/null 2>&1 && break; sleep 2; done
          docker exec pg psql -U planetai -d planetai -tAc 'select 1' >/dev/null || { docker logs pg | tail -20; exit 1; }
          docker exec -i pg psql -v ON_ERROR_STOP=1 -U planetai planetai < init.sql
          docker exec -i pg psql -v ON_ERROR_STOP=1 -U planetai planetai < init.sql   # must be safe twice
          docker exec -i pg psql -U planetai planetai -c "SELECT * FROM stats LIMIT 0" -c "SELECT * FROM observations LIMIT 0" -c "SELECT max(version) FROM schema_version"
          docker rm -f pg
      # Was one suite of twenty-five. tests/all runs all of them, keeps going, and counts.
      - name: every suite
        run: make test

  # tests/visual/gate.sh: the page rendered from the committed fixture and measured. It is not in
  # `make test` because Playwright and the place plan live in planetai-design, which is private, so
  # it is its own job, with the design repo checked out at the commit data/frozen_layer.txt pins.
  # It was red from v0.73 to v0.75.6 while every job above was green, because nothing ran it.
  #
  # The deploy key is required. A missing key FAILS this job instead of skipping it: a gate that
  # quietly skips wherever its input is missing is green in exactly the place it is meant to guard.
  # The one exception is a pull request from a fork, because GitHub does not give those the secret.
  visual:
    runs-on: ubuntu-latest
    env:
      DESIGN_KEY: ${{ secrets.PLANETAI_DESIGN_DEPLOY_KEY }}
      FORK: ${{ github.event.pull_request.head.repo.fork || false }}
    steps:
      - uses: actions/checkout@v4
      - name: the deploy key for planetai-design
        run: |
          [ -n "$DESIGN_KEY" ] && exit 0
          if [ "$FORK" = "true" ]; then echo "::notice::a fork's pull request gets no secrets; the visual gate did not run"; exit 0; fi
          echo "::error::PLANETAI_DESIGN_DEPLOY_KEY is not set, so the visual gate cannot check out planetai-design"; exit 1
      - name: the design commit the frozen layer is pinned to
        id: pin
        run: echo "sha=$(sed -n 's/^design_sha=//p' data/frozen_layer.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: env.DESIGN_KEY != ''
        with:
          repository: fabcity/planetai-design
          ref: ${{ steps.pin.outputs.sha }}
          ssh-key: ${{ secrets.PLANETAI_DESIGN_DEPLOY_KEY }}
          persist-credentials: false
          path: planetai-design
      - uses: actions/setup-python@v5
        if: env.DESIGN_KEY != ''
        with: { python-version: "3.12" }
      # measure.mjs replays the fixture through app/settings.py and app/issues, as the node would.
      - if: env.DESIGN_KEY != ''
        run: pip install pyyaml numpy duckdb -r app/requirements.txt
      - uses: actions/setup-node@v4
        if: env.DESIGN_KEY != ''
        with: { node-version: "22" }
      - name: playwright, at planetai-design's lockfile
        if: env.DESIGN_KEY != ''
        working-directory: planetai-design
        run: npm ci && npx playwright install --with-deps chromium
      - name: the visual gate
        if: env.DESIGN_KEY != ''
        env:
          PAI_DESIGN_REPO: planetai-design
          PAI_OUT: ${{ runner.temp }}/pai-gate
        # No artifact upload: this repo is public, so anyone can download its artifacts, and the
        # screenshots draw node #1's place plan, the one thing this job goes to a private repo for.
        run: bash tests/visual/gate.sh
