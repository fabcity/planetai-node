# Air. The first issue, and the template for the next one.
#
# An issue is something a place can be better or worse at, that a household recognises by name.
# This file is the whole declaration: adding a fifth issue is a fifth file like this one plus a pack
# that declares its domain. Nothing in app/issues/*.py knows the word "pm25".
#
# The id and es strings below are ASSISTANT-WRITTEN and have not been read by a native speaker.
# See CHANGELOG.md. Fix them in place; nothing else changes.

# This pack's issue (app/issues/__init__.py::load reads it while the pack is on). Until 23 Oct 2026, app/issues/air.yml.
key: air

alert: an air alert           # what its alerts are called in a learning (learn.alert_name), English only

name:
  en: Air
  id: Udara
  es: Aire

kind: sensed              # sensed = the node has eyes on it and rules that can ask for something
metric: pm25
unit: µg/m³
dp: 0

# How two distances are compared when the sentence says "over" or "level with". A concentration
# compares by ratio; a temperature has to compare by difference, or 30 °C against 20 °C reads as
# half again as hot. Each issue says which, because the engine must not guess from the unit.
compare:
  mode: ratio
  margin: 1.5

# The line this issue is judged against. No pack declares a threshold as data — `thresholds:` in
# both pack.yaml files that have one is prose — so the number is written here once, and `sql:` names
# the rule whose SQL carries the same number. tests/test_issues.py greps that rule and fails if the
# two ever drift apart, which is the guarantee importing it would have given.
line:
  value: 15
  unit: µg/m³
  source: WHO 2021 global air quality guidelines, 24-hour mean
  sql: air-quality/inside_worse_ventilate
# The line urgent alerts name ({unhealthy}): Tomas, 14 Oct — WHO 15 in every graphic, EPA 35.5 when the air is
# unhealthy for an hour or dangerous. The US EPA's 2024 AQI breakpoint for "unhealthy for sensitive groups" ends here.
unhealthy: 35.5

packs:
  domains: [air]          # every rule and metric from a pack whose domain is `air`
  rules:                  # plus these, from packs whose domain is cross-domain
    - cold-start/modelled_air_today
    - cold-start/sensor_vs_model
    - insight/agreement
    - insight/rhythm
    - example-cooking-hours/post_cooking_summary

# The four distances, which are the columns of every issue. Each says where its number comes from,
# which rows, which field and how they are combined. An absent distance is `~` and the page says why.
distances:
  room:
    from: stats
    place: room
    metrics: [pm25]
    field: mean_15m
    aggregate: mean
  yard:
    from: stats
    place: yard
    metrics: [pm25]
    field: mean_15m
    aggregate: mean
  ring:
    from: stats
    place: ring
    # mean_15m, the same window as the room. Comparing a 15-minute room against a 1-hour ring puts
    # two different quantities on one scale, which is the thing a stack exists not to do — and it is
    # the same mistake as a room median against a model's Steadman. /nearby uses mean_1h; it is
    # answering a different question (who is out there) and is left alone.
    metrics: [pm25]
    field: mean_15m
    # Not a plain median. One station reading 152 while the rest read 5 to 12 is either a fire in
    # that lane or a broken sensor, and either way it must not become "the neighbourhood". Tukey's
    # 1.5 x IQR fails at three stations, where the outlier IS the upper quartile; median absolute
    # deviation holds. This was JavaScript in the dashboard (index.html:761) until now.
    aggregate: fenced_median
  region:
    from: observations
    sensor_id: cams-point
    metrics: [pm25_model]

sentences:
  en:
    verbs:
      rising:  "getting worse"
      steady:  "steady"
      falling: "clearing"
    # {line} is filled by the engine from the live value against the line — never asserted here.
    line:
      over:  "past the WHO line for fine dust"
      near:  "close to the WHO line for fine dust"
      under: "under the WHO line for fine dust"
    # {event} names the day it crossed and came back, so the state band and the sentence agree.
    event:
      earlier: "The house crossed the line earlier today."
    # day: said instead of the attribution when the reading is back under the line, or close to it, after hours over
    # it today (engine `_day`, the count the Now door prints beside the title). No number in the title.
    day:
      under: "The air is clean now, after a dusty {part} | {where} it was past the WHO line for fine dust until {until}, {hours} today."
      near:  "The air is better now, after a dusty {part} | {where} it was past the WHO line for fine dust until {until}, {hours} today."
      parts: {night: night, morning: morning, afternoon: afternoon, evening: evening}
      hours: ["{n} hour", "{n} hours"]
      at: "{t}"
      recent: "a few minutes ago"
    cmp_words:
      over:  "worse than {noun}"
      under: "cleaner than {noun}"
      level: "level with {noun}"
    # past: one hour the page scrubs back to. The title is what it was doing, in words; the tagline
    # is the reading and whose line ({line} reuses the words above). The page writes none of it.
    past:
      verbs:
        rising:  "was getting worse"
        steady:  "was steady"
        falling: "was clearing"
      title:   "The air {verb} {where}"
      tagline: "At {hour} it read {n} {unit}, {line}."
      none:    "Nothing was recorded {where} at {hour}."
      # what that hour meant, by the same six stories as the live title
      attribution:
        clear:         "The air was clean, inside and out"
        inside:        "Something in the house was making the air dirty"
        everywhere:    "The whole area was breathing the same dusty air"
        outside_worse: "The house was keeping the street's dust out"
        mixed:         "The air {verb} {where}"
        unknown:       "The air {where} {verb}"
    attribution:
      clear:         "The air is clean, inside and out | In the house it is {verb}, {line}. {event}"
      inside:        "Something in the house is making the air dirty | Inside it is {line}, and the street is cleaner. {event}"
      everywhere:    "The whole area is breathing the same dusty air | Inside and out it is {line}. {event}"
      outside_worse: "The house is keeping the street's dust out | Inside it is {line}, and the street is past it. {event}"
      mixed:         "The air in the house is {verb} | Inside it is {line}. {event}"
      unknown:       "The air {where} is {verb} | It is {line}. {event}"
    state:
      none: "No air sensor here yet, and no model for this point."
  id:
    verbs:
      rising:  "memburuk"
      steady:  "stabil"
      falling: "membaik"
    line:
      over:  "di atas batas WHO untuk debu halus"
      near:  "mendekati batas WHO untuk debu halus"
      under: "di bawah batas WHO untuk debu halus"
    event:
      earlier: "Rumah sempat melewati batas tadi."
    # day: ASSISTANT-WRITTEN, waiting for a native reader like the rest of this locale
    day:
      under: "Udara sudah bersih, setelah {part} yang berdebu | {where} udaranya sempat di atas batas WHO untuk debu halus sampai {until}, {hours} hari ini."
      near:  "Udara sudah membaik, setelah {part} yang berdebu | {where} udaranya sempat di atas batas WHO untuk debu halus sampai {until}, {hours} hari ini."
      parts: {night: dini hari, morning: pagi, afternoon: siang, evening: malam}
      hours: ["{n} jam", "{n} jam"]
      at: "pukul {t}"
      recent: "beberapa menit lalu"
    cmp_words:
      over:  "lebih buruk daripada {noun}"
      under: "lebih bersih daripada {noun}"
      level: "setara dengan {noun}"
    past:
      verbs:
        rising:  "memburuk"
        steady:  "bertahan"
        falling: "membaik"
      title:   "Udara {verb} {where}"
      tagline: "Pukul {hour} terbaca {n} {unit}, {line}."
      none:    "Tidak ada yang tercatat {where} pukul {hour}."
      # what that hour meant, by the same six stories as the live title
      attribution:
        clear:         "Udaranya bersih, di dalam dan di luar"
        inside:        "Ada sesuatu di dalam rumah yang mengotori udara"
        everywhere:    "Seluruh daerah menghirup udara berdebu yang sama"
        outside_worse: "Rumah menahan debu dari jalan"
        mixed:         "Udara {verb} {where}"
        unknown:       "Udara {where} {verb}"
    attribution:
      clear:         "Udara bersih, di dalam dan di luar | Di dalam rumah udaranya {verb}, {line}. {event}"
      inside:        "Ada sesuatu di dalam rumah yang mengotori udara | Di dalam rumah udaranya {line}, dan jalan lebih bersih. {event}"
      everywhere:    "Seluruh daerah menghirup udara berdebu yang sama | Di dalam dan di luar, udaranya {line}. {event}"
      outside_worse: "Rumah menahan debu dari jalan | Di dalam rumah udaranya {line}, sementara jalan melewatinya. {event}"
      mixed:         "Udara di dalam rumah {verb} | Di dalam rumah udaranya {line}. {event}"
      unknown:       "Udara {where} {verb} | Udaranya {line}. {event}"
    state:
      none: "Belum ada sensor udara di sini, dan tidak ada model untuk titik ini."
  es:
    verbs:
      rising:  "empeorando"
      steady:  "estable"
      falling: "mejorando"
    line:
      over:  "por encima del límite de la OMS para el polvo fino"
      near:  "cerca del límite de la OMS para el polvo fino"
      under: "por debajo del límite de la OMS para el polvo fino"
    event:
      earlier: "La casa cruzó el límite hoy más temprano."
    # day: ASSISTANT-WRITTEN, waiting for a native reader like the rest of this locale
    day:
      under: "El aire ya está limpio, tras una {part} de polvo | {where} estuvo por encima del límite de la OMS para el polvo fino hasta {until}, {hours} hoy."
      near:  "El aire ha mejorado, tras una {part} de polvo | {where} estuvo por encima del límite de la OMS para el polvo fino hasta {until}, {hours} hoy."
      parts: {night: madrugada, morning: mañana, afternoon: tarde, evening: noche}
      hours: ["{n} hora", "{n} horas"]
      at: "las {t}"
      recent: "hace unos minutos"
    cmp_words:
      over:  "peor que {noun}"
      under: "más limpio que {noun}"
      level: "igual que {noun}"
    past:
      verbs:
        rising:  "estaba empeorando"
        steady:  "se mantenía"
        falling: "estaba mejorando"
      title:   "El aire {verb} {where}"
      tagline: "A las {hour} marcaba {n} {unit}, {line}."
      none:    "No se registró nada {where} a las {hour}."
      # what that hour meant, by the same six stories as the live title
      attribution:
        clear:         "El aire estaba limpio, dentro y fuera"
        inside:        "Algo en la casa estaba ensuciando el aire"
        everywhere:    "Toda la zona respiraba el mismo aire sucio"
        outside_worse: "La casa estaba dejando fuera el polvo de la calle"
        mixed:         "El aire {verb} {where}"
        unknown:       "El aire {where} {verb}"
    attribution:
      clear:         "El aire está limpio, dentro y fuera | En casa está {verb}, {line}. {event}"
      inside:        "Algo en la casa está ensuciando el aire | Dentro está {line}, y la calle está más limpia. {event}"
      everywhere:    "Toda la zona respira el mismo aire sucio | Dentro y fuera está {line}. {event}"
      outside_worse: "La casa está dejando fuera el polvo de la calle | Dentro está {line}, y la calle lo supera. {event}"
      mixed:         "El aire en casa está {verb} | Dentro está {line}. {event}"
      unknown:       "El aire {where} está {verb} | Está {line}. {event}"
    state:
      none: "Aún no hay sensor de aire aquí, ni modelo para este punto."

# The supporting layer (docs/SPEC_language.md): what PM2.5 is and whose line this is, taught once.
about:
  en: "PM2.5 are particles fine enough to reach deep into the lungs. The line — 15 µg/m³ over a day — is the WHO's."
  id: "PM2.5 adalah partikel yang cukup halus untuk mencapai jauh ke dalam paru-paru. Batasnya — 15 µg/m³ dalam sehari — adalah milik WHO."
  es: "PM2.5 son partículas tan finas que llegan al fondo de los pulmones. El límite — 15 µg/m³ en un día — es el de la OMS."

# The hero: what this issue draws when it leads the page. The page draws it blind, so everything it
# needs to know about air is here: the sign and the hero-size pictogram (ids in signs.svg), which
# figure is the numeral, and the rule under it. `rule.dots` names the distances that may appear on
# the rule, and the region is left off on purpose: nobody in a kitchen needs the model's number next
# to the room's. `max` is the end of the drawing, not a limit: a reading past it sits on the end.
# An issue with no `hero:` can be watched but can never lead. See docs/PACKS.md §The hero.
hero:
  sign: sign-air
  pictogram: pix-air
  unit: µg/m³
  dp: 0
  rule:
    min: 0
    max: 20
    ends: { en: [clean, bad], id: [bersih, buruk], es: [limpio, malo] }
    dots: [room, yard, ring]
    line: true
  clock: time

empty:
  en: The node reads the model for these coordinates. Add a sensor under Set up and the house fills in.
  id: Node membaca model untuk koordinat ini. Tambahkan sensor di Set up dan rumah akan terisi.
  es: El nodo lee el modelo para estas coordenadas. Añade un sensor en Set up y la casa se rellena.

# Events (docs/SPEC_alerts.md §4–§5). The id and es strings are ASSISTANT-WRITTEN. The voice (14 Oct): the story in
# words first, then ONE reading, then whose line it is; {peak} and {line} carry their unit, so a template never types
# one and never says a bare "15". One sign per message. The outside reading is the action's reason, so it is said
# there and only there. {rooms} is a sorted set: no template may say where it started or which room came first.
events:
  spike:
    en: "📈 Smoke or dust in {rooms}: {peak}; the WHO line is {line}."
    id: "📈 Asap atau debu di {rooms}: {peak}; batas WHO {line}."
    es: "📈 Humo o polvo en {rooms}: {peak}; el límite de la OMS es {line}."
  unusual:
    en: "😷 The air in {rooms} is dirtier than usual for this hour: {peak}; the WHO line is {line}."
    id: "😷 Udara di {rooms} lebih kotor dari biasanya untuk jam ini: {peak}; batas WHO {line}."
    es: "😷 El aire en {rooms} está más sucio de lo habitual a esta hora: {peak}; el límite de la OMS es {line}."
  sustained:
    en: "😷 The air in {rooms} has been unhealthy for an hour: {peak}; the US EPA's unhealthy level is {unhealthy}."
    id: "😷 Udara di {rooms} sudah tidak sehat selama satu jam: {peak}; batas tidak sehat US EPA {unhealthy}."
    es: "😷 El aire en {rooms} lleva una hora siendo insalubre: {peak}; el nivel insalubre de la US EPA es {unhealthy}."
  danger:
    en: "🚨 DANGER: the air in {rooms} is very unhealthy: {peak}; the US EPA's unhealthy level is {unhealthy}."
    id: "🚨 BAHAYA: udara di {rooms} sangat tidak sehat: {peak}; batas tidak sehat US EPA {unhealthy}."
    es: "🚨 PELIGRO: el aire en {rooms} es muy insalubre: {peak}; el nivel insalubre de la US EPA es {unhealthy}."
  # An episode clears against its own rule's line (35 for sustained, the usual for unusual), not always the WHO's, so
  # the all-clear names no line it cannot vouch for.
  clear:
    en: "✅ The air in {rooms} has eased."
    id: "✅ Udara di {rooms} sudah mereda."
    es: "✅ El aire en {rooms} se ha calmado."
actions:
  - id: air/ventilate_and_purify
    when: {where: inside, outside_worse: false, outside_pm25_below: 35, home_has: purifier}
    say:
      en: "Open the windows and run the purifier for 30 minutes. Outside is cleaner, at {outside_pm25}."
      id: "Buka jendela dan nyalakan pemurni udara 30 menit. Di luar lebih bersih, {outside_pm25}."
      es: "Abre las ventanas y enciende el purificador 30 minutos. Fuera está más limpio, a {outside_pm25}."
  - id: air/ventilate
    when: {where: inside, outside_worse: false, outside_pm25_below: 35}
    say:
      en: "Open the windows and let the air through. Outside is cleaner, at {outside_pm25}."
      id: "Buka jendela dan biarkan udara mengalir. Di luar lebih bersih, {outside_pm25}."
      es: "Abre las ventanas y deja correr el aire. Fuera está más limpio, a {outside_pm25}."
  - id: air/keep_shut_purify
    when: {outside_worse: true, home_has: purifier}
    say:
      en: "Keep windows and doors shut and run the purifier. Outside is worse, at {outside_pm25}."
      id: "Tutup jendela dan pintu dan nyalakan pemurni udara. Di luar lebih buruk, {outside_pm25}."
      es: "Mantén ventanas y puertas cerradas y enciende el purificador. Fuera está peor, a {outside_pm25}."
  - id: air/keep_shut
    when: {outside_worse: true}
    say:
      en: "Keep windows and doors shut. Outside is worse, at {outside_pm25}."
      id: "Tutup jendela dan pintu. Di luar lebih buruk, {outside_pm25}."
      es: "Mantén ventanas y puertas cerradas. Fuera está peor, a {outside_pm25}."
  - id: air/find_source
    when: {}
    say:
      en: "Look for what started it, cooking, burning or dust, and keep people away from it."
      id: "Cari sumbernya, masak, pembakaran atau debu, dan jauhkan orang darinya."
      es: "Busca qué lo provocó, cocina, quema o polvo, y mantén a la gente lejos."
