# Air quality. Thresholds are US EPA / WHO 2021 and apply anywhere; the wording assumes a household.
# Fork this folder for your own city: the numbers that matter in Kerobokan are not the numbers that
# matter in Poblenou or Mayur Vihar, and the sentence that gets someone to act differs by language,
# building and season. Rule ids are namespaced automatically -> air-quality/<id>.
#
# AMBIENT REFERENCE. The comparison rules need a number for "outside". They take it from, in order:
#   1. nearby public outdoor sensors, if this node reads a network that has any in range;
#   2. the Copernicus CAMS model point sample, which ships everywhere on earth and needs no key.
# The message says which one it used, because a model at 11 km is not a measurement down the road.

- id: indoor_pm25_high
  level: act
  cooldown_minutes: 120
  # WHAT THIS RULE WATCHES, so the node can say how long an action took to work. The rule's SQL reads
  # `stats`, which is the present; it cannot be replayed over history. This names the indicator and
  # the line in the rule's own words, and GET /effect looks for the first hour after somebody acted
  # when that sensor's mean is back under it. tools/check_rules.py fails if `over` stops matching the
  # number in the SQL, because two places holding one threshold is how they come to disagree.
  # Omit it where "recovered" is not a threshold: inside_worse_ventilate is a RELATION between two
  # readings, and a number here would be a fiction.
  watch: {metric: pm25, over: 35.5}
  sql: |
    SELECT sensor_id, name, mean_15m FROM stats
    WHERE local AND indoor AND metric = 'pm25' AND mean_15m > 35.5
  message:
    en: "🏠😷 The air inside at {name} is unhealthy right now — past the US EPA line for fine particles ({line} µg/m³).\n\nFine particles are high enough to bother people with asthma, children and older people, and to tire anyone over a few hours.\n\n👉 Run the purifier if you have one. Before opening a window, check whether outside is any better; often it is not."
    id: "🏠😷 Udara di dalam {name} sedang tidak sehat — melewati batas US EPA untuk partikel halus ({line} µg/m³).\n\nPartikel halusnya cukup tinggi untuk mengganggu penderita asma, anak-anak dan orang tua, dan membuat siapa pun lelah dalam beberapa jam.\n\n👉 Nyalakan pembersih udara kalau ada. Sebelum membuka jendela, cek dulu apakah di luar lebih baik; sering kali tidak."
    es: "🏠😷 El aire dentro de {name} no es saludable ahora mismo — supera el límite de la EPA de EE. UU. para partículas finas ({line} µg/m³).\n\nHay partículas finas suficientes para afectar a personas con asma, a niños y a mayores, y para cansar a cualquiera en unas horas.\n\n👉 Enciende el purificador si tienes uno. Antes de abrir una ventana, mira si fuera está mejor; muchas veces no lo está."

- id: outside_worse_keep_shut
  level: act
  cooldown_minutes: 180
  sql: |
    WITH inside AS (
      SELECT sensor_id, name, mean_1h FROM stats
      WHERE local AND indoor AND metric = 'pm25' AND mean_1h IS NOT NULL),
    ambient AS (
      -- outside, in order: your own outdoor sensors; else the three nearest public references; else the model.
      -- Averaging every station within 15 km put an Uluwatu reading of 3 alongside your street's 15 (5 Sep).
      SELECT 1 AS rank, avg(mean_1h) AS v, count(*)::text || ' outdoor sensor(s) of yours' AS src
        FROM stats WHERE local AND NOT indoor AND metric = 'pm25'
         AND mean_1h IS NOT NULL AND silent_minutes < 120
       HAVING count(*) >= 1
      UNION ALL
      SELECT 2, avg(v), count(*)::text || ' nearest public sensors' FROM (
        SELECT mean_1h AS v FROM stats
         WHERE NOT local AND NOT indoor AND kind = 'sensor' AND metric = 'pm25'
           AND mean_1h IS NOT NULL AND silent_minutes < 120 AND lat IS NOT NULL
         ORDER BY power(lat - current_setting('planetai.lat')::float, 2)
                + power((lon - current_setting('planetai.lon')::float) * cos(radians(current_setting('planetai.lat')::float)), 2)
         LIMIT 3) n
       HAVING count(*) >= 1
      UNION ALL
      SELECT 3, value, 'the CAMS model for your area'
        FROM observations WHERE sensor_id = 'cams-point' AND metric = 'pm25_model'),
    best AS (SELECT v, src FROM ambient ORDER BY rank LIMIT 1)
    SELECT i.sensor_id, i.name, i.mean_1h AS inside, b.v AS outside, b.src
    FROM inside i, best b
    WHERE b.v > 35.5 AND b.v > 1.5 * i.mean_1h
  message:
    en: "🌫️🚪 Outside is worse than inside at {name}.\n\nThe street air is carrying more smoke or dust than your rooms right now, and your building is holding it out. Opening up would let it in.\n\n👉 Keep windows and doors shut until the air outside clears."
    id: "🌫️🚪 Di luar lebih buruk daripada di dalam di {name}.\n\nUdara jalan membawa lebih banyak asap atau debu daripada ruangan Anda, dan bangunan Anda menahannya. Membuka jendela akan memasukkannya.\n\n👉 Tutup jendela dan pintu sampai udara di luar bersih."
    es: "🌫️🚪 Fuera está peor que dentro en {name}.\n\nEl aire de la calle lleva más humo o polvo que tus habitaciones, y el edificio lo está dejando fuera. Abrir lo dejaría entrar.\n\n👉 Mantén ventanas y puertas cerradas hasta que el aire de fuera despeje."

- id: inside_worse_ventilate
  level: act
  cooldown_minutes: 180
  sql: |
    WITH inside AS (
      SELECT sensor_id, name, mean_1h FROM stats
      WHERE local AND indoor AND metric = 'pm25' AND mean_1h IS NOT NULL),
    ambient AS (
      -- outside, in order: your own outdoor sensors; else the three nearest public references; else the model.
      -- Averaging every station within 15 km put an Uluwatu reading of 3 alongside your street's 15 (5 Sep).
      SELECT 1 AS rank, avg(mean_1h) AS v, count(*)::text || ' outdoor sensor(s) of yours' AS src
        FROM stats WHERE local AND NOT indoor AND metric = 'pm25'
         AND mean_1h IS NOT NULL AND silent_minutes < 120
       HAVING count(*) >= 1
      UNION ALL
      SELECT 2, avg(v), count(*)::text || ' nearest public sensors' FROM (
        SELECT mean_1h AS v FROM stats
         WHERE NOT local AND NOT indoor AND kind = 'sensor' AND metric = 'pm25'
           AND mean_1h IS NOT NULL AND silent_minutes < 120 AND lat IS NOT NULL
         ORDER BY power(lat - current_setting('planetai.lat')::float, 2)
                + power((lon - current_setting('planetai.lon')::float) * cos(radians(current_setting('planetai.lat')::float)), 2)
         LIMIT 3) n
       HAVING count(*) >= 1
      UNION ALL
      SELECT 3, value, 'the CAMS model for your area'
        FROM observations WHERE sensor_id = 'cams-point' AND metric = 'pm25_model'),
    best AS (SELECT v, src FROM ambient ORDER BY rank LIMIT 1)
    SELECT i.sensor_id, i.name, i.mean_1h AS inside, b.v AS outside, b.src
    FROM inside i, best b
    WHERE i.mean_1h > 15 AND i.mean_1h > 1.5 * b.v
  message:
    en: "🔥🪟 Inside is worse than outside at {name}.\n\nSomething in the house is making smoke or fine dust: cooking, incense, a candle, a mosquito coil. The air outside is cleaner than what you are breathing.\n\n👉 Open a window or two and let it through. It clears faster than a purifier can catch it."
    id: "🔥🪟 Di dalam lebih buruk daripada di luar di {name}.\n\nAda yang membuat asap atau debu halus di rumah: memasak, dupa, lilin, obat nyamuk bakar. Udara di luar lebih bersih daripada yang Anda hirup.\n\n👉 Buka satu dua jendela dan biarkan mengalir. Lebih cepat bersih daripada menunggu pembersih udara."
    es: "🔥🪟 Dentro está peor que fuera en {name}.\n\nAlgo en la casa está haciendo humo o polvo fino: la cocina, incienso, una vela, un espiral antimosquitos. El aire de fuera está más limpio que el que respiras.\n\n👉 Abre una o dos ventanas y deja que corra. Se despeja más rápido de lo que un purificador lo atrapa."

- id: outdoor_pm25_high
  level: act
  cooldown_minutes: 180
  watch: {metric: pm25, over: 55.5}
  sql: |
    SELECT sensor_id, name, mean_1h FROM stats
    WHERE local AND NOT indoor AND metric = 'pm25' AND mean_1h > 55.5
  message:
    en: "🌫️🚨 The air outside at {name} is unhealthy for everyone — past the US EPA line ({line} µg/m³).\n\nThis is the level where healthy adults feel it too: a scratchy throat, tired eyes, a heavier chest with exertion. Burning season, most likely.\n\n👉 Close up. Put off outdoor work and exercise. Keep children and anyone with asthma or a heart condition indoors."
    id: "🌫️🚨 Udara di luar di {name} tidak sehat untuk semua orang — melewati batas US EPA ({line} µg/m³).\n\nDi tingkat ini orang dewasa sehat pun merasakannya: tenggorokan perih, mata lelah, dada berat saat bergerak. Kemungkinan musim bakar.\n\n👉 Tutup rumah. Tunda kerja dan olahraga di luar. Anak-anak dan penderita asma atau jantung tetap di dalam."
    es: "🌫️🚨 El aire fuera de {name} no es saludable para nadie — supera el límite de la EPA de EE. UU. ({line} µg/m³).\n\nA este nivel lo notan también los adultos sanos: garganta rasposa, ojos cansados, el pecho más pesado al esforzarse. Casi siempre es humo: quemas o calefacción.\n\n👉 Cierra todo. Aplaza el trabajo y el ejercicio al aire libre. Que los niños y quien tenga asma o problemas de corazón se queden dentro."

# ---------------------------------------------------------------- something changed, even if nothing is unhealthy yet
- id: indoor_spike
  level: warn
  cooldown_minutes: 90
  sql: |
    SELECT sensor_id, name, round(mean_15m::numeric) AS now, round(mean_24h::numeric) AS usual
    FROM stats
    WHERE local AND indoor AND metric = 'pm25'
      AND mean_15m IS NOT NULL AND mean_24h IS NOT NULL
      AND mean_15m >= 12 AND mean_15m >= 2.5 * greatest(mean_24h, 2)
  message:
    en: "📈🏠 Something just changed the air at {name}.\n\nFine particles indoors rose quickly in the last few minutes. It is not unhealthy yet, but a jump like this usually has a cause you can see: a pan on the fire, incense, a candle, smoke drifting in from outside.\n\n👉 Worth a look. If it keeps climbing to an unhealthy level, the node sends an alert."
    id: "📈🏠 Ada yang mengubah udara di {name}.\n\nPartikel halus di dalam naik cepat beberapa menit terakhir. Belum tidak sehat, tapi lonjakan seperti ini biasanya ada sebabnya: wajan di api, dupa, lilin, asap masuk dari luar.\n\n👉 Coba lihat. Kalau terus naik sampai tidak sehat, node ini mengirim peringatan."
    es: "📈🏠 Algo acaba de cambiar el aire en {name}.\n\nLas partículas finas dentro subieron rápido en los últimos minutos. Todavía no es insalubre, pero un salto así suele tener una causa a la vista: una sartén al fuego, incienso, una vela, humo que entra de fuera.\n\n👉 Vale la pena echar un vistazo. Si sigue subiendo hasta un nivel insalubre, el nodo envía una alerta."

- id: outdoor_spike
  level: warn
  cooldown_minutes: 90
  sql: |
    SELECT sensor_id, name, round(mean_15m::numeric) AS now, round(mean_24h::numeric) AS usual
    FROM stats
    WHERE NOT indoor AND kind = 'sensor' AND metric = 'pm25' AND silent_minutes < 60
      AND (local OR sqrt(power(lat - current_setting('planetai.lat')::float, 2)
                       + power((lon - current_setting('planetai.lon')::float) * cos(radians(current_setting('planetai.lat')::float)), 2)) < 0.03)
      AND mean_15m IS NOT NULL AND mean_24h IS NOT NULL
      AND mean_15m >= 15 AND mean_15m >= 2.5 * greatest(mean_24h, 2)
  message:
    en: "📈🌫️ The outside air at {name} just got worse.\n\nA sudden rise like this is almost always burning nearby: leaves, rubbish, a field. It may pass in an hour or it may settle in for the evening.\n\n👉 If it keeps rising, shut the windows before it comes indoors."
    id: "📈🌫️ Udara luar di {name} baru saja memburuk.\n\nKenaikan mendadak seperti ini hampir selalu karena pembakaran di dekat sini: daun, sampah, ladang. Bisa lewat dalam sejam, bisa juga menetap sampai malam.\n\n👉 Kalau terus naik, tutup jendela sebelum masuk ke dalam."
    es: "📈🌫️ El aire fuera de {name} acaba de empeorar.\n\nUna subida tan rápida casi siempre es algo quemándose cerca: hojas, basura, un campo. Puede pasar en una hora o quedarse toda la tarde.\n\n👉 Si sigue subiendo, cierra las ventanas antes de que entre."

# ---- kinded rules: the event engine's (docs/SPEC_alerts.md §3). The old engine skips any rule with `kind:`. ----
# The id and es strings below are ASSISTANT-WRITTEN.
# Starting values for the replay. Rows carry value, line, over and where (inside | outside).

- id: air_spike
  kind: spike
  issue: air
  level: warn
  cooldown_minutes: 60
  sql: |
    WITH q AS (SELECT r.sensor_id, s.name, s.indoor, r.bucket, r.mean FROM recent_15m r JOIN sensors s ON s.sensor_id = r.sensor_id
               WHERE r.metric = 'pm25' AND s.local AND r.bucket > now() - INTERVAL '75 minutes'),
         l AS (SELECT sensor_id, max(bucket) AS b FROM q GROUP BY 1),
         now_v AS (SELECT q.sensor_id, q.name, q.indoor, q.mean FROM q JOIN l ON l.sensor_id = q.sensor_id AND q.bucket = l.b),
         before AS (SELECT q.sensor_id, avg(q.mean) AS mean FROM q JOIN l ON l.sensor_id = q.sensor_id AND q.bucket < l.b GROUP BY 1),
         u AS (SELECT sensor_id, p90 FROM usual_by_hour WHERE metric = 'pm25' AND hour = CAST(extract(hour FROM now()) AS INTEGER))
    SELECT n.sensor_id, n.name, round(CAST(n.mean AS NUMERIC), 1) AS value,
           round(CAST(greatest(b.mean + 12, coalesce(u.p90, 0) + 10) AS NUMERIC), 1) AS line,
           n.mean >= b.mean + 12 AND n.mean >= coalesce(u.p90, 0) + 10 AS over,
           CASE WHEN n.indoor THEN 'inside' ELSE 'outside' END AS "where"
    FROM now_v n JOIN before b ON b.sensor_id = n.sensor_id LEFT JOIN u ON u.sensor_id = n.sensor_id
    WHERE n.mean >= b.mean + 7
  message:
    en: "PM2.5 jumped at {name}: {value} µg/m³."
    id: "PM2.5 melonjak di {name}: {value} µg/m³."
    es: "El PM2.5 subió de golpe en {name}: {value} µg/m³."

- id: air_unusual
  kind: unusual
  issue: air
  level: act
  cooldown_minutes: 60
  sql: |
    WITH a AS (SELECT r.sensor_id, s.name, s.indoor, r.mean FROM recent_15m r JOIN sensors s ON s.sensor_id = r.sensor_id
               WHERE r.metric = 'pm25' AND s.local AND r.bucket > now() - INTERVAL '1 hour'),
         u AS (SELECT sensor_id, p90 FROM usual_by_hour WHERE metric = 'pm25' AND hour = CAST(extract(hour FROM now()) AS INTEGER))
    SELECT a.sensor_id, a.name, round(CAST(avg(a.mean) AS NUMERIC), 1) AS value,
           round(CAST(min(u.p90) + 15 AS NUMERIC), 1) AS line, min(a.mean) >= min(u.p90) + 15 AS over,
           CASE WHEN bool_and(a.indoor) THEN 'inside' ELSE 'outside' END AS "where"
    FROM a JOIN u ON u.sensor_id = a.sensor_id
    GROUP BY a.sensor_id, a.name
    HAVING count(*) >= 3 AND avg(a.mean) >= min(u.p90) + 10
  message:
    en: "PM2.5 at {name} is {value} µg/m³, above its usual for the hour ({line})."
    id: "PM2.5 di {name} {value} µg/m³, di atas biasanya untuk jam ini ({line})."
    es: "El PM2.5 en {name} es {value} µg/m³, por encima de lo habitual a esta hora ({line})."

- id: air_sustained
  kind: sustained
  issue: air
  level: act
  cooldown_minutes: 60
  sql: |
    WITH a AS (SELECT r.sensor_id, s.name, s.indoor, r.mean FROM recent_15m r JOIN sensors s ON s.sensor_id = r.sensor_id
               WHERE r.metric = 'pm25' AND s.local AND r.bucket > now() - INTERVAL '1 hour')
    SELECT sensor_id, name, round(CAST(avg(mean) AS NUMERIC), 1) AS value, 35 AS line, min(mean) >= 35 AS over,
           CASE WHEN bool_and(indoor) THEN 'inside' ELSE 'outside' END AS "where"
    FROM a GROUP BY sensor_id, name
    HAVING count(*) >= 3 AND avg(mean) >= 30
  message:
    en: "PM2.5 at {name} has been {value} µg/m³ for an hour."
    id: "PM2.5 di {name} sudah {value} µg/m³ selama satu jam."
    es: "El PM2.5 en {name} lleva una hora en {value} µg/m³."

- id: air_extreme
  kind: danger
  issue: air
  level: act
  cooldown_minutes: 60
  sql: |
    SELECT r.sensor_id, s.name, round(CAST(r.mean AS NUMERIC), 1) AS value, 125.5 AS line, r.mean >= 125.5 AS over,
           CASE WHEN s.indoor THEN 'inside' ELSE 'outside' END AS "where"
    FROM recent_15m r JOIN sensors s ON s.sensor_id = r.sensor_id
    WHERE r.metric = 'pm25' AND s.local
      AND r.bucket = (SELECT max(bucket) FROM recent_15m WHERE sensor_id = r.sensor_id AND metric = 'pm25')
      AND r.mean >= 115
  message:
    en: "Very unhealthy air at {name}: {value} µg/m³ PM2.5."
    id: "Udara sangat tidak sehat di {name}: PM2.5 {value} µg/m³."
    es: "Aire muy insalubre en {name}: {value} µg/m³ de PM2.5."
