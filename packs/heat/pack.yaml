id: heat
name: Heat & comfort
description: >-
  Apparent temperature from temperature and humidity, heat-stress hours, and nights that never cool.
  Works with any sensor the node already reads that reports both. Pure SQL.
author: PLANETAI core (official, prototype)
version: 0.1.0
requires: { node: ">=0.10.0" }
kind: data
domain: heat
metrics: [temp, humidity]
scales: [community]
thresholds: >-
  Written for Kuta Selatan, Bali. Apparent temperature (Steadman / Australian BoM, no-wind form):
  AT = T + 0.33·e − 4.0, with e the vapour pressure in hPa from T and RH. 40 °C AT is the heat-index "danger"
  line; 28 °C overnight indoor minimum is the WHO comfort ceiling for sleep. The 35 °C stress line is ours,
  measured from node #1: the "extreme caution" 32 °C the pack shipped with is this place's year-round baseline,
  not an event. The Social cell keeps 32 °C, which is right for counting exposure. Tune in a fork for your place;
  packs/heat/README.md says how.
