# Apparent temperature in SQL. Steadman's no-wind form as used by the Australian BoM:
#   e  = rh/100 · 6.105 · exp(17.27·t / (237.7 + t))      vapour pressure, hPa
#   AT = t + 0.33·e − 4.0
# Indoors there is no wind term to subtract, which makes this the right form for a house.

- id: heat_stress_now
  level: act
  cooldown_minutes: 180
  sql: |
    WITH x AS (
      SELECT t.sensor_id, t.name, t.mean_15m AS t, h.mean_15m AS rh
      FROM stats t JOIN stats h ON h.sensor_id = t.sensor_id AND h.metric = 'humidity'
      WHERE t.local AND t.metric = 'temp' AND t.mean_15m IS NOT NULL AND h.mean_15m IS NOT NULL)
    SELECT sensor_id, name, round(t::numeric, 1) AS t, round(rh::numeric) AS rh,
           round((t + 0.33 * (rh/100.0 * 6.105 * exp(17.27*t/(237.7+t))) - 4.0)::numeric, 1) AS at
    FROM x
    WHERE (t + 0.33 * (rh/100.0 * 6.105 * exp(17.27*t/(237.7+t))) - 4.0) >= 32
  message:
    en: "🥵 It is dangerously hot at {name}: it feels like {at} °C.\n\nHumidity is stopping sweat from cooling the body, so the air feels hotter than the thermometer says and the strain builds quietly.\n\n👉 Drink water, move air, stop hard work, and check on anyone old, young or unwell."
    id: "🥵 Panas berbahaya di {name}: terasa seperti {at} °C.\n\nKelembapan menghambat keringat mendinginkan tubuh, jadi udara terasa lebih panas dari angka termometer dan beban menumpuk diam-diam.\n\n👉 Minum air, gerakkan udara, hentikan kerja berat, dan cek orang tua, anak kecil, atau yang sakit."

- id: heat_danger
  level: act
  cooldown_minutes: 120
  sql: |
    WITH x AS (
      SELECT t.sensor_id, t.name, t.mean_15m AS t, h.mean_15m AS rh
      FROM stats t JOIN stats h ON h.sensor_id = t.sensor_id AND h.metric = 'humidity'
      WHERE t.local AND t.metric = 'temp' AND t.mean_15m IS NOT NULL AND h.mean_15m IS NOT NULL)
    SELECT sensor_id, name,
           round((t + 0.33 * (rh/100.0 * 6.105 * exp(17.27*t/(237.7+t))) - 4.0)::numeric, 1) AS at
    FROM x
    WHERE (t + 0.33 * (rh/100.0 * 6.105 * exp(17.27*t/(237.7+t))) - 4.0) >= 40
  message:
    en: "🚨🥵 DANGER at {name}: it feels like {at} °C.\n\nThis is heatstroke territory. The body cannot shed heat at this level, and it goes wrong fast.\n\n👉 Cool the room or leave it. Wet skin, a fan, shade, water. Do not leave anyone alone in it."
    id: "🚨🥵 BAHAYA di {name}: terasa seperti {at} °C.\n\nIni wilayah heatstroke. Tubuh tidak bisa membuang panas di tingkat ini, dan cepat memburuk.\n\n👉 Dinginkan ruangan atau keluar. Basahi kulit, kipas, teduh, air. Jangan tinggalkan siapa pun sendirian di dalamnya."

- id: night_no_relief
  level: info
  cooldown_minutes: 1440
  sql: |
    SELECT r.sensor_id, s.name, round(min(r.min)::numeric, 1) AS night_min
    FROM readings_1h r JOIN sensors s USING (sensor_id)
    WHERE s.local AND s.indoor AND r.metric = 'temp'
      AND r.bucket > now() - interval '12 hours'
      AND extract(hour FROM r.bucket AT TIME ZONE current_setting('TimeZone')) NOT BETWEEN 7 AND 21
    GROUP BY r.sensor_id, s.name
    HAVING min(r.min) > 28 AND count(*) >= 5
  message:
    en: "🌙🥵 Last night never cooled down at {name}.\n\nWhen a room stays this warm all night, the body does not recover in sleep; people wake tired and the heat wears them down day by day.\n\n👉 Open up at the coolest hour, just before dawn. If this is every night, the room needs shade or airflow, not a bigger fan."
    id: "🌙🥵 Semalam tidak sempat dingin di {name}.\n\nKalau ruangan sehangat ini semalaman, tubuh tidak pulih saat tidur; orang bangun lelah dan panas menggerus hari demi hari.\n\n👉 Buka di jam terdingin, sebelum subuh. Kalau tiap malam begini, ruangan perlu peneduh atau aliran udara, bukan kipas lebih besar."
