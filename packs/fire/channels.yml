- { source: firms, metric: fires_nearest_km,      role: derived, comparable: false, unit: "km" }
- { source: firms, metric: fires_nearest_bearing, role: derived, comparable: false, unit: "°" }
- { source: firms, metric: fires_local_upwind,    role: derived, comparable: false, unit: "fires" }
- { source: firms, metric: fires_region_upwind,   role: derived, comparable: false, unit: "fires" }
