# A satellite's fire count is somebody else's measurement of somewhere else, worked out here into rings and
# directions: derived, never comparable, never pooled with an instrument at this address. Public, not private:
# the detections are NASA's open data, and nothing here says where the house is.
- { source: firms, metric: fires_local_24h,       role: derived, comparable: false, unit: "fires" }
- { source: firms, metric: fires_region_24h,      role: derived, comparable: false, unit: "fires" }
- { source: firms, metric: frp_local_mw,          role: derived, comparable: false, unit: "MW" }
