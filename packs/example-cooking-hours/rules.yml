# A worked example of a data pack. Copy this folder to start your own.
# Rule ids are namespaced automatically: this becomes `example-cooking-hours/post_cooking_summary`.
- id: post_cooking_summary
  level: info
  cooldown_minutes: 1440
  sql: |
    SELECT sensor_id, name, round(max(mean_15m))::int AS peak
    FROM stats
    WHERE local AND indoor AND metric = 'pm25'
      AND extract(hour FROM now() AT TIME ZONE current_setting('TimeZone')) BETWEEN 20 AND 23
    GROUP BY sensor_id, name
    HAVING max(mean_15m) > 35.5
  message:
    en: "🍳 Today's indoor air was worst around cooking time at {name}.\n\nThat is normal in any kitchen. The fix is timing, not equipment: a window open while the pan is on clears it faster than a purifier running afterwards."
    id: "🍳 Udara dalam terburuk hari ini sekitar waktu memasak di {name}.\n\nItu normal di dapur mana pun. Solusinya soal waktu, bukan alat: jendela terbuka saat wajan di api lebih cepat membersihkan daripada pembersih udara sesudahnya."
