- id: portal_gone_stale
  level: warn
  cooldown_minutes: 10080          # weekly at most
  sql: |
    SELECT sensor_id, name, round(value)::int AS pct FROM observations
    WHERE kind = 'portal' AND metric = 'datasets_fresh_pct' AND value < 10
  message:
    en: "🗄️ The city's open-data portal is going quiet.\n\nMost of what {name} publishes has not been updated in months. A portal that stops updating slowly becomes an archive, and the city loses a way to be checked.\n\n👉 Worth raising with whoever runs it."
    id: "🗄️ Portal data terbuka kota mulai sepi.\n\nSebagian besar yang diterbitkan {name} belum diperbarui berbulan-bulan. Portal yang berhenti diperbarui perlahan jadi arsip, dan kota kehilangan satu cara untuk diperiksa.\n\n👉 Layak disampaikan ke pengelolanya."
