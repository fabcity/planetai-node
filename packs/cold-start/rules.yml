# Every rule here works with zero sensors. They read `observations` (slow sources), not `stats` (sensors, 24h).

- id: modelled_air_today
  level: info
  cooldown_minutes: 10080   # weekly: the daily reports carry the model reading now
  long_cooldown_ok: true
  sql: |
    SELECT 'cams-point' AS sensor_id, round(value)::int AS pm
    FROM observations WHERE sensor_id = 'cams-point' AND metric = 'pm25_model'
  message:
    en: "🛰️ What a European air model thinks your air is like today.\n\nIt is a model, not a sensor at your address, and it sees your whole district as one square. A sensor at your window will disagree with it, sometimes a lot."
    id: "🛰️ Perkiraan model udara Eropa tentang udara Anda hari ini.\n\nIni model, bukan sensor di alamat Anda, dan model melihat seluruh kecamatan sebagai satu kotak. Sensor di jendela Anda akan berbeda, kadang jauh."
    es: "🛰️ Lo que un modelo europeo del aire cree de tu aire hoy.\n\nEs un modelo, no un sensor en tu dirección, y ve todo tu distrito como un solo cuadro. Un sensor en tu ventana le llevará la contraria, a veces mucho."

- id: hotter_than_normal
  level: info
  cooldown_minutes: 4320          # every three days at most
  sql: |
    WITH now_t AS (SELECT value AS t FROM observations WHERE sensor_id='om-point' AND metric='temp_model'),
         norm AS (SELECT value AS t FROM readings WHERE sensor_id='power-point' AND metric='temp_norm'
                  AND extract(month FROM ts) = extract(month FROM now()) LIMIT 1)
    SELECT 'power-point' AS sensor_id, round(now_t.t::numeric,1) AS today, round(norm.t::numeric,1) AS normal,
           round((now_t.t - norm.t)::numeric,1) AS delta
    FROM now_t, norm WHERE abs(now_t.t - norm.t) > 3
  message:
    en: "🌡️📅 This month is running away from normal here.\n\nCompared with forty years of records for this place, the temperature is well off its usual for the season. That matters for anything that minds heat: people, plants, a fridge, a server.\n\nAsk me for the numbers if you want them."
    id: "🌡️📅 Bulan ini menyimpang dari normal di sini.\n\nDibanding catatan empat puluh tahun untuk tempat ini, suhunya jauh dari biasanya untuk musim ini. Penting untuk apa pun yang peka panas: orang, tanaman, kulkas, server.\n\nTanya angkanya kalau mau."
    es: "🌡️📅 Este mes se está saliendo de lo normal aquí.\n\nComparado con cuarenta años de registros de este lugar, la temperatura está muy lejos de lo habitual para la estación. Eso importa a todo lo que sufre el calor: personas, plantas, un refrigerador, un servidor.\n\nPídeme los números si los quieres."

- id: sensor_vs_model
  level: info
  cooldown_minutes: 10080         # weekly — this is a calibration signal, not an alert
  sql: |
    WITH mine AS (SELECT avg(mean_24h) AS v FROM stats WHERE local AND NOT indoor AND metric='pm25'),
         model AS (SELECT value AS v FROM observations WHERE sensor_id='cams-point' AND metric='pm25_model')
    SELECT 'cams-point' AS sensor_id, round(mine.v::numeric) AS mine, round(model.v::numeric) AS modelled,
           round((mine.v - model.v)::numeric) AS delta
    FROM mine, model WHERE mine.v IS NOT NULL AND abs(mine.v - model.v) > 15
  message:
    en: "📏 Your sensor and a European air model disagree about your air.\n\nThe model sees a whole district; your sensor sees your street. When they differ by this much, the model is missing something local: burning, traffic, a kitchen.\n\nThat gap is what a sensor at your address is for."
    id: "📏 Sensor Anda dan model udara Eropa tidak sepakat soal udara Anda.\n\nModel melihat satu kecamatan; sensor Anda melihat jalan Anda. Kalau bedanya sebesar ini, model melewatkan sesuatu yang lokal: pembakaran, lalu lintas, dapur.\n\nSelisih itulah gunanya sensor di alamat Anda."
    es: "📏 Tu sensor y un modelo europeo del aire no se ponen de acuerdo sobre tu aire.\n\nEl modelo ve un distrito entero; tu sensor ve tu calle. Cuando difieren tanto, al modelo se le escapa algo local: quemas, tráfico, una cocina.\n\nPara eso sirve un sensor en tu dirección: para esa diferencia."
