# The sea is in `observations` (kind=model). Thresholds are a starting point for the south Bukit coast; fork for yours.
- id: heavy_swell
  level: info
  cooldown_minutes: 720
  sql: |
    WITH m AS (SELECT metric, value FROM observations WHERE sensor_id = 'marine-point')
    SELECT 'marine-point' AS sensor_id,
           round(h.value::numeric, 1) AS height, round(p.value::numeric) AS period, round(dir.value::numeric) AS dir
    FROM (SELECT value FROM m WHERE metric = 'swell_height_m') h,
         (SELECT value FROM m WHERE metric = 'swell_period_s') p,
         (SELECT value FROM m WHERE metric = 'wave_direction') dir
    WHERE h.value >= 2.5 AND p.value >= 12
  message:
    en: "🌊⚠️ A big, long-period swell is arriving.\n\nWaves like this travel from far away and carry a lot of energy. On exposed beaches that means strong currents and a heavy shore break, and small boats have a hard time.\n\n👉 Swim at protected beaches only. Small boats stay in. Experienced surfers only."
    id: "🌊⚠️ Ombak besar berperiode panjang sedang datang.\n\nOmbak seperti ini datang dari jauh dan membawa energi besar. Di pantai terbuka artinya arus kuat dan hempasan keras, dan perahu kecil kesulitan.\n\n👉 Berenang hanya di pantai terlindung. Perahu kecil jangan melaut. Peselancar berpengalaman saja."
    es: "🌊⚠️ Está llegando una marejada grande y de periodo largo.\n\nOlas así vienen de muy lejos y traen mucha energía. En playas expuestas eso significa corrientes fuertes y una rompiente pesada, y las embarcaciones pequeñas lo pasan mal.\n\n👉 Nadar solo en playas protegidas. Las embarcaciones pequeñas, en puerto. Surf solo con experiencia."

- id: sea_warm_anomaly
  level: info
  cooldown_minutes: 1440
  sql: |
    WITH now_t AS (SELECT value AS t FROM observations WHERE sensor_id = 'marine-point' AND metric = 'sea_surface_temp'),
         base AS (SELECT avg(value) AS t FROM readings WHERE sensor_id = 'marine-point' AND metric = 'sea_surface_temp'
                  AND ts BETWEEN now() - interval '60 days' AND now() - interval '7 days')
    SELECT 'marine-point' AS sensor_id, round(now_t.t::numeric, 1) AS today, round(base.t::numeric, 1) AS usual,
           round((now_t.t - base.t)::numeric, 1) AS delta
    FROM now_t, base WHERE base.t IS NOT NULL AND now_t.t - base.t >= 1.0
  message:
    en: "🌡️🐠 The sea is warmer than usual for this time of year.\n\nWhen warm water lingers for days, coral gets stressed and fish move. It matters to anyone who watches the reef, fishes, or runs a dive boat.\n\nNothing to do at home; worth knowing if the sea is part of your life."
    id: "🌡️🐠 Laut lebih hangat dari biasanya untuk musim ini.\n\nKalau air hangat bertahan beberapa hari, karang tertekan dan ikan berpindah. Penting bagi yang mengamati karang, memancing, atau menjalankan kapal selam.\n\nTidak ada yang perlu dilakukan di rumah; baik diketahui kalau laut bagian dari hidup Anda."
    es: "🌡️🐠 El mar está más cálido de lo normal para esta época.\n\nCuando el agua cálida se queda varios días, el coral se estresa y los peces se mueven. Importa a quien vigila el arrecife, pesca o lleva un barco de buceo.\n\nEn casa no hay nada que hacer; conviene saberlo si el mar es parte de tu vida."
