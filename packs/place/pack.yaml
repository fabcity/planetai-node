id: place
name: Place
description: >-
  What is around the node, from OpenStreetMap: buildings and how much ground they cover, shops and warungs, schools,
  clinics, temples, roads, green space, and the walk to the nearest of each. Structure and change, not behaviour.
  Kept in PostGIS on the node; refreshed monthly.
author: PLANETAI core (official, prototype)
version: 0.1.0
requires: { node: ">=0.26.0" }
kind: code
domain: place
metrics: [buildings, built_share, commercial_share, businesses_per_km2, poi_food, poi_retail, poi_education, poi_health, poi_worship, poi_lodging, poi_services, roads_km, green_share, nearest_school_m, nearest_health_m, nearest_market_m, nearest_worship_m]
scales: [community]
sources: [economic/community/openstreetmap, social/community/openstreetmap]
env:
  - "# place: radius around the node to describe, in metres, and how often to re-fetch from OpenStreetMap"
  - "PLACE_RADIUS_M=1000"
  - "PLACE_REFRESH_DAYS=30"
attribution: "© OpenStreetMap contributors, ODbL; fetched via the Overpass API"
