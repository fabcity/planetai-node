<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLANETAI</title>
<!-- The shell, and nothing else. The frozen layer first, then this page's own stylesheet; the
     renderer writes every element below #page. No inline style and no inline script: both are
     things a reader cannot diff and a gate cannot read without running the page. -->
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/planetai-theme.css">
<link rel="stylesheet" href="static/dashboard.css">
</head>
<body>
<!-- What a reader sees between opening the page and boot() answering, and the whole of it. The
     renderer overwrites #page the moment it has an answer; until then this is the page. It is here
     because #page shipped empty: a node whose database is wedged holds GET /issues open rather than
     erroring, and a household — or a wall screen nobody is watching — was left on blank paper with
     nothing to read. Classes only, no ids, all of them already in dashboard.css. -->
<div id="page">
  <header><div class="wrap"><h1 class="brand"><b>PLANETAI</b></h1></div></header>
  <div class="wrap"><p class="note">Asking the node&hellip;</p></div>
</div>
<!-- What the Set up pane says back. Chrome, not content: the renderer writes only #page. -->
<div class="toast" id="toast"></div>
<!-- The learn layer's panel, for the same reason as the toast: the renderer replaces #page on
     every render, and a panel inside it would close itself whenever the page redrew under it.
     Empty until a mark is pressed; the renderer fills it from static/learn.json. -->
<aside class="lpanel" id="learnpanel" role="dialog" aria-modal="false"
       aria-label="What this part of the page is" tabindex="-1"></aside>
<script src="static/dashboard.js"></script>
</body>
</html>
