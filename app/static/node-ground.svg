<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" data-variant="dark">
<title>The node's own resolution-8 cell 8895a4c86bfffff, its six neighbours, and its seven resolution-9 children. Hero ground for the node dashboard.</title>
<style>
  :root {
    --ground: #F9F5F2;
    --land:   #171717;
    --land-opacity: 0.12;
    --cells:  #20388D;
    --rings:  #00A057;
    --ink:    #171717;
  }
  svg[data-variant="dark"], .variant-dark {
    --ground: #171717;
    --land:   #F9F5F2;
    --land-opacity: 0.18;
    --cells:  #7FA5E8;
    --rings:  #00A057;
    --ink:    #F9F5F2;
  }
  .ground { fill: var(--ground); }
  .land   { fill: var(--land); fill-opacity: var(--land-opacity); }
  .cell   { fill: none; stroke: var(--cells); }
  .chain  { fill: var(--cells); stroke: var(--cells); }   /* the next frame's cell: data, opacity via attribute */
  .lit    { fill: var(--cells); stroke: var(--cells); }   /* a node's lit cell: same */
  .ring   { fill: none; stroke: var(--rings); }
  .hair   { fill: none; stroke: var(--ink); }
  .fig    { fill: var(--ink); }
  .label  { fill: var(--ink); font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
