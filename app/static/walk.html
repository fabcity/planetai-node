<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLANETAI · walk out</title>
<link rel="stylesheet" href="/static/planetai-theme.css">
<link rel="stylesheet" href="/static/maplibre-gl.css">
<style>
/* The walk out from the house (SPEC_mobile §11.2): the map pinned on top, the story scrolled under it, one step per
   scale. Opened from the phone page when it is unlocked; it is the one phone view that loads MapLibre. */
:root{--mute:#5F5A54;--hair:var(--fc-grid-line);--warm:#c8553d;--cool:#3b6ea5;--body:var(--fc-font-body)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.k{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#top{position:sticky;top:0;z-index:5;height:58vh;border-bottom:1px solid var(--ink);background:#dfe6ea}
#map{position:absolute;inset:0}
#bar{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 12px;background:linear-gradient(var(--ground) 60%,transparent)}
#bar a{font:800 13px var(--mono);color:var(--ink);text-decoration:none;white-space:nowrap}
.tg{display:flex;overflow-x:auto;border:1px solid var(--ink);margin-left:auto;scrollbar-width:none}
.tg button{all:unset;font:500 11px/1 var(--mono);padding:8px 10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
.tg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
#rail{position:absolute;right:10px;bottom:30px;z-index:2;display:flex;flex-direction:column;background:color-mix(in srgb,var(--ground) 88%,transparent);padding:6px 8px;border:1px solid var(--ink)}
#rail a{display:flex;align-items:center;gap:7px;min-height:22px;font:500 10px/1.5 var(--mono);color:var(--mute);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
#rail a s{width:7px;height:7px;border:1px solid var(--mute);border-radius:50%}
#rail a.on{color:var(--ink)}#rail a.on s{background:var(--ink);border-color:var(--ink)}
#rail a em{font-style:normal;margin-left:auto;padding-left:10px;color:var(--ink)}
.ch{min-height:88vh;padding:22px 16px 40px;border-bottom:1px solid var(--hair)}
.ch h2{font:600 24px/1.2 var(--fc-font-display,var(--body));margin:6px 0 4px}
.big{font:400 44px/1 var(--num-face,var(--mono));margin:14px 0 2px}.big i{font:500 13px var(--mono);font-style:normal;color:var(--mute);margin-left:4px}
.ch p{margin:10px 0;max-width:34em}.ch p.m{color:var(--mute);font-size:13px}
.none{display:inline-block;border:1px dashed var(--mute);color:var(--mute);padding:2px 8px;font:500 12px var(--mono);margin-top:12px}
svg.g{display:block;width:100%;height:auto;margin:16px 0 4px;overflow:visible}
.g text{font:10px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--ground);stroke-width:4px}
.locked{padding:40px 16px}
.nomap{position:absolute;left:12px;right:120px;top:40%;margin:0;font:500 12px/1.5 var(--mono);color:var(--mute)}
.maplibregl-ctrl-attrib{font-size:9px}
</style>
</head>
<body>
<div id="top"><div id="map"></div>
  <div id="bar"><a href="/?layout=mobile" id="nm">← PLANETAI</a><div class="tg" id="tg" role="group" aria-label="Issue"></div></div>
  <nav id="rail" aria-label="Scales"></nav></div>
<main id="chs"></main>
<script src="/static/doors-load.js"></script>
<script src="/static/maplibre-gl.js"></script>
<script src="/static/walk.js"></script>
</body>
</html>
