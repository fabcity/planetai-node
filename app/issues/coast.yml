# Coast. The sea at the nearest ocean grid cell.
#
# A context issue, like land: model-only, no rules at act level. It matters to a fisher, a surf
# school and a warung on the beach, and it asks nobody for anything.
#
# The id and es strings below are ASSISTANT-WRITTEN and have not been read by a native speaker.

name:
  en: Coast
  id: Pantai
  es: Costa

kind: context
metric: wave_height_m
unit: m
dp: 1

line: ~

packs:
  domains: [coast]
  rules: []

# A household does not measure the sea from its roof. Only the region column exists, and it is a
# model sampled at the nearest water cell — never closer than the pack's COAST_MAX_KM allows.
distances:
  room: ~
  yard: ~
  ring: ~
  region:
    from: observations
    sensor_id: marine-point
    metrics: [wave_height_m]

readouts:
  - metric: swell_height_m
    sensor_id: marine-point
    unit: m
    dp: 1
    label: { en: swell, id: alun, es: mar de fondo }
  # wave_period_s, not swell_period_s: the wave period is the one Open-Meteo Marine always answers
  # with, and it is the number a fisher reads. The swell period is carried in Figures when it is there.
  - metric: wave_period_s
    sensor_id: marine-point
    unit: s
    dp: 0
    label: { en: period, id: periode, es: periodo }
  - metric: sea_surface_temp
    sensor_id: marine-point
    unit: °C
    dp: 1
    label: { en: sea, id: laut, es: mar }

# A wave is not over a square of the map.
where:
  en: { region: at the nearest ocean cell }
  id: { region: di sel laut terdekat }
  es: { region: en la celda de océano más cercana }

sentences:
  en:
    state:
      context: "{n} {unit} {where}. {cmp}"
      none: "No marine model for this point: the nearest ocean cell is further out than the pack will report."
  id:
    state:
      context: "{n} {unit} {where}. {cmp}"
      none: "Tidak ada model laut untuk titik ini: sel laut terdekat lebih jauh daripada batas pack."
  es:
    state:
      context: "{n} {unit} {where}. {cmp}"
      none: "No hay modelo marino para este punto: la celda de océano más cercana está más lejos de lo que el pack informa."

empty:
  en: The coast pack reports nothing inland. It needs an ocean cell within COAST_MAX_KM of this node.
  id: Pack coast tidak melaporkan apa pun di pedalaman. Perlu sel laut dalam COAST_MAX_KM dari node ini.
  es: El pack coast no informa nada en el interior. Necesita una celda de océano a menos de COAST_MAX_KM del nodo.
