# Mosquitto for the node. Reachable on the LAN so a Meshtastic gateway (ESP32 with WiFi) can uplink to it.
# Authentication is required: `planetai meshtastic` creates the user and password and writes them to passwd
# (that file is a credential and is gitignored).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true      # who connected, from where, when — the first thing to read when nothing arrives
