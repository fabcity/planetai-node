# Core rules. Domain-blind on purpose: these work whatever a node is measuring.
# Anything about a specific metric — PM2.5, turbidity, kWh, machine hours — belongs in a pack (docs/PACKS.md).
# Variables from the `stats` view: sensor_id, metric, name, indoor, local, last, silent_minutes, mean_15m, mean_1h, mean_24h.

- id: sensor_silent
  level: warn
  cooldown_minutes: 720
  sql: |
    SELECT DISTINCT ON (sensor_id) sensor_id, name, silent_minutes FROM stats
    WHERE local AND silent_minutes > 90
  message:
    en: "📡 {name} has gone quiet.\n\nIt has not sent a reading for a while. Most often that is power or WiFi: a cable knocked loose, a router that rebooted, a battery that ran down.\n\n👉 Check that its light is on and that it is on the network."
    id: "📡 {name} tidak terdengar.\n\nSudah cukup lama tidak mengirim data. Biasanya soal listrik atau WiFi: kabel lepas, router restart, baterai habis.\n\n👉 Cek lampunya menyala dan tersambung ke jaringan."

- id: daily_pulse
  level: info
  cooldown_minutes: 1440
  sql: |
    SELECT 'node' AS sensor_id,
           count(DISTINCT sensor_id) FILTER (WHERE local) AS ours,
           count(DISTINCT sensor_id) FILTER (WHERE NOT local AND silent_minutes < 120) AS refs,
           count(DISTINCT metric) FILTER (WHERE local) AS metrics
    FROM stats HAVING count(*) > 0
  message:
    en: "🌅 Good morning from your node.\n\nIt kept watch through the night and is still listening to your sensors. If something matters today, you will hear about it here.\n\nAsk me anything about the air, the heat or the sea, whenever you like."
    id: "🌅 Selamat pagi dari node Anda.\n\nSemalam tetap berjaga dan masih mendengarkan sensor Anda. Kalau ada yang penting hari ini, Anda akan tahu dari sini.\n\nTanya apa saja tentang udara, panas, atau laut, kapan pun."
