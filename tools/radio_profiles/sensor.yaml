# A field sensor: a 3.3 V Grove sensor on a Tracker L1, on a battery, where there is no WiFi. GPS on so the
# reading knows where it was taken. Role SENSOR: the radio sleeps between readings and does not relay.
config:
  device:
    role: SENSOR
  position:
    gpsMode: ENABLED
    positionBroadcastSecs: 1800
    positionBroadcastSmartEnabled: false
module_config:
  telemetry:
    environmentMeasurementEnabled: true
    environmentUpdateInterval: 900   # 15 min: the node's cadence for mesh sensors (sources.py says PT15M)
    environmentDisplayFahrenheit: false
