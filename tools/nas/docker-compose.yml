# PLANETAI node backups, pulled onto a NAS hourly. Its own Compose project. Adjust the two host paths.
services:
  planetai-backup:
    image: python:3.12-alpine
    container_name: planetai-backup
    restart: unless-stopped
    command: ["python3", "-u", "/app/pull.py"]
    env_file: [.env]                       # PLANETAI_URL, PLANETAI_TOKEN, EVERY
    environment: [DEST=/data]
    volumes:
      - ./pull.py:/app/pull.py:ro
      - /volume1/backups/planetai:/data    # where the copies live on the NAS
    deploy: { resources: { limits: { memory: 128M } } }
