name: planetai
services:
  db:
    # Postgres 16 + PostGIS 3.4, and the ONLY tag of it that exists for arm64. `postgis/postgis:16-3.4-alpine`
    # publishes one manifest, linux/amd64 (checked 19 Sep 2026: a bare manifest.v2, no manifest list, config
    # says architecture=amd64) — which is why docs/KIT.md disqualified every Pi, Jetson and reComputer as a
    # node host. `imresamu/postgis` is a docker-postgis co-maintainer's build of the same recipe and publishes
    # linux/amd64 AND linux/arm64 for the same tag. An upstream CI choice was never our physics.
    #
    # NOT a Dockerfile of our own on `FROM postgres:16` + PGDG's postgresql-16-postgis-3. That builds in two
    # lines and works — and it is Debian, which is glibc, and the image we have been shipping is Alpine, which
    # is musl. A musl initdb records datcollate='en_US.utf8' and leaves datcollversion BLANK, because musl
    # reports no collation version; Postgres therefore has nothing to compare and issues NO warning. Opening
    # that data directory with a glibc build was measured on 19 Sep 2026: the node started, all 16 tables were
    # there, every query answered — and `bt_index_check('s_name')` failed with "item order invariant violated".
    # Silent index corruption on every text column, on every existing node, with the database's own mismatch
    # detector unable to see it. Staying on Alpine is what keeps "an existing node just switches" true.
    image: imresamu/postgis:16-3.4-alpine   # same data directory as postgres:16, and the same libc as the tag it replaces
    restart: unless-stopped
    environment:
      POSTGRES_USER: planetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planetai
    volumes:
      # DATA_DIR: a path on a LOCAL disk (another partition, an internal SSD). Default: a Docker volume. Never a NAS or
      # USB drive over a network filesystem: Postgres needs fsync and locking that SMB/NFS do not honour, and a bind
      # mount to an unmounted path becomes an empty local folder. Backups are how data reaches a NAS.
      - ${DATA_DIR:-db}:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetai"]
      interval: 10s
      retries: 10
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }   # every service is capped: an uncapped log fills the disk the database lives on

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://planetai:${POSTGRES_PASSWORD}@db:5432/planetai
      # empty unless the profile is on; the app starts its MQTT thread / reticulum fan-out only when set
      MQTT_HOST: ${MQTT_HOST:-}
      RETICULUM_URL: ${RETICULUM_URL:-}
    volumes:
      - ./config:/app/config:ro      # a directory, not a file: editors that save-by-replace would break a single-file mount
      - ./packs:/app/packs:ro        # community packs — see docs/PACKS.md
      - ./presets:/app/presets:ro    # site presets: `planetai run earth similar` reads the pilots' coordinates from here
      - ./data:/app/data:ro          # the vendored source registry (data/sources) and the platform floors — read, never written
      - ./out:/app/out               # the one writable path: artifacts a pack makes for you (images, charts, briefs)
      - ./backups:/app/backups:ro    # served at /backups (token) so a NAS can pull dumps without mounting anything
      - ./exports:/app/exports:ro    # served at /exports (public, CC BY 4.0)      # a directory, not a file: editors that save-by-replace would break a single-file mount
    ports: ["${APP_PORT:-8080}:8080"]     # host port; change APP_PORT in .env if 8080 is taken
    # The dashboard's ask pane asks Ollama on this machine, the same one the agent container asks.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # ---- optional layers. Off unless listed in COMPOSE_PROFILES in .env (planetai meshtastic / planetai reticulum set it)

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    restart: unless-stopped
    ports: ["1883:1883"]                 # LAN-reachable on purpose: the Meshtastic gateway radio publishes here
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - mosquitto:/mosquitto/data
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # A local model runs the node: Ollama on the host, this loop in a container, Telegram as the way to talk to it.
  # profile: agent   (planetai agent local sets it up)
  agent:
    build: ./app
    image: planetai-app
    profiles: ["agent"]
    restart: unless-stopped
    command: ["python", "agent_loop.py"]
    env_file: .env
    environment:
      MCP_URL: http://app:8080/mcp
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MODEL: ${AGENT_MODEL:-qwen3:4b}
      AGENT_NAME: ${AGENT_NAME:-local-model}
      TZ: ${NODE_TZ:-UTC}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [app]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }   # the agent logs every tool call

  # IPFS: publishes the daily export (aggregates, never raw) to the content-addressed commons. profile: ipfs
  ipfs:
    image: ipfs/kubo:v0.43.0        # pinned 10 Sep 2026, the current release: an unpinned kubo that
                                    # changes its data directory on a pull takes the CIDs with it
    profiles: ["ipfs"]
    restart: unless-stopped
    ports: ["4001:4001", "127.0.0.1:5001:5001", "127.0.0.1:8085:8080"]
    volumes:
      - ipfsdata:/data/ipfs
      - ./exports:/export:ro
    environment:
      IPFS_PROFILE: lowpower
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  reticulum:
    build: { context: ./app, dockerfile: Dockerfile.reticulum }
    profiles: [reticulum]
    restart: unless-stopped
    # No env_file here, on purpose (F2 of the 18 September design review). `env_file: .env` handed this
    # container every secret the node holds — the Telegram bot token, the online model key, the admin
    # token, the database password — to a process whose whole job is to speak to a public radio mesh.
    # It reads eight variables and this is all eight; `grep getenv app/reticulum_bridge.py` is the list.
    # A new one has to be added here, which is the point: it is a decision, not a default.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NODE_NAME: ${NODE_NAME:-node}
      NODE_API_URL: http://app:8080
      RETICULUM_CONFIGDIR: /etc/reticulum
      RETICULUM_DATA: /data
      RETICULUM_ALERT_DESTINATIONS: ${RETICULUM_ALERT_DESTINATIONS:-}
      RETICULUM_ANNOUNCE_S: ${RETICULUM_ANNOUNCE_S:-1800}
      # The bridge POSTs /actions when somebody on the mesh answers an alert. The weaker token on
      # purpose: it closes a loop, it cannot read a setting or a reading.
      ACT_TOKEN: ${ACT_TOKEN:-}
    # 4242: TCPServerInterface — Sideband/NomadNet/other nodes connect here (LAN or tailnet).
    # 4243: the bridge's own health/API port, loopback only — `planetai reticulum` and the doctor poll it from
    # the host, and without this line they never could, so a clean start still reported "the bridge did not come up".
    ports: ["4242:4242", "127.0.0.1:4243:4243"]
    volumes:
      - ./config/reticulum:/etc/reticulum:ro
      - reticulum:/data                  # identity + LXMF storage. Deleting it gives the node a new address.
    # For an RNode LoRa radio on Linux, add:   devices: ["/dev/ttyACM0:/dev/ttyACM0"]   and uncomment its block in config
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

volumes:
  db: {}
  mosquitto: {}
  reticulum: {}
  ipfsdata: {}
