name: planetai
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planetai
    volumes:
      # DATA_DIR: a path on a LOCAL disk (another partition, an internal SSD). Default: a Docker volume. Never a NAS or
      # USB drive over a network filesystem: Postgres needs fsync and locking that SMB/NFS do not honour, and a bind
      # mount to an unmounted path becomes an empty local folder. Backups are how data reaches a NAS.
      - ${DATA_DIR:-db}:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetai"]
      interval: 10s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://planetai:${POSTGRES_PASSWORD}@db:5432/planetai
      # empty unless the profile is on; the app starts its MQTT thread / reticulum fan-out only when set
      MQTT_HOST: ${MQTT_HOST:-}
      RETICULUM_URL: ${RETICULUM_URL:-}
    volumes:
      - ./config:/app/config:ro      # a directory, not a file: editors that save-by-replace would break a single-file mount
      - ./packs:/app/packs:ro        # community packs — see docs/PACKS.md
      - ./out:/app/out               # the one writable path: artifacts a pack makes for you (images, charts, briefs)
      - ./backups:/app/backups:ro    # served at /backups (token) so a NAS can pull dumps without mounting anything
      - ./exports:/app/exports:ro    # served at /exports (public, CC BY 4.0)      # a directory, not a file: editors that save-by-replace would break a single-file mount
    ports: ["${APP_PORT:-8080}:8080"]     # host port; change APP_PORT in .env if 8080 is taken
    depends_on:
      db: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # ---- optional layers. Off unless listed in COMPOSE_PROFILES in .env (planetai meshtastic / planetai reticulum set it)

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    restart: unless-stopped
    ports: ["1883:1883"]                 # LAN-reachable on purpose: the Meshtastic gateway radio publishes here
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - mosquitto:/mosquitto/data
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # A local model runs the node: Ollama on the host, this loop in a container, Telegram as the way to talk to it.
  # profile: agent   (planetai agent local sets it up)
  agent:
    build: ./app
    image: planetai-app
    profiles: ["agent"]
    restart: unless-stopped
    command: ["python", "agent_loop.py"]
    env_file: .env
    environment:
      MCP_URL: http://app:8080/mcp
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MODEL: ${AGENT_MODEL:-qwen3:4b}
      AGENT_NAME: ${AGENT_NAME:-local-model}
      BRIEF_HOUR: ${BRIEF_HOUR:-7}
      TZ: ${NODE_TZ:-UTC}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [app]

  # IPFS: publishes the daily export (aggregates, never raw) to the content-addressed commons. profile: ipfs
  ipfs:
    image: ipfs/kubo:latest
    profiles: ["ipfs"]
    restart: unless-stopped
    ports: ["4001:4001", "127.0.0.1:5001:5001", "127.0.0.1:8085:8080"]
    volumes:
      - ipfsdata:/data/ipfs
      - ./exports:/export:ro
    environment:
      IPFS_PROFILE: lowpower

  reticulum:
    build: { context: ./app, dockerfile: Dockerfile.reticulum }
    profiles: [reticulum]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_API_URL: http://app:8080
      RETICULUM_CONFIGDIR: /etc/reticulum
    ports: ["4242:4242"]                 # TCPServerInterface: Sideband/NomadNet/other nodes connect here (LAN or tailnet)
    volumes:
      - ./config/reticulum:/etc/reticulum:ro
      - reticulum:/data                  # identity + LXMF storage. Deleting it gives the node a new address.
    # For an RNode LoRa radio on Linux, add:   devices: ["/dev/ttyACM0:/dev/ttyACM0"]   and uncomment its block in config
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

volumes:
  db: {}
  mosquitto: {}
  reticulum: {}
  ipfsdata: {}
