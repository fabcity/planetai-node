<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 564">
<style>
.dg{--dg-ground:var(--ground,#F9F5F2);--dg-ink:var(--ink,#171717);--dg-mute:var(--mute,#5F5A54);--dg-cell:var(--cells,#20388D);--dg-ring:var(--rings,#00A057)}
@media (prefers-color-scheme:dark){.dg{--dg-ground:var(--ground,#171717);--dg-ink:var(--ink,#F9F5F2);--dg-mute:var(--mute,#A3A19F);--dg-cell:var(--cells,#7FA5E8);--dg-ring:var(--rings,#00A057)}}
.dg text{font-family:var(--fc-font-body,Figtree,system-ui,sans-serif);font-size:15px;fill:var(--dg-ink)}
.dg .dg-h{font-family:var(--fc-font-display,"Funnel Sans",Figtree,system-ui,sans-serif);font-size:18px;font-weight:700}
.dg .dg-m{font-family:var(--mono,ui-monospace,monospace)}
.dg .dg-b{font-weight:600}
.dg .dg-s{fill:var(--dg-mute)}
.dg .dg-ct{fill:var(--dg-cell)}
.dg-ln{fill:none;stroke:var(--dg-ink);stroke-width:1.5}
.dg-off{stroke-dasharray:5 4}
.dg-dot{stroke-dasharray:0.1 5;stroke-linecap:round;stroke-width:2.5}
.dg-hv{stroke-width:2.5}
.dg-hd{fill:var(--dg-ink)}
.dg-g{stroke:var(--dg-ring)}
.dg-gf{fill:var(--dg-ring)}
.dg-c{stroke:var(--dg-cell)}
.dg-cf{fill:var(--dg-cell);fill-opacity:.13}
.dg-gc{fill:var(--dg-ring);fill-opacity:.13}
.dg-gr{fill:var(--dg-ground)}
</style>
<rect x="20" y="20" width="220" height="494" class="dg-ln dg-hv"/>
<text x="38" y="52" class="dg-h">This machine</text>
<text x="38" y="92">raw readings</text>
<text x="38" y="118">exact coordinates</text>
<text x="38" y="144">the house's sentences</text>
<text x="38" y="170">room names</text>
<text x="38" y="204" class="dg-s">never leave</text>
<line x1="38" y1="414" x2="222" y2="414" class="dg-ln" style="stroke-width:1"/>
<text x="38" y="444">of where it is, only</text>
<text x="38" y="466">the centre of its</text>
<text x="38" y="488"><tspan class="dg-m">res 8</tspan> cell leaves</text>
<polyline points="240,42 282.0,42.0" class="dg-ln"/><path d="M290.0 42.0L280.0 47.0L280.0 37.0Z" class="dg-hd"/>
<text x="302" y="47" class="dg-b">The daily export</text>
<text x="302" y="68">hourly means, cells, ρ</text>
<text x="302" y="88" class="dg-s">CC BY 4.0, at every sharing level</text>
<polyline points="240,126 282.0,126.0" class="dg-ln"/><path d="M290.0 126.0L280.0 131.0L280.0 121.0Z" class="dg-hd"/>
<text x="302" y="131" class="dg-b">planetai.fab.city, GitHub</text>
<text x="302" y="152">the version check, the node list</text>
<text x="302" y="172" class="dg-s">they see the house's address only</text>
<polyline points="240,210 282.0,210.0" class="dg-ln dg-off"/><path d="M290.0 210.0L280.0 215.0L280.0 205.0Z" class="dg-hd"/>
<text x="302" y="215" class="dg-b">A parent node</text>
<text x="302" y="236">hourly means, alert times</text>
<text x="302" y="256" class="dg-s"><tspan class="dg-m">PARENT_API_URL</tspan> names it</text>
<polyline points="240,294 282.0,294.0" class="dg-ln dg-off"/><path d="M290.0 294.0L280.0 299.0L280.0 289.0Z" class="dg-hd"/>
<text x="302" y="299" class="dg-b">Telegram</text>
<text x="302" y="320">the alert's text</text>
<text x="302" y="340" class="dg-s">once you connect it</text>
<polyline points="240,378 282.0,378.0" class="dg-ln dg-off"/><path d="M290.0 378.0L280.0 383.0L280.0 373.0Z" class="dg-hd"/>
<text x="302" y="383" class="dg-b">The Fab City Index</text>
<text x="302" y="404">cells, from a pilot's city node</text>
<text x="302" y="424" class="dg-s">a token issued by hand</text>
<polyline points="240,462 282.0,462.0" class="dg-ln dg-off"/><path d="M290.0 462.0L280.0 467.0L280.0 457.0Z" class="dg-hd"/>
<text x="302" y="467" class="dg-b">Nine more</text>
<text x="302" y="488">IPFS, backups, an online model…</text>
<text x="302" y="508" class="dg-s">each off until someone turns it on</text>
<line x1="20" y1="546" x2="60" y2="546" class="dg-ln"/>
<text x="70" y="551" class="dg-s">on by default</text>
<line x1="230" y1="546" x2="270" y2="546" class="dg-ln dg-off"/>
<text x="280" y="551" class="dg-s">off until someone here turns it on</text>
</svg>
