<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462">
<style>
.dg{--dg-ground:var(--ground,#F9F5F2);--dg-ink:var(--ink,#171717);--dg-mute:var(--mute,#5F5A54);--dg-cell:var(--cells,#20388D);--dg-ring:var(--rings,#00A057)}
@media (prefers-color-scheme:dark){.dg{--dg-ground:var(--ground,#171717);--dg-ink:var(--ink,#F9F5F2);--dg-mute:var(--mute,#A3A19F);--dg-cell:var(--cells,#7FA5E8);--dg-ring:var(--rings,#00A057)}}
.dg text{font-family:var(--fc-font-body,Figtree,system-ui,sans-serif);font-size:15px;fill:var(--dg-ink)}
.dg .dg-h{font-family:var(--fc-font-display,"Funnel Sans",Figtree,system-ui,sans-serif);font-size:18px;font-weight:700}
.dg .dg-m{font-family:var(--mono,ui-monospace,monospace)}
.dg .dg-b{font-weight:600}
.dg .dg-s{fill:var(--dg-mute)}
.dg .dg-ct{fill:var(--dg-cell)}
.dg-ln{fill:none;stroke:var(--dg-ink);stroke-width:1.5}
.dg-off{stroke-dasharray:5 4}
.dg-dot{stroke-dasharray:0.1 5;stroke-linecap:round;stroke-width:2.5}
.dg-hv{stroke-width:2.5}
.dg-hd{fill:var(--dg-ink)}
.dg-g{stroke:var(--dg-ring)}
.dg-gf{fill:var(--dg-ring)}
.dg-c{stroke:var(--dg-cell)}
.dg-cf{fill:var(--dg-cell);fill-opacity:.13}
.dg-gc{fill:var(--dg-ring);fill-opacity:.13}
.dg-gr{fill:var(--dg-ground)}
</style>
<rect x="30" y="20" width="370" height="62" class="dg-ln"/>
<text x="44" y="47" class="dg-h">Sense</text>
<text x="44" y="70" class="dg-s">your sensors, stations, portals, models</text>
<polyline points="115,82 115.0,124.0" class="dg-ln"/><path d="M115.0 132.0L110.0 122.0L120.0 122.0Z" class="dg-hd"/>
<text x="130" y="113" class="dg-s">readings</text>
<rect x="30" y="132" width="170" height="64" class="dg-ln"/>
<text x="44" y="159" class="dg-h">Observe</text>
<text x="44" y="182" class="dg-s">what is read here</text>
<rect x="230" y="132" width="170" height="64" class="dg-ln"/>
<text x="244" y="159" class="dg-h">Decide</text>
<text x="244" y="182" class="dg-s">what to do</text>
<rect x="230" y="262" width="170" height="64" class="dg-ln"/>
<text x="244" y="289" class="dg-h">Act</text>
<text x="244" y="312" class="dg-s">a person is asked</text>
<rect x="30" y="262" width="170" height="64" class="dg-ln"/>
<text x="44" y="289" class="dg-h">Measure</text>
<text x="44" y="312" class="dg-s">whether it worked</text>
<polyline points="200,164 222.0,164.0" class="dg-ln"/><path d="M230.0 164.0L220.0 169.0L220.0 159.0Z" class="dg-hd"/>
<polyline points="315,196 315.0,254.0" class="dg-ln"/><path d="M315.0 262.0L310.0 252.0L320.0 252.0Z" class="dg-hd"/>
<polyline points="230,294 208.0,294.0" class="dg-ln"/><path d="M200.0 294.0L210.0 289.0L210.0 299.0Z" class="dg-hd"/>
<polyline points="115,262 115.0,204.0" class="dg-ln"/><path d="M115.0 196.0L120.0 206.0L110.0 206.0Z" class="dg-hd"/>
<rect x="490" y="262" width="130" height="64" class="dg-ln"/>
<text x="504" y="289" class="dg-h">A person</text>
<text x="504" y="312" class="dg-s">phone or page</text>
<polyline points="400,294 482.0,294.0" class="dg-ln"/><path d="M490.0 294.0L480.0 299.0L480.0 289.0Z" class="dg-hd"/>
<text x="445" y="266" class="dg-s" text-anchor="middle">act-level</text>
<text x="445" y="284" class="dg-b" text-anchor="middle">alert sent</text>
<polyline points="555,326 555,376 115,376 115.0,334.0" class="dg-ln dg-g dg-hv"/><path d="M115.0 326.0L120.0 336.0L110.0 336.0Z" class="dg-gf"/>
<text x="335" y="400" class="dg-b" text-anchor="middle">answered: acknowledged or acted</text>
<text x="30" y="444">ρ = alerts answered within 24 h ÷ act-level alerts sent, over 30 days</text>
</svg>
