<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1d1c1a;--mute:#7a766e;--hair:#d9d4ca;--ground:#f6f3ee;--blue:#2f5bd3}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:18px 16px 4px}header small{display:block;color:var(--mute);font:11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
h1{font-size:22px;margin:4px 0 0;font-weight:600}
.tabs{display:flex;gap:8px;padding:10px 16px}.tabs b{font:12px ui-monospace,monospace;padding:4px 10px;border:1px solid var(--ink);border-radius:20px}.tabs b.on{background:var(--ink);color:var(--ground)}
svg{display:block;margin:0 auto;touch-action:none}
.seg{stroke:var(--ground);stroke-width:1.2}.line{fill:none;stroke:var(--ink);stroke-dasharray:3 3;stroke-width:1}
.tick{font:10px ui-monospace,monospace;fill:var(--mute)}.mid{text-align:center;padding:0 28px}
.mid .h{font:12px ui-monospace,monospace;color:var(--mute);margin-top:-6px}.mid .t{font-size:19px;font-weight:600;margin:6px 0}.mid .g{color:var(--mute)}
.legend{font-size:12px;color:var(--mute);padding:14px 16px}
</style></head><body>
<header><small>bayu-ungasan · the last 24 hours</small><h1 id="lead"></h1></header>
<div class="tabs"><b class="on" data-k="air">Air</b><b data-k="heat">Heat</b></div>
<svg id="dial" width="358" height="358" viewBox="-179 -179 358 358"></svg>
<div class="mid" style="margin-top:6px"><div class="h" id="hh"></div><div class="t" id="ht"></div><div class="g" id="hg"></div></div>
<p class="legend">Now is at the top; the hours run back anticlockwise. Each wedge is one hour inside the house, its length the reading; the dashed circle is the line. Drag round the dial to read an hour.</p>
<script>
let D, K = 'air', SEL = null;
const $ = s => document.querySelector(s);
async function load() { D = await (await fetch('/issues/days?days=2')).json(); draw(); }
function draw() {
  const I = D.issues[K], n = 24, B = D.buckets.slice(-n), s = (I.series[I.distance] || I.series.room).slice(-n), H = I.hours.en.slice(-n);
  const line = I.line.value, max = Math.max(line * 1.25, ...s.filter(v => v != null)), R0 = 56, R1 = 138;
  const r = v => R0 + (R1 - R0) * Math.min(v, max) / max, a = i => -Math.PI / 2 - (n - 1 - i) * 2 * Math.PI / n;
  let g = '';
  s.forEach((v, i) => {
    const a0 = a(i) - Math.PI / n + .02, a1 = a(i) + Math.PI / n - .02, rr = v == null ? R0 + 4 : r(v), over = v != null && v >= line;
    const P = (rad, ang) => `${(rad * Math.cos(ang)).toFixed(1)},${(rad * Math.sin(ang)).toFixed(1)}`;
    g += `<path class="seg" data-i="${i}" d="M${P(R0, a0)}L${P(rr, a0)}A${rr},${rr} 0 0 1 ${P(rr, a1)}L${P(R0, a1)}A${R0},${R0} 0 0 0 ${P(R0, a0)}Z"
      fill="${v == null ? 'var(--hair)' : over ? 'var(--ink)' : 'var(--blue)'}" opacity="${i === (SEL ?? n - 1) ? 1 : .55}"/>`;
    if (i % 6 === 5 || i === n - 1) { const t = B[i].slice(11, 16), x = (R1 + 22) * Math.cos(a(i)), y = (R1 + 22) * Math.sin(a(i));
      g += `<text class="tick" x="${x}" y="${y + 3}" text-anchor="middle">${i === n - 1 ? 'now' : t}</text>`; }
  });
  g += `<circle class="line" r="${r(line)}"/><text class="tick" x="4" y="${-r(line) - 4}">line ${line} ${I.line.unit}</text>`;
  $('#dial').innerHTML = g;
  const i = SEL ?? n - 1; $('#hh').textContent = i === n - 1 ? 'NOW' : B[i].slice(11, 16);
  $('#ht').textContent = H[i][0]; $('#hg').textContent = H[i][1];
  $('#lead').textContent = K === 'air' ? 'How the air went today' : 'How the heat went today';
  window.SEG = n;
}
const pick = e => { const b = $('#dial').getBoundingClientRect(), x = e.clientX - b.left - b.width / 2, y = e.clientY - b.top - b.height / 2;
  let ang = Math.atan2(y, x) + Math.PI / 2; if (ang < 0) ang += 2 * Math.PI; const back = Math.round((2 * Math.PI - ang) / (2 * Math.PI / 24)) % 24;
  SEL = 23 - back; draw(); };
$('#dial').addEventListener('pointerdown', e => { pick(e); $('#dial').onpointermove = pick; });
addEventListener('pointerup', () => { $('#dial').onpointermove = null; });
document.querySelectorAll('.tabs b').forEach(b => b.onclick = () => { K = b.dataset.k; SEL = null; document.querySelectorAll('.tabs b').forEach(x => x.classList.toggle('on', x === b)); draw(); });
window.selectHour = i => { SEL = i; draw(); };
load();
</script></body></html>
