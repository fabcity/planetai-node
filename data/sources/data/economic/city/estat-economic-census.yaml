notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). 政府統計コード

  00200553. Formats Excel (366 files), DB (225), PDF (18).

  市区町村 granularity confirmed.


  Serves two Economic|City sub-cells at once: business registry / density, and

  employment by sector. It is the only route to either for Kamakura, since no

  municipal business register is published by the city.


  API requires a free e-Stat appId on every call.'
