name: SICONFI RREO - Relatorio Resumido da Execucao Orcamentaria (municipios)
url: https://www.tesourotransparente.gov.br/ckan/dataset/api-rreo-entes
description: |
  Brazil's National Treasury bimonthly budget-execution report for every one of
  the 5,570 municipalities, as a JSON API keyed on the IBGE municipality code.
  Carries planned and executed revenue and expenditure-by-function in one schema.
pillar: economic
scale: city
status: live
license: Open Data Commons Open Database License (ODbL)
api: https://apidatalake.tesouro.gov.br/ords/siconfi/tt/rreo
