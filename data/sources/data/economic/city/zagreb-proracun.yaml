name: Proracun Grada Zagreba
url: https://data.zagreb.hr/dataset/proracun-grada-zagreba-2026
description: |
  Consolidated City of Zagreb budget - planned revenue and expenditure by
  year, published as XLSX and CSV on the city open data portal. Two datasets
  cover 2026 (plus 2027-2028 projections) and 2022-2025.
pillar: economic
scale: city
