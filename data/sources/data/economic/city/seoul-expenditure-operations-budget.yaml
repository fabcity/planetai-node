notes: 'DEPRECATED 2026-09-19. The dataset page now returns the termination notice the portal itself renders — 서비스 종료 안내 / 해당 데이터는 종료된 서비스입니다, "this data is a terminated service". Read in a browser, not inferred from a status code: the page 404s to any client without Javascript, so a link checker cannot tell this apart from a portal that simply dislikes scripts. Marked rather than removed, per CONTRIBUTING: what this entry recorded was true when it was harvested on 2026-09-11, and the Korean city tier is thin enough that the gap should stay visible. A replacement should be found by searching 열린데이터광장 for a successor id, not by trusting this one.

  Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12, Asia). First published

  2016-06-10; data current to 2026-08-12 at time of check. Cadence 정기(매일) - daily,

  which makes this one of the highest-cadence executed-budget feeds in the index.


  Planned and executed in the SAME ROW: 예산현액 (current budget available),

  지출액 (expenditure), 집행잔액 (unexecuted balance).


  STATED COVERAGE LIMIT: excludes the 25 자치구 and subordinate institutions

  (자치구 및 산하기관 제외). Expenditure reflects through the previous day only.

  For the gu tier use economic/region/lofin365-local-finance-yearbook-budget.


  Classification is the Korean 분야/부문 structure. NO published COFOG crosswalk

  at any of the four Korean rungs - 분야/부문 is COFOG-adjacent by design but no

  official mapping table was found. Building it is unavoidable work, not a lookup.


  Korea FY = calendar year; KRW nominal. Paired revenue dataset is OA-13268

  (not individually verified in this pass).


  Seoul API pattern: http://openapi.seoul.go.kr:8088/{KEY}/{TYPE}/{SERVICE}/{START}/{END}/

  Max 1,000 records per request. Service name not captured - resolve from the

  dataset page. robots.txt is "User-agent: * / Allow: /" - nothing disallowed.'
