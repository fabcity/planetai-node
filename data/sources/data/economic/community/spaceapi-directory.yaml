name: SpaceAPI Directory
url: https://spaceapi.io/
description: |
  A curated list of 251 hacker-, maker- and fab spaces that publish a SpaceAPI
  JSON endpoint. The Directory itself is a name-to-URL map; each space's own
  endpoint carries its location, contact details and whether it is open right now.
