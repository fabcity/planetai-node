notes: |
  2026-09-19: the recorded landing page 404s - iadb.org/research/latin-american-klems-database, read in a browser and not only by a link checker. No successor URL was found, and iadb.org answers 403 to a script, so the search has to be done by a person. Marked stale rather than deprecated: the database may well still exist under a different path. It is the only Latin American productivity source in the list and pilot_relevance names Santiago, so it is worth the ten minutes.
  Bulk download via the IDB research portal. Chile coverage is
  detailed at NACE 2-digit. Combined with Atlas of Economic Complexity
  this gives the Santiago pilot a coherent Region-tier productivity
  + complexity layer that Metroverse alone cannot provide
  (Metroverse is metro-area; LAKLEMS is national-by-sector).
