notes: |
  VERIFIED 2026-09-28 and read for a real territory: fabcity/fci-index (santiago_trade_adjusted), Gran Santiago, IX and VIII EPF. Filed for #42: the consumption side of Santiago's goods index.

  LICENCE. INE's terms, as for economic/region/ine-chile-enia: CC BY-SA 4.0.

  ENDPOINT. The published tables (`tabulados-principales-resultados-*-epf-(estimaciones).xlsx`). Group spending is in the CUADRO 6 sheet whose header names GRAN SANTIAGO (6C in IX, 6B in VIII). Households and persons are in the CUADROS 3 block for Gran Santiago. The microdata (`base-gastos-ix-epf-(formato-csv).csv`, 152 MB, with the expansion factor `fe` and a 5-level `ccif`) are also published.

  FIGURES, Gran Santiago, IX EPF: 2,492,868 households and 7,440,518 persons. Spending in CLP per household per month: 1,590,105 in total, food 265,347, clothing 28,523, medicines and health products 46,660, information and communication equipment 36,615.

  WHY THIS CELL. Economic|Region's regional accounts: household spending by purpose, which the goods index sets production against.

  WHAT IT DOES NOT CLAIM. The survey covers Gran Santiago, the urban area, not the whole Región Metropolitana. The two rounds use different COICOP editions, so groups 08 and 09 do not match across them. Spending is in the survey period's prices and excludes imputed rent.
