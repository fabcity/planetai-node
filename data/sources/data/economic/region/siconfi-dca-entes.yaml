name: SICONFI DCA - Declaracao de Contas Anuais (estados e municipios)
url: https://www.tesourotransparente.gov.br/ckan/dataset/api-extrato-entes
description: |
  Brazil's National Treasury annual accounts declaration for states and
  municipalities as a JSON API, keyed on the IBGE code. Gives the state-tier
  budget rung - gross realised revenue, deductions and transfers down.
