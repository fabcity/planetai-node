notes: |
  VERIFIED 2026-09-27, not yet read for a real territory. Filed for #42: the consumption side of São Paulo's and Recife's goods index.

  LICENCE. IBGE's terms, as for ibge-pia-empresa-uf: reuse with IBGE cited as the source.

  ENDPOINT. SIDRA API, no key, one period ("2018" = the 2017-2018 survey). Variable 1201, R$ per family per month; c339 = 7999 (all incomes); c12190 types: 103626 food at home (table 6972), 103554 clothing, 103575 medicines, 8026 furniture and household articles, 111442 appliances, 103594 phones and accessories, 103593 toys and games (table 6715). SP: food at home 499.82, clothing 180.99, medicines 169.43; PE: 402.27, 155.36, 105.64. Families (table 6977): SP 15,635,512, PE 3,021,057.

  WHY THIS CELL. Economic|Region's regional accounts: household spending by purpose, which the goods index sets production against.

  WHAT IT DOES NOT CLAIM. Not COICOP: TVs and computers sit inside appliances with fridges, so electronics can be read as phones only. One survey wave (2017-2018), state level only, reais of that period.
