notes: |
  Added 2026-09-11 in the FCI Regime 1 harvest (wave 13, Georgia).

  A STRUCTURAL DETAIL A CONNECTOR MUST KNOW: this node's children are
  METHODOLOGY VERSIONS, NOT SUBJECTS. It resolves to exactly two
  sub-nodes, "System of National Accounts 1993 (SNA 1993)" and "System
  of National Accounts 2008 (SNA 2008)". Georgia versions its national
  accounts by methodology first, subject second. Wire to SNA 2008 and
  know that the 1993 branch is a different vintage of the same country,
  not a different topic.

  NO REGIONAL GDP NODE AT THIS LEVEL. Regional accounts, if published,
  are nested deeper inside the SNA 2008 branch or live on the separate
  sna.geostat.ge sub-portal, which was NOT fetched this pass. Recorded
  as an open question, not an absence.

  Same PX-Web 2015 Dec build caveats and same Abkhazia/South Ossetia
  coverage gap as environmental/region/geostat-pxweb-environment - see
  that entry's notes.

