notes: |
  VERIFIED 2026-09-26, not yet read for a real territory.

  LICENCE. Eurostat's copyright notice authorises reuse "provided the source is
  acknowledged" (2011/833/EU). The CC-BY-4.0 on the website covers editorial content only.

  ENDPOINT. Key-free JSON-stat, updated 2026-09-24. Filter by rep_airp and tra_meas:
  FRM_NLD is freight and mail unloaded (inwards), FRM_LD loaded (outwards); unit T;
  schedule and tra_cov TOTAL; freq A. 2024, tonnes in / out: Barcelona El Prat (ES_LEBL)
  87,094 / 95,432; Hamburg (DE_EDDH) 16,254 / 13,603; Paris Charles de Gaulle (FR_LFPG)
  938,224 / 974,594; Paris Orly (FR_LFPO) 22,480 / 49,312.

  WHY THIS CELL. The airport half of Economic|Bioregion's gateway row ("Goods imported and
  exported through the territory's ports and airports"), beside the maritime entry. Air
  freight is small by weight (Barcelona 0.18 Mt against 55.5 Mt by sea in 2024) and large
  by value, so a tonnage-only row understates it and the entry says so.

  WHAT IT DOES NOT CLAIM. Tonnes handled at the airport, not goods consumed in its city:
  hub airports tranship. Mail is included with freight. Road and rail are not in it.
