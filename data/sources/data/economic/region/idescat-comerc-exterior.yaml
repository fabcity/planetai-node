notes: |
  LIVE 2026-09-26. Read for a real territory by fabcity/fci-index `compute/trade.py` `regional()` (fci-index#19): the province of Barcelona and Catalonia, 2019 and 2024, in the Index's regional_trade output. There is no `adapter`, because that field names only planetai-node readers. What backs `live` is Tomas Diez's review for Barcelona (usable-with-caveats, #54, reviews/). Filed for #42.

  LICENCE. Idescat's legal notice (idescat.cat/institut/web) allows reuse "provided that its source is quoted, that the content of the information is not altered or denatured and that the date of the latest update ... is mentioned". These are Spain's default public-sector reuse conditions (Ley 37/2007), and no licence is named. Idescat may limit reuse to protect personal data or third-party rights, and users may not imply that Idescat endorses them. A reviewer should confirm this counts as open-equivalent.

  ENDPOINT. Key-free JSON-stat, table 18132 (annual) and 18136 (monthly), updated 2026-02-24. Province of Barcelona (PROV=08), 2024: imports 87.45 bn EUR and 25.33 Mt, exports 77.17 bn EUR and 19.85 Mt. Values are thousand EUR and weights are kg. Idescat flags 2024 and 2025 as provisional (status "p"), so both years can still move.

  WHY THESE CELLS. Economic|Region's external-trade row, in value. The weight columns are the regional import and export terms of a material-flow account (Economic|Bioregion), and MOD_TRANS splits them by sea, air, road and rail, which the gateway row cannot do.

  WHAT IT DOES NOT CLAIM. Customs attribute trade to the declarant's address, not to where goods are made or used. Trade with the rest of Spain is not in it.

  BLOCKED ALTERNATIVE. DataComex (Ministerio de Economía) has the same data for every province, but its API needs an email and password, and its footer reads "Todos los derechos reservados".
