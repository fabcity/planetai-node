notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). The most granular

  fiscal object found anywhere in this wave.


  Description verbatim: 「直近２年間の神奈川県における歳出予算の1件ごとの支出情報

  （企業会計を除く）」 - general and special accounts, enterprise accounts excluded.


  ROLLING 2-YEAR WINDOW ONLY (currently 2024-06 to 2026-05). Older months are

  dropped from the catalogue, so history is lost unless harvesting starts now and

  runs continuously. Cadence 月1回; last updated 2026-08-31.


  Classification is the appropriation structure, not COFOG; no crosswalk.

  JPY nominal. Publisher 神奈川県会計局.


  The host CKAN''s /api/ is robots-disallowed (Crawl-Delay: 10) - harvest via the

  dataset HTML pages or seek permission.'
