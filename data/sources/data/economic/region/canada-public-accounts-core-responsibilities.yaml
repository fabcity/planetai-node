notes: |
  Added 2026-09-11 in the FCI Regime 1 harvest (wave 13). Canada
  national rung.

  WHY THIS ONE AND NOT THE PARENT. The Public Accounts of Canada proper
  (package 350b4f13-d84a-4e94-b221-1109dc00ab39, 30 resources covering
  1995-2025) is HTML ONLY. The machine-readable value sits in its
  siblings, and this is the sibling that carries the functional cut.
  Departmental core responsibilities are Canada's nearest analogue to a
  COFOG function - not a crosswalk, but the axis you would build one on.

  Sibling worth knowing: Ministerial Revenues as per Public Accounts
  (e5e419f8-7219-4faa-8b0d-22c006b5434f), CSV, 43 resources, 2015-2025,
  revenue in thousands by department. Not added separately - revenue by
  department is thin for FCI purposes, but it is there if the
  revenue-side question comes up.

  Execution side, not appropriation: pair with
  economic/region/canada-main-estimates for the budget-versus-outturn
  comparison. Published every autumn by the Receiver General.

