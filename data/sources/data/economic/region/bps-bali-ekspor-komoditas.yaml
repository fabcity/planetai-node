notes: |
  VERIFIED 2026-09-27 in a browser, not yet read for a real territory. Filed for #42: the export side of a Bali goods index.

  LICENCE, BY DECISION. BPS website terms, as for bps-bali-nilai-output-industri: usable from the website, not the API, by Tomas Diez's decision of 2026-09-27.

  ENDPOINT. HTML table only; bali.bps.go.id returns 403 to scripts. US dollars and kilograms by HS chapter. 2022: fish and crustaceans (03) US$147,967,445; apparel, not knitted (62) US$102,859,558; jewellery (71) US$73,721,929. 2025: fish US$166,824,029, 29.5% of the total.

  WHY THIS CELL. Economic|Region's external-trade row, exports half.

  WHAT IT DOES NOT CLAIM. Only the main groups are named, the rest is lumped. HS chapters are products, not industries, so a goods index has to map them to KBLI divisions. It includes primary goods (fish). Customs exports, attributed where they were declared. US dollars.
