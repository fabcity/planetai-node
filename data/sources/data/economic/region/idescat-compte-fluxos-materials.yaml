name: Idescat material flow accounts of Catalonia (CFM)
url: https://www.idescat.cat/pub/?id=cfm&lang=en
description: |
  Economy-wide material flow accounts for Catalonia, annual 2000-2023, in tonnes:
  domestic extraction, imports and exports split into abroad and the rest of Spain,
  domestic material consumption (DMC), direct material input and material productivity,
  following Eurostat's MFA methodology with interregional trade added.
