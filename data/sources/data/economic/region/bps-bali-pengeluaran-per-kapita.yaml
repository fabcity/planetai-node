notes: |
  VERIFIED 2026-09-27 in a browser, not yet read for a real territory. Filed for #42: the consumption side of a Bali goods index.

  LICENCE, BY DECISION. BPS website terms, as for bps-bali-nilai-output-industri: usable from the website, not the API, by Tomas Diez's decision of 2026-09-27.

  ENDPOINT. HTML table only; bali.bps.go.id returns 403 to scripts. 2025, rupiah per person per month: clothing, footwear and headwear 31,504; durable goods 97,727; health costs 57,685; housing rent 303,709. Food groups are in a separate table.

  WHY THIS CELL. Economic|Region's regional accounts: household spending by purpose.

  WHAT IT DOES NOT CLAIM. Broad groups: medicines are mixed with health services, and electronics, furniture and recreational goods are all inside durables, so they cannot be set against their industries one by one. Only Susenas microdata splits them, and it needs registration. Per person, so totals need the population.
