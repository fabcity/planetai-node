notes: |
  VERIFIED 2026-09-27, not yet read for a real territory. Filed for #42: measured production by state for São Paulo and Recife (Pernambuco), which the Index otherwise has no way to get.

  LICENCE. IBGE's library services page (biblioteca.ibge.gov.br/biblioteca-servicos.html, read through a 2025 Wayback capture because www.ibge.gov.br refuses scripts): "Dados selecionados de publicações do IBGE ... podem ser utilizados por terceiros em publicações, devendo ser citado como fonte o IBGE", and a transformed table must name who transformed it. No non-commercial clause, no date bound, no named licence.

  ENDPOINT. SIDRA API, no key. Variables 810 (gross value of production, VBP), 835 (net sales), 836 (industrial net sales), 631 (persons employed); classification c12762 (CNAE divisions: 116911 = C10, 116952 = C11, 116965 = C13, 116985 = C14, 116994 = C15, 117082 = C21, 117099 = C23, 117159 = C26, 117267 = C32); states n3 35 (SP), 26 (PE). 2019 VBP: SP food (C10) 149,455,273 and electronics (C26) 47,524,215; PE food 14,111,293 and electronics 28,262 (thousand R$). Nothing suppressed for SP or PE in these divisions, 2019 or 2022. Table 10457 (new series) holds 2024 only.

  WHY THIS CELL. Economic|Region's manufacturing capacity: persons employed by division (the minimum row) and measured production value.

  WHAT IT DOES NOT CLAIM. Local units with 5 or more persons only. State level only, no municipalities, so São Paulo and Recife are read as their states. Nominal reais.
