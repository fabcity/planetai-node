notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). Latest edition

  FY2023 (令和5年度), cadence 年1回, formats XLSX + PDF.


  PREFECTURAL AGGREGATES ONLY - contains no municipal (市町村民経済計算)

  disaggregation. Kanagawa appears not to publish a municipal GDP series, so

  Economic|City GDP per capita is unavailable for Kamakura by this route.


  Covers both the regional-GDP and the industry-composition sub-cells in one

  object.'
