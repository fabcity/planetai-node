name: DGFiP — Balances comptables des régions depuis 2010
url: https://www.data.gouv.fr/datasets/balances-comptables-des-regions-depuis-2010
description: |
  Accounting balances of every French region's principal and annexe budgets, 2010 onward,
  published by DGFiP. Fills the region rung of the public-budget ladder for all French
  Fab City members from one national file.
