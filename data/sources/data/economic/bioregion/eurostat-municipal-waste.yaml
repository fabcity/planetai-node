notes: |
  VERIFIED 2026-09-26, not yet read for a real territory.

  LICENCE. Eurostat's copyright notice authorises reuse "provided the source is
  acknowledged" (Commission Decision of 12 December 2011, 2011/833/EU). The CC-BY-4.0 on
  the website covers editorial content, not the statistics.

  ENDPOINT. Key-free JSON-stat. env_wasmun, kg per inhabitant, 2024: Germany generated 628
  and recycled 420; Spain 456 and 194 (216 landfilled); France 530 and 217. cei_wm011,
  recycling rate 2024: Germany 66.9%, Spain 42.5%, France 40.9%, EU27 48.1%. Operations
  include landfill, incineration, energy recovery, material recycling, composting and
  preparing for reuse.

  WHY THIS CELL. Economic|Bioregion's "circularity" category. It is not one of the cell's
  minimum indicators; the circular material use rate is. Its use is as the national
  benchmark for the city and region waste rows (Environmental|City, Environmental|Region):
  generated minus recycled is the national counterpart of residual waste per capita, e.g.
  Spain 262 kg against Catalonia's 253 kg of residual (2024; the two count differently).

  WHAT IT DOES NOT CLAIM. A national figure hides every city and region inside it.
  Countries report under the EU Waste Framework Directive; Eurostat's flags mark estimates
  and breaks in series, and a comparison across a break is not a trend. EU and EFTA only.
