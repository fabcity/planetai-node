notes: |
  VERIFIED 2026-10-13 by fabcity/fci-index compute/goods.py: two calls for the 26 countries behind the Index's 61 places; 22 answered, and Ghana, Tanzania, Bhutan and Georgia have no rows. Spain 2022, FD_VA_SH with ESP as counterpart: all activities 71.976, manufacturing 38.083, C26 computers and electronics 5.668, C10T12 food 69.4 (percent). Direction checked: for a reporting country the shares over all origins sum to 100 per industry (counterpart W reads 100), so REF_AREA is the buyer and COUNTERPART_AREA the maker.

  LICENCE, read on oecd.org/en/about/terms-conditions.html (last updated 1 July 2024), section 3 Data, Permitted Use: "you can extract from, download, copy, adapt, print, distribute, share and embed Data for any purpose, even for commercial use. You must give appropriate credit to the OECD ... When sharing or licensing work created using the Data, you agree to include the same acknowledgment requirement in any sub-licenses". And: the OECD does not warrant it owns all rights in all Data. Not CC-BY, whatever earlier OECD entries say.

  ENDPOINT. The dataflow lives on the sti-public host, not public (the public catalogue lists it as an external reference, and data calls there return 500). Key order MEASURE.REF_AREA.ACTIVITY.COUNTERPART_AREA.UNIT_MEASURE.FREQ, e.g. FD_VA_SH.ESP._T.ESP..A?startPeriod=2022&format=csvfilewithlabels. 429 after a few calls, for about ten minutes; lastNObservations answers 403, so bound the year. Activities are ISIC rev. 4 codes with labels.

  WHY NO CELL. National only, and no cell is a country: the Index serves it beside each place as country_bracket.goods, next to the Atlas (trade) and FAOSTAT (food) halves.

  WHAT IT DOES NOT CLAIM. Value added, not products or tonnes: a car assembled at home from imported parts counts for the assembly. Re-exports sit inside a trading hub's figures. A country's share says nothing about any of its cities.
