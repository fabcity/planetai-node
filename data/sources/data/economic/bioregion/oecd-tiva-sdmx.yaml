name: OECD Trade in Value Added (TiVA) 2025, SDMX
url: https://www.oecd.org/en/data/datasets/trade-in-value-added.html
description: |
  OECD trade in value added indicators from its inter-country input-output
  tables, 1995-2022, about 80 economies. FD_VA_SH with the country as its
  own counterpart is the share of what the country buys that was made at
  home, by industry.
pillar: economic
scale: bioregion
status: candidate
license: "OECD Terms and Conditions, Data, Permitted Use: any purpose including commercial, credit the OECD, same acknowledgment carried into sub-licences"
api: https://sdmx.oecd.org/sti-public/rest/data/OECD.STI.PIE,DSD_TIVA_MAINSH@DF_MAINSH,1.1/
pilot_relevance: [global]
tags: [oecd, sdmx, trade-in-value-added, input-output, self-supply, domestic-share, final-demand, imports, exports]
