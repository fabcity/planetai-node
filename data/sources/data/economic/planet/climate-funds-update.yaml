notes: |
  Verified 2026-09-09. Data current as of February 2026, covering
  2003-2026, updated roughly twice a year. Excel download covering
  pledges, deposits and project approvals, filterable by theme and region,
  with contributor and recipient country breakdowns. THIS IS THE ONLY
  OPENLY DOWNLOADABLE, COUNTRY-RESOLVED CLIMATE-FINANCE DATASET VERIFIED
  IN THIS HARVEST. The alternatives all failed the openness test: GSIA
  publishes a biennial PDF with a data annex of unclear format and no
  repository; CPI's Global Landscape of Climate Finance is form-gated
  behind name, organisation, country and email with no stated licence;
  both OECD climate-finance landing pages 404'd. Covers multilateral funds
  only, not total sustainable investment - do not present it as the
  latter. LICENCE ACTION: contact ODI to establish reuse terms before
  republishing values.
