notes: |
  Used in PLANETAI Wave 16 Sankey triptych as the right-hand panel
  (national MSW composition by kg/cap). Static dataset — last full
  update 2018, partial updates since. Combine with PLANETAI's
  HS->material crosswalk to bridge imports (Atlas of Economic
  Complexity) into waste outputs.

  CITY TABLE, verified 2026-09-26. The catalogue also publishes city-level data:
  datacatalogfiles.worldbank.org/ddh-published/0039597/DR0049200/city_level_data_0_0.csv
  (HTTP 200, 368 rows). Paris and Santiago have waste figures. Hamburg is listed with
  population only. Barcelona, Boston and Denpasar are absent. City rows carry no year
  field, so every figure needs its vintage checked before use. The licence is the World
  Bank's CC-BY 4.0 (datacatalog.worldbank.org/public-licenses).
