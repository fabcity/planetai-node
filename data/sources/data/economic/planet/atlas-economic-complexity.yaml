notes: |
  MOVED 2026-09-19. Harvard moved the Atlas from the Center for International Development to the Kennedy School: atlas.cid.harvard.edu now redirects to atlas.hks.harvard.edu, and the documented API host api-docs.atlas.cid.harvard.edu no longer resolves at all. The new host does not answer at api-docs.atlas.hks.harvard.edu either and the landing page links no API, so api is set to null rather than guessed. Somebody wiring this needs to find the endpoint and put it back. Flagged wired_in_planetai, though no pack declares it - see issue #3.
  CORS is unreliable from browser origins — pre-fetch and serve as a
  static snapshot for production. Dataverse mirror at
  dataverse.harvard.edu carries the full bulk dump.
  The methodological predecessor of Metroverse (city scale) and
  Boeing 2024 Fab City Index.
