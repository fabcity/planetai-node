description: |
  OpenGeoHub's global soil maps for Land & Carbon Lab: organic carbon, pH, bulk density, texture and soil type at
  30 m, three depths to 1 m, in five steps from 2000 to 2022. Machine-learned, Cloud-Optimized GeoTIFFs, read anonymously.
