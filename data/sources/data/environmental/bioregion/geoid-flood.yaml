description: |
  Mapped flood extents for 219 Copernicus EMS Rapid Mapping flood activations in 65 countries, 2016-2026, as
  10 m tiles with Sentinel-1, Sentinel-2 and DEM layers and validated labels. Built by Fondazione LINKS (Turin) to train
  flood-mapping models.
