notes: |
  VERIFIED 2026-10-31.

  LICENCE. Read from the European Commission's "Legal notice on the use of Copernicus Sentinel Data and Service
  Information" (sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice, 2 pages): users "shall
  have a free, full and open access"; use is granted for reproduction, distribution, communication to the public,
  and "adaptation, modification and combination with other data", with no non-commercial clause. Limits only for
  security, third-party rights or service disruption. Users waive claims for damages. Modified data must carry
  "Contains modified Copernicus Sentinel data [Year]". TRAP: the collection's own `license` link
  (scihub.copernicus.eu ... Sentinel_Data_Terms_and_Conditions.pdf) is dead, SciHub was retired.

  ENDPOINT. STAC search and a SAS token from planetarycomputer.microsoft.com, both anonymous. A long run can
  outlive its token: 7 of 222 scene reads got 403 on 30 Oct; ask again on 403.

  READ. Bali, Canggu to Pemogan (115.09-115.23 E, 8.61-8.71 S), Oct 2024 to Oct 2026: 185 scenes under 50 %
  cloud, 1,420 ha cycling as rice. Two scenes read by plain-Python range requests matched rasterio pixel for pixel
  (31 Oct). TRAPS: since baseline 04.00, reflectance is (DN - 1000) / 10000 and the items do not say so
  (raster:bands empty on 05.13); B03/B04/B08/B11 are 15-bit packed, deflate, MSB first.

  WHAT IT IS NOT. Optical: blind under cloud, about one clear look a month in Bali's wet season. Reflectance, not
  land use; any crop label is a model.
