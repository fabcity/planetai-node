notes: |
  Verified 2026-09-09, corrected 2026-11-05. The REST point query at
  rest.isric.org/soilgrids/v2.0/properties/query works: Collserola,
  Barcelona (2.10 E, 41.42 N) gave soc 0-5cm mean 713 dg/kg on 5 Nov (it returned only nulls in Sep,
  with an outage notice on ISRIC's site). A null can also be SoilGrids'
  own no-data: at Ungasan, Bali
  (115.165 E, 8.825 S) the VRT pixel is -32768 too, while 300 m east it
  reads soc 450 dg/kg, pH 5.6. For areas use the WCS at maps.isric.org or
  the VRTs at files.isric.org/soilgrids/latest/data/; full downloads are
  ~5 GB per map, so subset.
  METHODOLOGICAL CAVEAT: these are model predictions, not measurements,
  with no time dimension. The framework's 'soil health index' implies
  observed condition and trend; SoilGrids gives a static modelled property
  surface. It is a proxy and the index should say so.
