notes: |
  Verified 2026-09-09. v2, 80 CSVs in a single 108.7 MB ZIP, Zenodo DOI
  10.5281/zenodo.14230628, updated annually. Covers 1906-2023. Only data
  contributed to GEMStat under CC BY 4.0 or equivalent reaches the open
  Zenodo release. The interactive portal at portal.gemstat.org is capped
  at 675 stations per request; larger extracts need a custom data request.
  SLICING: station records carry coordinates, so point-in-polygon against
  a bioregion or catchment works cleanly, and GEMStat natively supports
  station, country and catchment queries. THE REAL CONSTRAINT IS COVERAGE,
  NOT SLICING: 37 countries only. Most of the world has zero stations.
  Check station presence per bioregion before promising this indicator
  anywhere.
