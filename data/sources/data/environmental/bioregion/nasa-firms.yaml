notes: |
  VERIFIED 2026-09-26, nothing read for a real territory yet.

  LICENCE. NASA's Earthdata data-use guidance: "Unless the content is marked with a
  use restriction or license, data provided from a NASA-led mission are licensed as
  Creative Commons Zero (CC0)", and users are "very strongly urged to cite". The
  FIRMS FAQ asks image captions to say "NASA FIRMS" and gives a journal
  acknowledgement. One carve-out: the FAQ marks a single derived map layer as "not
  available for distribution". That is a display layer, not the fire-detection CSVs.
  Ancillary layers FIRMS shows beside the fires (power plants, cement plants) are
  third-party datasets under their own citations. The fire points are the entry.

  ENDPOINT. `/api/area/csv/{MAP_KEY}/{SOURCE}/{west,south,east,north}/{days}` with
  SOURCE one of VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, VIIRS_SNPP_NRT, MODIS_NRT (plus
  `_SP` standard-processing archives). The API answered 200 on 2026-09-26 and
  rejected `DEMO_KEY` with "Invalid MAP_KEY", so a key is required. The key is free,
  sent by email from /api/map_key/, and limited to 5000 transactions per 10-minute
  interval. A multi-day request counts as several transactions. The API form offers
  a day range of 1–5 per call (an optional date moves the window back), so a long
  history is better taken from the archive download than a loop over the API.

  WHY THIS CELL. Environmental|Bioregion's natural-hazards category (added 2026-09-26) carries
  "Active fire detections, count/yr (VIIRS 375 m hot pixels)". The unit names the sensor because a
  MODIS 1 km count is a different number. Pilot relevance: peat and field burning around Bali, the
  central-Chile wildfire season, Catalan summers. Fire radiative power, summed, is the obvious second
  number and is not a minimum. It was filed first under the land-cover category, before hazards
  existed.

  WHAT IT DOES NOT CLAIM. A detection is a hot pixel, not a fire perimeter and not
  burned area. Industrial flares, kilns and volcanoes show up too, and the static
  "thermal anomaly" mask only partly removes them. Cloud and smoke hide fires.
  375 m pixels cannot say whether a field burn is on one farm or the next. Burned
  area needs MODIS MCD64A1, which is a separate product.

  STILL MISSING. A MAP_KEY on a node, a first pull for one pilot bioregion, and a
  decision on aggregation (count, sum of FRP, or both). Seen in use downstream: the
  God's Eye View globe merges all four NRT sources over the last 24 h and caches for
  30 minutes to stay inside the shared key's quota.
