notes: |
  VERIFIED 2026-10-15 (first 2026-09-26). Read live by node #1 (Bali) through pack:fire since 2026-10-15; no cell yet.

  LICENCE. NASA Earthdata data-use guidance, re-read 2026-10-15: "Unless the content is marked
  with a use restriction or license, data provided from a NASA-led mission are licensed as
  Creative Commons Zero (CC0)"; users are "very strongly urged to cite". Cite "NASA FIRMS". The
  FAQ's one "not available for distribution" item is a display layer, not the fire CSVs.

  ENDPOINTS. Two, and only the second needs a key, so `auth: none` and `api` is the first.
  - Regional text files, no key:
    `/data/active_fire/{noaa-20-viirs-c2|noaa-21-viirs-c2|suomi-npp-viirs-c2|modis-c6.1}/csv/`
    `{J1_VIIRS_C2|J2_VIIRS_C2|SUOMI_VIIRS_C2|MODIS_C6_1}_<Region>_{24h|48h|7d}.csv`.
    J1_VIIRS_C2_Europe_24h.csv answered 200 without a key on 2026-10-15: 35,256 bytes, text/csv,
    with `last-modified` (so If-Modified-Since works). Columns: latitude, longitude, bright_ti4,
    scan, track, acq_date, acq_time, satellite, confidence, version, bright_ti5, frp, daynight.
    VIIRS confidence is spelled out (low/nominal/high). Its first row was 2026-10-13 13:36 UTC in
    a file modified 2026-10-14 16:41 UTC: "24h" is not a strict window, filter on acq_date+acq_time.
  - Area API, MAP_KEY required: `/api/area/csv/{MAP_KEY}/{SOURCE}/{w,s,e,n}/{days}`. DEMO_KEY
    was rejected 2026-09-26. The key is free by email from /api/map_key/, 5,000 transactions per
    10 min. It only buys a server-side bbox cut of the same points.

  NODE. The PLANETAI `fire` pack, being built on 2026-10-15, will read the regional files with no
  key. Set `adapter: pack:fire` only once that pack is on the node's main.

  WHY THIS CELL. Environmental|Bioregion natural hazards: "Active fire detections, count/yr
  (VIIRS 375 m hot pixels)". Summed fire radiative power is the obvious second number.

  WHAT IT DOES NOT CLAIM. A detection is a hot pixel, not a perimeter or burned area (that is
  MODIS MCD64A1). Flares, kilns and volcanoes show up too; cloud and smoke hide fires.
