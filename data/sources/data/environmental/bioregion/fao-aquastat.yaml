notes: |
  VERIFIED 2026-10-13 by fabcity/fci-index compute/water.py: the dissemination system's query endpoint answered for all 26 tracker countries. Spain 2022: dependency ratio 0.27% (internal 111.2, external 0.3 km3/yr), withdrawal 29.02 km3 (symbol A); Netherlands 87.9%; Croatia 64%; Ghana 46.1%; Bhutan and Indonesia 0%.

  LICENCE, decided 2026-10-14 by Tomas Diez: CC BY 4.0 under fao.org/contact-us/terms/db-terms-of-use, whose Annex 1 names AQUASTAT ("unless specified otherwise in their metadata or webpage"), with its clause against use in the promotion of a commercial enterprise. FAO's data catalogue labels the aquastat-ds dataset and its CSVs CC BY-NC-SA 4.0; read as a catalogue default, not the "specified otherwise". Recorded so a later reader can see both.

  ENDPOINT. GET with the published SQL as sql_url and four parameters: area (World), type (country|aggregate|all), variable (codes, comma-separated: 4192 dependency ratio, 4157 internal, 4182 external, 4188 total renewable, 4263 total freshwater withdrawal, 4275 withdrawal as % of renewable), year (comma-separated). Returns CSV: Country, Year, Value, Unit, Symbol (I imputed, E estimate, A actual), m49, VariableCode. 1.5 MB for five variables over five years; the 338 variable codes are in the schema resource unified_schema.json. Resources are long-term averages repeated yearly.

  WHY NO CELL. National only; read as the water half of the Index's country bracket (index.fab.city/countries): one minus the dependency ratio is the share of a country's renewable water that rises inside it.

  WHAT IT DOES NOT CLAIM. Water is not traded like goods: "from inside" is provenance, not effort. A country figure says nothing about a basin; Aqueduct is the basin source here.
