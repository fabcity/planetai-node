name: FAO AQUASTAT, global information system on water and agriculture
url: https://data.apps.fao.org/aquastat/
description: |
  FAO's country water statistics: renewable water resources (internal,
  external, total), the dependency ratio (the share flowing in from other
  countries), withdrawals by sector and source, irrigation and dams, for
  about 200 countries, with a symbol on every value saying whether it is
  official, estimated or imputed.
pillar: environmental
scale: bioregion
status: candidate
license: "CC BY 4.0 under FAO's Statistical Database Terms of Use (Annex 1 names AQUASTAT), with the clause against use in the promotion of a commercial enterprise; decided by Tomas Diez 2026-10-14 over the catalogue's CC BY-NC-SA label"
api: https://api.data.apps.fao.org/api/v2/bigquery?sql_url=https://data.apps.fao.org/catalog/dataset/945666e6-7803-4621-b8ef-cfd885a84596/resource/4a000a1b-24f0-4328-aab6-b9b525892090/download/query_en.sql
pilot_relevance: [global]
tags: [fao, aquastat, water, renewable-water-resources, dependency-ratio, withdrawal, bigquery]
added: 2026-10-13
assisted_by: Claude Code
auth: none
