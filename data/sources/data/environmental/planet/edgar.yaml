notes: |
  **THIS ENTRY IS DELIBERATELY NOT ALL OF EDGAR.** Re-scoped 2026-09-23 after the
  C′ licence pass (issue #17). Fossil CO2 is excluded because it is not the
  European Union's to license openly, and an Index cell computed from it could
  not be redistributed.

  WHAT IS IN, all CC-BY-4.0: `EDGAR_CH4_1970_2023.zip` and the `CH4/` tree,
  `EDGAR_N2O_1970_2023.zip` and `N2O/`, `EDGAR_F-gases_1990_2023.zip` /
  `EDGAR_AR5g_F-gases_1990_2023.zip` and `Fgases/`, the `_m_` monthly variants of
  each, and `EDGAR_CO2bio_1970_2023.zip` — biogenic CO2, which is EDGAR's own
  and not IEA's.

  WHAT IS OUT: `IEA_EDGAR_CO2_1970_2023.zip`, its monthly variant and the `CO2/`
  tree. The release page, verbatim: "IEA-EDGAR CO2 data are based on data from
  IEA (2023) Greenhouse Gas Emissions from Energy ... as modified by the Joint
  Research Centre, **licensed under CC BY-NC-ND 4.0**." NonCommercial fails
  criterion 1; NoDerivatives is the harder one, because an Index cell is a
  derived aggregate and that is exactly what ND forbids.

  **AND THE AGGREGATE IS OUT TOO — this is the part that will catch someone.**
  `EDGAR_AR5_GHG_1970_2023.zip` and the `GWP_100_AR5_GHG/` tree are the
  all-gases products, and the release page describes "IEA-EDGAR CO2, **a
  component of** the EDGAR Community GHG database version 2024". A total-GHG
  number therefore contains the NC-ND component, so the headline file anybody
  would reach for first is the one that cannot be used. Reach for the individual
  gases instead.

  THE PROVIDER CONTRADICTS ITSELF, and the wrong answer is the one sitting next
  to the data. `EDGAR_2024_GHG/copyright.txt`, in the download directory,
  re-read 2026-09-23: "Any copyright and/or sui generis right on the dataset is
  licensed under the Creative Commons Attribution 4.0 International (CC BY 4.0)
  licence" — no IEA carve-out at all. The release page carries the carve-out and
  is the specific statement, so it governs; `copyright.txt` is the generic EU
  notice shipped beside every JRC dataset. Anyone who goes straight to the FTP
  tree and reads the notice beside the files gets the wrong answer, which is why
  both are quoted here.

  ENDPOINT VERIFIED 2026-09-23, no key and no account: the directory listing at
  `.../EDGAR_2024_GHG/` is open and the per-gas zips are beside the excluded
  ones. Bulk files, not a query API.

  VINTAGE: release EDGAR_2024_GHG, data through 2023.

  SPATIAL: country totals in kt/year with ISO codes, plus a 0.1° grid that
  carries none. **Not federatable below the country without a crosswalk.**

  INDICATOR: methane, N2O and F-gas emissions by country — and methane is the
  one worth having, because it is where a bioregion's agriculture and waste
  actually show up and it is far less covered by open national inventories than
  CO2. I could not read the landing plan's Table 2 in this session, so this names
  the indicator in plain words rather than a row id.

  Promotes to live when somebody reads one of the non-CO2 gases for a real
  territory and confirms the file they used is one of the CC-BY ones named
  above — not the AR5 aggregate. A review that says "EDGAR, usable" without
  naming the file has not done the check this entry exists for.

  If the network ever needs fossil CO2 at this resolution, the route is written
  permission from compliance@iea.org, tracked in issue #17.
