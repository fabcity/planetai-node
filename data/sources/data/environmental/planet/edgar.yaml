name: EDGAR — Emissions Database for Global Atmospheric Research
url: https://edgar.jrc.ec.europa.eu/
description: |
  The JRC's global greenhouse-gas inventory: CO2, CH4, N2O and F-gases by
  country and sector back to 1970, plus 0.1° gridded maps. The reference
  emissions dataset when a national inventory does not exist.
