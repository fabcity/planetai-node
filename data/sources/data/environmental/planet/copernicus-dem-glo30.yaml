name: Copernicus DEM GLO-30 (global 30 m surface elevation)
url: https://registry.opendata.aws/copernicus-dem/
description: |
  Heights of the Earth's land surface every 30 m, buildings and trees included, from the TanDEM-X radar mission.
  Published by the Copernicus programme as one-degree Cloud-Optimized GeoTIFFs on AWS. A node reads its own square
  to see where rain runs and where it stands.
