notes: |
  UNITS, read from the export on 2026-09-23, and the reason this entry can feed the cell at all.
  The CSV is Energie;Categorie;Type;Annee;Valeur and the Type column reads GWh in every one of
  its 221 rows. There is no MW anywhere in it. So this is generation, not installed capacity, and
  it cannot answer a capacity question however the page is titled. Environmental|Region asked for
  MW until the same day and now asks for GWh/yr, because generation is what regions publish.
  Verified 2026-09-09: dataset page opened, HTTP 200. Last update 2025-10-20. CSV (10.7 KB and
  12.1 KB), JSON (26.6 KB), plus PDF companions. Sixteen-year series, 2008-2024.
  PROVENANCE CAVEAT THE PAGE STATES ITSELF: the region compiles this from RTE, SDeS, ENEDIS
  and other producers, and some figures are estimates. It is a regional aggregation of
  national operator data, not a primary measurement, so it should be cited as Occitanie's
  compilation rather than as an independent observation — and it will not always reconcile
  against the operators' own published series.
  Metadata quality self-rated 44%: update frequency, temporal coverage and spatial scope
  undocumented. Cadence appears roughly annual from resource dates; treat as annual until
  confirmed.
  Related but separate: "Initiatives « Région à énergie positive »" (same publisher, lov2),
  a project register rather than a production series — not entered here.
