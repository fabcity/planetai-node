notes: |
  VERIFIED 2026-09-29, nothing read for a real territory yet. Found while reading
  Resource Watch, which carries an archive banner; filed from the publisher, not
  from RW's 2018 Carto copy (powerwatch_data_20180102).

  LICENCE. README of github.com/wri/global-power-plant-database: "The latest
  database release (v1.3.0) is available in CSV format [at datasets.wri.org] under
  a Creative Commons-Attribution 4.0 (CC BY 4.0) license." The WRI Data Explorer
  record (CKAN id 53623dfd-3df6-4f15-a091-67457cdb571f, metadata_modified
  2025-10-06) says license_id cc-by. The code is MIT; the data licence is the
  CC BY sentence above.

  ENDPOINT. The Data Explorer's three ZIP resources sit under /private-admin/ and
  answered 302 then 403 on 2026-09-29, so the publisher's own download is broken.
  The CSV that works is the repo's output_database/global_power_plant_database.csv
  (12.0 MB, no key); DATABASE_VERSION beside it reads 1.3.0. Read today: 34,936
  rows; columns country, name, gppd_idnr, capacity_mw, latitude, longitude,
  primary_fuel, commissioning_year, owner, source, year_of_capacity_data,
  generation_gwh_2013..2019, estimated_generation_gwh_2013..2017. Country totals:
  ESP 829 plants / 79,035 MW; USA 9,833 / 1,204,638; CHL 315 / 22,476;
  IDN 178 / 48,751. Pilot reads by bounding box, because the file carries no admin
  code; a real read clips to the region polygon, and a box spills over borders
  (the Massachusetts one catches Millstone in Connecticut). Renewable here means
  primary_fuel in Solar, Wind, Hydro, Geothermal, Biomass, Wave and Tidal.
    Catalonia box 40.5-42.9N 0.15-3.35E: 107 plants, 10,778 MW, 3,414 MW renewable
      (Asco 1,990.5 MW nuclear 1983; Besos 5 1,670.8 MW gas 2010; source
      Red Electrica de Espana).
    Massachusetts box 41.2-42.9N 69.9-73.5W: 637 plants, 27,647 MW, 3,538 MW
      renewable (388 solar sites; Mystic 2,375.6 MW gas; source US EIA,
      capacity year 2019).
    Region Metropolitana box 32.9-34.3S 69.8-71.8W: 51 plants, 4,051 MW, 1,329 MW
      renewable (Nehuenco 874.7 MW gas; source Energia Abierta, capacity year 2016).
    Bali island box 8.05-8.95S 114.4-115.75E: 8 plants, 980 MW, 0 MW renewable
      (Celukan Bawang 381 MW coal 2015; PLTG Pesanggaran 122 MW gas).

  WHY THIS CELL. Environmental|Region lists "renewable energy capacity" as an
  indicator category, and its notes say no source in this list published installed
  capacity at region scale. This one does: every plant is a point with capacity_mw
  and primary_fuel, so capacity by fuel inside any region polygon is a spatial join,
  and generation_gwh_2019 gives the cell's minimum (renewable generation, GWh/yr)
  where a plant reported it. The same clip would serve Environmental|City for a
  city that hosts plants; Barcelona's box holds four (Besos, Port de Barcelona,
  Garraf landfill gas, Seat al Sol). Not claimed here.

  WHAT IT DOES NOT CLAIM. The list stops around 2019: the README says "This project
  is not currently maintained by WRI. There are no planned updates as of this time
  (early 2022)." Everything built since, most of it solar and wind, is missing, so
  a renewable share read from it is a floor, not a figure. Rooftop and small
  distributed solar were never in scope. Reported generation exists for a minority
  of plants (EIA, Energia Abierta); the rest is model-estimated, and the estimate
  columns end in 2017. year_of_capacity_data is blank for Spain and Indonesia.
  Coordinates come from mixed sources (the geolocation_source field says which),
  and a plant a few hundred metres over a border lands in the wrong region.

  STILL MISSING. A read against a real region polygon (Catalonia first: ICAEN
  publishes current capacity to compare against), a decision whether a 2019
  vintage can feed a cell or only anchor a baseline, and a look at Global Energy
  Monitor's trackers as the maintained successor for anything built after 2019.
