description: |
  WRI's open list of the world's power plants: 34,936 geolocated plants in 167
  countries with capacity in MW, primary fuel, commissioning year, owner and
  reported or estimated annual generation 2013-2019. Frozen at v1.3.0; WRI says
  it is no longer maintained.
