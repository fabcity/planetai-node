upstream_listed_in: []
notes: |
  VERIFIED 2026-11-05. WCS 2.0.1 GetCoverage on coverage
  mrlc_download__NLCD_2021_Land_Cover_L48, clipped to Mecklenburg's box in
  EPSG:5070 as an ASCII grid (8.3 MB), masked by the TIGERweb county polygon
  (GEOID 37119). The masked total, 1,414.3 km2, matches TIGER land plus
  water (1,356.2 + 58.1 km2). NLCD 2021 in km2: developed open space 354.0,
  low 311.0, medium 196.3, high 89.1; deciduous forest 152.4, mixed 99.6,
  evergreen 51.5; pasture/hay 61.0; open water 51.3.

  LICENCE. www.mrlc.gov/about: NLCD aims to provide "public domain
  information on the Nation's land cover". The WCS capabilities document
  states Fees NONE and AccessConstraints NONE.

  WHY THIS CELL. Environmental|Region asks for land under each land-use
  class in km2.

  WHAT IT DOES NOT CLAIM. It is land cover, not land use, from 30 m pixels.
  Annual NLCD's per-year land cover is not on the WCS; the 2024 CONUS bundle
  is a 1.44 GB zip and was not read.
