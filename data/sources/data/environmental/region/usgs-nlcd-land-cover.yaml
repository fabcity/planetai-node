name: USGS National Land Cover Database (NLCD), MRLC
url: https://www.mrlc.gov/data
description: |
  30 m land cover for the conterminous US in 16 classes from Landsat, by
  the Multi-Resolution Land Characteristics consortium led by USGS.
  Served as bulk downloads and through a keyless WCS.
pillar: environmental
scale: region
status: candidate
license: "US public domain: MRLC describes NLCD as public domain information on the nation's land cover; the WCS declares no fees and no access constraints."
api: https://www.mrlc.gov/geoserver/mrlc_download/wcs
pilot_relevance: []
places: [charlotte]
tags: [land-cover, landsat, raster-30m, united-states, usgs]
auth: none
feeds_cells: [Environmental|Region]
added: 2026-11-05
