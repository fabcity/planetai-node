notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). Item id

  565e1b5cac0046e9b2f64b76d8c4bca0, licenseInfo verbatim "Open".

  FeatureServer URL not individually tested - api left null rather than inferred.


  LICENCE CAVEAT, applies to every Bhutan NSDI entry in this list: the licenceInfo

  field reads the literal word "Open", which maps to the Geo-Information Policy

  2018 §6.3.1 open-access tier, verified at

  https://web.nlcs.gov.bt/wp-content/uploads/2023/12/GI_Policy.pdf. That policy

  grants free and open ACCESSIBILITY but §8.2.3 vests copyright in the producing

  agency and grants no explicit redistribution or commercial-reuse right. This is

  weaker than CC-BY and should be treated as pending clarification from NLCS.


  WARNING: the "open" TAG is unreliable. Dzongkhag Boundary and Gewog Boundary are

  both tagged open but their licenceInfo ends "(Common)" - a priced tier for

  corporate users. Filter on licenseInfo, never on tags.'
