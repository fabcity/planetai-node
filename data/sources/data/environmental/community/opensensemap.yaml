name: openSenseMap
url: https://opensensemap.org/
description: |
  Citizen sensor stations worldwide, mostly senseBox and Sensor.Community kits, reporting temperature,
  humidity, pressure and PM2.5/PM10 every few minutes. Run by the senseBox team in Münster, key-free API.
