name: CoCoRaHS (Community Collaborative Rain, Hail and Snow Network)
url: https://www.cocorahs.org/
description: |
  Volunteers read a standard rain gauge every morning and report rain, hail and snow. Run by the Colorado
  Climate Center; covers the United States, Canada and the Bahamas, with a key-free daily export.
