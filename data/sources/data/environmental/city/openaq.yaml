notes: |
  Bbox queries are the fastest filter. Combine with Sensor.Community for community-tier
  density layer, with Smart Citizen for community-deployed sensors.

  AUTH VERIFIED 2026-10-15 by making the call: GET /v3/locations?limit=1 without a key
  returned 401, "Unauthorized. A valid API key must be provided in the X-API-Key header."
  So a key is required, not recommended. docs.openaq.org (using-the-api/api-key): "Sign up
  at explore.openaq.org/register to get your API key"; no approval step is described, hence
  `api-key` rather than `registration`. Send it as `X-API-Key`.
