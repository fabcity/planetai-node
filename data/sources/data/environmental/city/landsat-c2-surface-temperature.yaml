name: Landsat Collection 2 Level-2 surface temperature (USGS, via Microsoft Planetary Computer)
url: https://planetarycomputer.microsoft.com/dataset/landsat-c2-l2
description: |
  USGS Landsat Collection 2 Level-2 products, including the surface temperature band
  (ST_B10) at 30 m, resampled from 100 m thermal pixels; Landsat 8 and 9 together revisit
  every 8 days. Served by Microsoft Planetary Computer as Cloud-Optimised GeoTIFFs behind a STAC API.
