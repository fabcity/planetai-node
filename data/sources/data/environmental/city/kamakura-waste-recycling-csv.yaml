notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). 03-recycle_fixed.csv

  was opened directly and read: two columns (年度, リサイクル率%), H22-R6.


  Files under /gomi/documents/: 01-shoukyakuryou_fixed.csv (incineration),

  02-gomihasseiryou_fixed.csv (generation), 03-recycle_fixed.csv (recycling rate),

