notes: 'DEPRECATED 2026-09-19. The dataset page now returns the termination notice the portal itself renders — 서비스 종료 안내 / 해당 데이터는 종료된 서비스입니다, "this data is a terminated service". Read in a browser, not inferred from a status code: the page 404s to any client without Javascript, so a link checker cannot tell this apart from a portal that simply dislikes scripts. Marked rather than removed, per CONTRIBUTING: what this entry recorded was true when it was harvested on 2026-09-11, and the Korean city tier is thin enough that the gap should stay visible. A replacement should be found by searching 열린데이터광장 for a successor id, not by trusting this one.

  Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). Owner 기후환경본부

  기후환경정책과. Cadence 년간. Sheet (1,000-row cap) + CSV + Open API.


  CAUTION: the dataset page displayed 「파일이 없습니다」 (no file present) at the

  time of check. The metadata record is live and current, but the attachment may

  be broken. Verify before depending on it. Recorded as live because the record

  itself was fetched and is current; flip to stale if the attachment stays absent.


  NO GPC AND NO IPCC PROTOCOL is referenced on the page, so GPC conformance

  cannot be claimed for this inventory. The Fab City Index Environmental|City GHG

  cell asks for a GPC inventory; this is an inventory of unstated protocol.


  Sub-city granularity exists elsewhere but not openly: energyinfo.seoul.go.kr

  publishes GHG by 자치구 and energy source with an Excel download and NO licence,

  carrying the disclaimer 「본 자료는 법적효력을 가지지 않으므로 참고용으로만

  활용하십시오」.'
