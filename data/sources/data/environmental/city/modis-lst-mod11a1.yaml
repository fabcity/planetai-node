name: MODIS Land Surface Temperature MOD11A1/MYD11A1 v061 (NASA, via Microsoft Planetary Computer)
url: https://planetarycomputer.microsoft.com/dataset/modis-11A1-061
description: |
  NASA's daily 1 km land surface temperature and emissivity from MODIS on Terra (~10:30 and
  22:30 local) and Aqua (~13:30 and 01:30), day and night, since 2000. Served by Microsoft
  Planetary Computer as Cloud-Optimised GeoTIFFs behind a STAC API.
