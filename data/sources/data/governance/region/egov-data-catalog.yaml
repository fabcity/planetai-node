notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). The API endpoint was

  fetched and returned valid CKAN JSON with "success": true and ~2,800 package ids.


  CRITICAL PATH DETAIL, tested not inferred: the CKAN API lives under

  /data/api/3/action/, NOT /api/3/action/. The latter returns 404, as does the

  entire legacy www.data.go.jp API. Anyone porting old Japan harvest code will

  hit this.


  Scale recorded as region for schema compatibility; it is in fact national -

  same convention as data-gov-hr, data-overheid-nl and datos-gob-ar.


  Terms verbatim (data.e-gov.go.jp/info/terms): 「本コンテンツを利用する際は出典を

  記載してください。」 「編集・加工等を行ったこと及びその主体を記載してください。」'
