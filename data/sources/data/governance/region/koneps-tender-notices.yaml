notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). Provider 조달청.

  JSON + XML, free.


  Operations are SPLIT BY BUSINESS CATEGORY (goods / services / construction /

  foreign) and calling the wrong operation for a business type returns nothing

  useful. Scope stated as 전국; no Seoul-specific parameter is documented, though

  참가가능지역정보 makes regional filtering possible in principle.


  Endpoint base URL is not printed on the catalogue page.'
