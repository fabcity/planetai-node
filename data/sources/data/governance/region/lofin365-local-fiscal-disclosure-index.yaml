notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). JSON + XML.

  Cadence semi-annual: budget basis in February, settlement basis in August.


  IT RETURNS LINKS, NOT VALUES - each response points at the municipality''s own

  disclosure page. Treat it as an index, not a dataset.


  It is the closest thing to a regional data-sharing / policy-harmonisation

  instrument verified for the Seoul territory: it standardises WHERE each

  authority discloses, not WHAT is there.


  Seoul / 자치구 coverage is implied by the scope statement but not stated

  explicitly on the page.'
