notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). Provider 행정안전부

  (MOIS). REST, JSON + XML, last modified 2025-11-07.


  The human-facing register at code.go.kr/stdcode/regCodeL.do is live and offers

  bulk download of 240 code sets, but it is FORM-DRIVEN: no codes render without a

  POST, so Seoul''s and the 25 gu''s individual code VALUES were not resolved in

  this harvest and are not recorded anywhere. They were not guessed.


  ISO 3166-2:KR could not be verified either - iso.org/obp is a Vaadin

  JavaScript app that returns no content to a fetch. Do not assume KR-11 for

  Seoul without checking.'
