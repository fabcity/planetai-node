notes: |
  Verified 2026-09-09 in the FCI Regime 1 harvest (wave 1). Dataset ids:
  perfil-contractant (PSCP-era and pre-2016 resources) and relacio-contractistes.
  Also verified: cataleg-bases-ajuts-subvencions-bcnroc, the grants and subsidies
  catalogue, if a civil-society funding signal is wanted alongside.

  DAILY CADENCE. This is the fastest-updating open dataset found for any pilot
  in wave 1 - most municipal finance publishes annually. If procurement is to
  be a live DIDO signal anywhere, Barcelona is where it can be.

  Filed as governance, not economic, per CONTRIBUTING: procurement carries
  "what the public sector is choosing to buy", which is a governance signal.

  relacio-contractistes includes the contractor CIF, so it joins to Spanish
  company registers. Standard caution applies about republishing identifiers
  attached to small sole traders.
