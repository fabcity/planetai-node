notes: |
  Verified 2026-09-09 in the FCI Regime 1 harvest (wave 1). Three datasets:
  /dataset/city-of-boston-contract-award, /dataset/city-of-boston-buying-plan
  and /dataset/city-of-boston-discretionary-spending.

  THE BUYING PLAN IS FORWARD-LOOKING, which is unusual - most procurement open
  data is retrospective award records. A published intention to buy is a
  different and more actionable signal for local-sourcing work than a record of
  what was already bought.

  Contract Award carries equitable-procurement reporting, so it supports
  supplier-diversity analysis directly rather than by inference.

  Filed as governance per CONTRIBUTING, alongside Barcelona's perfil-contractant.
