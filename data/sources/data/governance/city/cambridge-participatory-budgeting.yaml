notes: |
  Verified 2026-09-10 in the FCI Regime 1 harvest (wave 7, United States).
  Two datasets: ideas submitted by community members /d/54vd-wdqj and final
  ballot projects /d/uhwd-9y6q. Both PDDL.

  THIS IS THE CELL THE FCI KEEPS FAILING TO FILL. Wave 1 recorded
  "checked-empty" for Boston's community-scale budget rung - no
  neighbourhood or tract finance, no participatory-budgeting dataset. Cambridge
  and Somerville both publish theirs. Two US localities inside the same metro
  area, opposite answers on the same indicator.

  It is a demand-side signal, not an allocation ledger: what residents asked
  for, and what made the ballot. Treat it as participation evidence for the
  governance pillar, not as a community budget line. The money itself is still
  only visible at city scale.

  Pair with governance/city/somerville-participatory-budgeting - Somerville's
  set carries per-idea coordinates, Cambridge's does not.
