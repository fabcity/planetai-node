name: Open Data Paris
url: https://opendata.paris.fr/api/explore/v2.1/catalog/datasets
description: |
  The City of Paris open-data portal (OpenDataSoft), 476 datasets across eight
  themes, every one of them under an open licence. Carries the city's budgets,
  procurement, workforce, environment and mobility data.
pillar: governance
scale: city
status: live
license: Open Database License (ODbL)
api: https://opendata.paris.fr/api/explore/v2.1/catalog/datasets
pilot_relevance: []
