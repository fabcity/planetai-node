notes: 'DEPRECATED 2026-09-19. The dataset page now returns the termination notice the portal itself renders — 서비스 종료 안내 / 해당 데이터는 종료된 서비스입니다, "this data is a terminated service". Read in a browser, not inferred from a status code: the page 404s to any client without Javascript, so a link checker cannot tell this apart from a portal that simply dislikes scripts. Marked rather than removed, per CONTRIBUTING: what this entry recorded was true when it was harvested on 2026-09-11, and the Korean city tier is thin enough that the gap should stay visible. A replacement should be found by searching 열린데이터광장 for a successor id, not by trusting this one.

  Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12). Public since

  2018-11-05; last updated 2026-09-11. Cadence 수시. Source system yesan.seoul.go.kr.

  Owner 서울특별시 기획조정실 재정기획관 재정담당관.


  Programme size verified at yesan.seoul.go.kr/intro/yesanIntro.do: 지정제안형

  300억원 + 자유제안형 200억원 per year.


  JOIN LIMIT: project location is a FREE-TEXT STRING, not a dong code - no clean

  spatial join is possible.


  Companion datasets on the same portal: OA-15412 (intake), OA-15414 (final

  selection), OA-15716 (field codes, verified same licence).


  NOTE ON THE COMMUNITY RUNG: this is the closest Seoul comes to a sub-city

  budget, and it is not one. Seoul''s participatory budget is CITY-level; the 25 gu

  run separate schemes. No dong-tier budget is published - 행정동 appears in

  Seoul''s data as a statistical geography, never a fiscal one.'
