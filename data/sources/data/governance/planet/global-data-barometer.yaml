name: Global Data Barometer (2nd edition, 2024)
url: https://globaldatabarometer.org/open-data/
description: |
  Country-level assessment of data governance, capability and availability
  across eight thematic clusters including public procurement, public
  finance, land management and political integrity. Hosted by D4D.net and
  ILDA with IDRC funding.
