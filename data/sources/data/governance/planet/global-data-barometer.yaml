notes: |
  Verified 2026-09-09. CSVs on Google Cloud Storage offered as one full
  file (gdb-2024-full-data.csv), by cluster (8), by country (44) and by
  region (2). Use the links on the page - a constructed direct GCS object
  URL returned 404. 1st edition 2021, 2nd edition 2024, irregular roughly
  three-yearly, so treat as a periodic snapshot rather than a live feed.
  COVERAGE WARNING RELEVANT TO PLANETAI: 44 countries only, Africa and
  Latin America plus a few others. It includes Chile, Brazil, Mexico,
  Kenya and South Africa but DOES NOT include Spain, the United States or
  Indonesia - so it covers the Santiago pilot and none of Barcelona,
  Boston or Bali. Open Data Inventory (ODIN) would fill that gap but its
  site is a JS SPA that returned no content to a fetcher and could not be
  verified; it is worth a browser-based re-check.
