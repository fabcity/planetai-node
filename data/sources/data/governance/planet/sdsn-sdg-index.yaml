notes: |
  Verified 2026-09-09. SDR 2026 is current: full report PDF, Database 2026
  (Excel), GES Survey 2026 (Excel), Country Profiles ZIP. An ArcGIS Hub
  API is referenced on the downloads page for full database access but the
  endpoint was not resolved or called - treat the API as documented-but-
  unverified and use the Excel as the verified path. Annual since 2016,
  193 states. WHY THIS IS THE ONE THAT MATTERS FOR THIS CELL: it is the
  only source found that publishes an on-track / off-track assessment. The
  UN SDG API gives raw indicator values; SDSN gives the verdict, which is
  what the framework's 'percentage of targets on track' indicator actually
  asks for. Citation: Sachs, J.D., Lafortune, G., Fuller, G., Iablonovski,
  G. (2026), Implementing Sustainable Development: 2030 and Beyond,
  Sustainable Development Report 2026. LICENCE ACTION: email
  info@sdgindex.org before republishing.
