name: TFDD International River Basin Organization Database
url: https://transboundarywaters.ceoas.oregonstate.edu/international-river-basin-organization-database
description: |
  Institutional-design data for more than 120 river basin organisations
  across more than 110 internationally shared watercourses, coded for
  membership, functional scope, legal foundation, financing, decision-
  making, data sharing, monitoring and dispute resolution.
