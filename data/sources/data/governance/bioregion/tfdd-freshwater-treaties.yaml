notes: |
  Verified 2026-09-09. Filed as STALE: the most recent Excel is version
  2.19.24 (February 2024) and the page states an update to bring coverage
  current is underway. Excel download plus a searchable CGI interface at
  gis.nacse.org/tfdd/treaties.php; treaty PDFs via Oregon Digital.
  SLICING: join treaty records to the TFDD basin polygons by basin name or
  ID, then clip to your bioregion. COVERAGE LIMIT WORTH STATING IN THE
  INDEX: this covers water only. Air-basin compacts, shared-forest
  agreements, coastal management compacts and cross-border energy or
  transport authorities have no equivalent global register - water is
  exceptionally well served because of a thirty-year academic programme at
  Oregon State, and that is an artefact of scholarship rather than of how
  governance actually distributes.
