name: TFDD International Freshwater Treaties Database
url: https://transboundarywaters.ceoas.oregonstate.edu/international-freshwater-treaties-database
description: |
  Over 800 international freshwater agreements from 1820 to 2021, coded by
  basin, signatory countries, date, topic, allocation measures, conflict-
  resolution mechanisms and non-water linkages. The canonical dataset for
  water-sharing agreements between jurisdictions.
