notes: 'Verified 2026-09-11 in the FCI Regime 1 harvest (wave 12).


  Table 3 cross-tabulates employed persons and students by municipality of

  residence x municipality of workplace/school. Tables 1-1/1-2/1-3 give

  夜間人口/昼間人口 by 全国・都道府県・市区町村.


  Directly material for Kamakura, a commuter city with a large daytime-population

  deficit toward Yokohama and Tokyo - the Social|Region commuting-flows cell for

  this locality is filled by this source and nothing else.


  Formats Excel + DB. Time-series DB view: https://www.e-stat.go.jp/dbview?sid=0004003060

  API requires a free e-Stat appId on every call.'
