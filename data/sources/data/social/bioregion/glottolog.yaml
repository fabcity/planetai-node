name: Glottolog
url: https://glottolog.org/meta/downloads
description: |
  The Max Planck Institute for Evolutionary Anthropology's catalogue of
  the world's languages, dialects and families, with geographic
  coordinates per languoid and full bibliographic references. Openly
  licensed and versioned with DOIs.
