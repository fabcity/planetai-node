notes: |
  Verified 2026-09-09 in the FCI Regime 1 harvest (wave 1). Three dataset ids:
  est-eleccions-locals-seccio-censal, est-eleccions-autonomiques-seccio-censal,
  est-eleccions-generals-seccio-censal. All CC-BY-4.0.

  CENSUS-SECTION GRANULARITY IS THE POINT. Most electoral open data stops at
  the municipality. Sections are small enough to join against demographic and
  income geographies, which makes participation usable as a Social|City
  indicator rather than a headline number.

  THIS IS THE ONLY SOCIAL|CITY SOURCE FOUND FOR BARCELONA. Direct CKAN searches
  for unemployment (atur), income and Gini (renda), housing (habitatge) and
  life expectancy (esperanca vida) each returned zero. Those indicators
  plausibly exist under other Catalan terms not tried in this pass - the cell
  is under-searched, not empty. Across the whole registry the Social column
  remains the thinnest of the four.
