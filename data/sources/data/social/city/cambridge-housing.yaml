  NEIGHBOURHOOD-DISAGGREGATED AND CURRENT. That combination is rare in this
  list - most city social data is either citywide-only or years stale. The
  stock series is the usable one for an index; the violations feed is the
  usable one for a live signal.

  Housing Median Sales Prices /d/9nnq-4isb is deliberately EXCLUDED from this
  entry: its licence returned "not specified" while its neighbours returned
  PDDL. Same portal, same subject, different answer on criterion 1.

  NOT AVAILABLE at city scale on this portal: unemployment, Gini, life
  expectancy, broadband, education access. Those exist only at the federal
  rung via ACS, which is a different scale tier.
