name: Kontur Population (400 m H3 hexagons)
url: https://www.kontur.io/datasets/population-dataset/
description: |
  Population counts for every inhabited H3 hexagon on Earth at resolution 8 (about 0.7 km2 each), fused by
  Kontur from GHSL, Facebook HRSL, Microsoft buildings and OpenStreetMap. Published on HDX, globally and per country.
pillar: social
scale: city
status: candidate
license: "CC BY, version not stated; see notes"
