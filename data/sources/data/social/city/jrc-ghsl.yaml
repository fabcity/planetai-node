name: JRC Global Human Settlement Layer (GHSL)
url: https://human-settlement.emergency.copernicus.eu/
description: |
  The European Commission's global record of where people and buildings are:
  population, built-up surface and a settlement classification on a 100 m grid
  from 1975 to 2030, plus a city-by-city Urban Centre Database.
pillar: social
scale: city
status: candidate
license: CC-BY-4.0
api: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/
pilot_relevance: [global]
