notes: |
  Verified 2026-09-09 with a live call returning OData JSON. Spatial codes
  include ISO3 countries, WHO regions (EUR, AFR, AMR, WPR, EMR, SEAR),
  GLOBAL, and World Bank income groups. Example verified: France female
  life expectancy 2007 = 84.058 with a 83.999-84.117 interval. No key
  required. IMPORTANT CURRENCY CAVEAT: the life expectancy series
  retrieved runs 2000-2021 only, which is a four-year lag for an annually
  refreshed index. UNDP HDR carries life expectancy through 2023 and is
  the better source for currency; use GHO where you need sex
  disaggregation and confidence intervals. SLICING: country, WHO region
  and global aggregates only, no sub-national. LICENSE ACTION: flag as
  unconfirmed rather than asserting the usual IGO terms.
