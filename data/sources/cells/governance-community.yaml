cell: Governance|Community
indicator_categories:
- local decision-making
- response to what a node says
minimum_indicators:
- name: Share of this node's asks that were acted on (rho)
  unit: ratio
  aggregation: 30d
does_not_claim: Rho is a measure of this household or this banjar acting on its own node, and of nothing
  else. A low rho may mean the asks were wrong, badly timed or impossible, and reading it as apathy
  is unsupported. It is not a governance score for the place and must never be aggregated upward into
  one.
notes: No registry entry is filed here. The core computes rho at any scale, so like Social|Community
  this cell is computable and unregistered.
