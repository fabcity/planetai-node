cell: Environmental|Planet
indicator_categories:
- atmospheric composition
- global temperature
- planetary material throughput
- earth-system forecasts
minimum_indicators:
- name: Atmospheric CO2 concentration
  unit: ppm
  aggregation: annual-mean
- name: Global surface temperature anomaly
  unit: degC vs 1951-1980
  aggregation: annual-mean
- name: Global domestic material extraction
  unit: Gt/yr
  aggregation: annual-total
- name: Greenhouse gas emissions by country and gas
  unit: ktCO2e/yr
  aggregation: annual-total
does_not_claim: 'A planetary number is not any territory''s number. Nothing here apportions a share
  of global CO2 or global extraction to a city, a region or a person, and an Index that displays a
  planetary figure on a local page is inviting exactly that reading. Nor is a forecast an observation:
  the earth-system models filed against this cell publish projections, and a 2030 layer is a model''s
  opinion about 2030.'
notes: '10 entries filed. The node computes nothing here and is not expected to — a node measures
  its own place. This cell is context: the number every local figure is read against.'
