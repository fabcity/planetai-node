note: |
  Read for the province of Barcelona (PROV=08), the finest level: the city (08019) is not in it, only Catalonia and its four provinces. fabcity/fci-index `compute/trade.py` `regional()` reads it.

  Endpoint: key-free JSON-stat, table 18132 (annual). It answered 200 on 2026-09-26. For 2025, the province of Barcelona had imports of 91.45 bn EUR and 26.29 Mt, and exports of 78.02 bn EUR and 20.11 Mt. Values are in thousand EUR and weights in kg. Index and values are arrays, not objects.

  Admin-code: PROV uses INE's province codes (08, 17, 25, 43, and TOTAL for Catalonia), so it joins directly.

  Vintage: the annual table covers 1994 to 2025 and was last updated 2026-02-24. Every 2024 and 2025 value carries status "p" (provisional), so both years can still move. Table 18136 (monthly) was updated 2026-09-23 and runs to July 2026.

  Field-fit: Economic|Region's external-trade row, exports and imports separately in value; the weights feed a material-flow account. MOD_TRANS splits by sea, rail, road, air and other.

  CAVEATS, the reason this is not plain usable:
  1. Licence. Idescat names no licence. Its legal notice allows reuse if the source is cited, the content is not altered or denatured, and the date of the latest update is given. These are Spain's statutory reuse conditions (Ley 37/2007). I read them as open-equivalent in practice, but not as a named open licence. Cite it as "Source: created upon the basis of Idescat's own data", with the update date, and do not imply that Idescat endorses the use.
  2. Scope. It covers goods crossing the Spanish customs border, attributed to the declarant's province. Trade with the rest of Spain is not in it, so it can never, on its own, say what share of Barcelona's consumption is made locally.
  3. Do not subtract it from port throughput, which counts different goods (transit, coastal traffic, the hinterland).

  The checks were run with Claude Code at my request. I read the findings and stand behind the verdict.
