# GENERATED by tools/gen_defaults.py from .env.example — do not edit.
# What a fresh node gets for each key, and the comment above it, so a container that
# cannot read .env.example (the app image is built from app/) can still say what a
# default is. `make lint` fails when this and .env.example disagree.
NODE_NAME:
  default: "bayu-2"
  help: "---- who and where ---- lowercase, dashes"
NODE_KIND:
  default: "home"
  help: "---- who and where ---- home | business | community | district — defaults and which packs load; not the Index scale"
NODE_SCALE:
  default: "community"
  help: "---- who and where ---- community | city | region   (Full Stack Metrics scale)"
NODE_CITY:
  default: "bali"
  help: "---- who and where ---- pilot key used in Index cells: bali | barcelona | boston | santiago"
NODE_LAT:
  default: "-8.8271"
  help: "---- who and where ----"
NODE_LON:
  default: "115.15709"
  help: "---- who and where ----"
NODE_TZ:
  default: "Asia/Makassar"
  help: "---- who and where ---- IANA name. Sets the database session timezone: local midnight and local hours in rules and cells."
NODE_ISSUES:
  default: "air,heat,land,coast"
  help: "What this place watches, most important first: air, heat, land, coast. The first issue is where the dashboard starts; whichever has something to say takes the top of it. A name nothing declares is ignored with a line in the log. Blank = every issue there is, in the packs' own order. The presets guess per place; change it. What matters here is decided by the people who live here."
SC_DEVICES:
  default: ""
  help: "---- your sensor(s) — set at least one. See docs/sensors.md. ---- Smart Citizen (cloud API, no LAN needed). The number in smartcitizen.me/kits/<id>. Comma-separate several."
AIRGRADIENT_HOSTS:
  default: ""
  help: "AirGradient ONE / Open Air (LAN, no cloud). Hostname printed on the device, or its IP. Comma-separate several."
PURPLEAIR_HOSTS:
  default: ""
  help: "PurpleAir (LAN, no cloud). Use the IP (the .local name is unreliable). Comma-separate several."
SENSOR_INDOOR:
  default: "0"
  help: "Are the LAN sensors above indoors? 1 = yes. (Smart Citizen carries this itself; AirGradient/PurpleAir don't.)"
LOCAL_RADIUS_M:
  default: "500"
  help: "How far from the node a sensor can be and still count as this node's own measurement. A kit of yours further than this is yours but not here: it stays out of the ambient average and out of every `live` claim."
OPENMETEO_ENABLED:
  default: "1"
  help: "---- wider-scale sources (city, region, bioregion, planet) — docs/COVERAGE.md ---- Open-Meteo: model point sample at this node's coordinates. Free, no key, works anywhere on earth. Boundary conditions from the planet scale — context, never rolled up into an index cell."
BOOTSTRAP:
  default: "1"
  help: "On first start, fill the database from free global sources: 92 days of CAMS air quality history and NASA POWER climatology at these coordinates. No key, no sensor needed. Set 0 to start empty."
CKAN_PORTALS:
  default: ""
  help: "CKAN open-data portals to watch, as slug=baseurl pairs. One adapter reads any CKAN portal. e.g. open-data-bcn=https://opendata-ajuntament.barcelona.cat/data,analyze-boston=https://data.boston.gov"
CKAN_SCALE:
  default: "city"
  help: "CKAN open-data portals to watch, as slug=baseurl pairs. One adapter reads any CKAN portal. e.g. open-data-bcn=https://opendata-ajuntament.barcelona.cat/data,analyze-boston=https://data.boston.gov"
THINGDATA_INSTANCES:
  default: ""
  help: "ThingData servers to read (packs/thingdata), as slug=baseurl pairs. Repair knowledge: things, guides, stories. e.g. reuse-city=https://thingdata.example.org"
THINGDATA_SCALE:
  default: "city"
  help: "ThingData servers to read (packs/thingdata), as slug=baseurl pairs. Repair knowledge: things, guides, stories. e.g. reuse-city=https://thingdata.example.org"
THINGDATA_MAX:
  default: "5000"
  help: "Refuse to count a collection larger than this, rather than report a truncated total as a total."
POLL_SECONDS:
  default: "300"
  help: "---- reference / context sources (public data around you) ---- Public stations around you come as packs: packs/bali-air-dispatch in Bali (presets/bali.env turns it on)."
SC_USER:
  default: ""
  help: "---- integrations ---- Discover every kit in a Smart Citizen account instead of listing ids. They are all yours; indoor or outdoor comes from each kit's own setting. SC_EXCLUDE leaves out kits that belong to another site."
SC_EXCLUDE:
  default: ""
  help: "---- integrations ---- Discover every kit in a Smart Citizen account instead of listing ids. They are all yours; indoor or outdoor comes from each kit's own setting. SC_EXCLUDE leaves out kits that belong to another site."
HA_DISCOVERY:
  default: "0"
  help: "Publish local sensors and alerts as Home Assistant entities over MQTT discovery (needs the mqtt profile)."
TELEGRAM_BOT_TOKEN:
  default: ""
  help: "---- alerts ---- from @BotFather. Empty = alerts go to the log only."
TELEGRAM_CHAT_IDS:
  default: ""
  help: "comma-separated chat ids. Add the bot to a group, get the id from getUpdates."
TELEGRAM_BUTTONS:
  default: "0"
  help: "1 = event messages carry Done / Not now / Doesn't fit. The bot in the agent container sets this on startup so the buttons ride only while somebody answers them (SPEC_alerts §7); leave it alone."
REPORT_EVERY:
  default: ""
  help: "One report every REPORT_EVERY hours in the node's own time zone, and what is allowed to interrupt you between them. These three ship blank on purpose: `update.sh` copies new keys here into your .env with whatever value they carry, and a node that was reporting twice a day should keep doing that until you say otherwise, not take a new default. 3 | 4 | 6 | 8 | 12 | 24 hours between reports. Blank = 6, which is four a day."
REPORT_ANCHOR:
  default: ""
  help: "The local hour the rhythm starts from, 0-23. Blank = 6, so 06, 12, 18 and 00."
REPORT_DEPTH:
  default: ""
  help: "auto | brief | standard | deep. Blank = auto. Nothing until a model is in the path of a report."
LEARN_PUSH:
  default: ""
  help: "all | week | off. Blank = all: the first report each day also carries, on Telegram only, yesterday's diary entry (the week's on Mondays, the month's on the 1st) and what the node's learnings changed."
ALERT_LEVEL:
  default: "act"
  help: "The lowest level of alert sent to your phone between reports. act | warn | info — what reaches your phone between reports; everything is still recorded"
QUIET_HOURS:
  default: "1"
  help: "1 = between QUIET_FROM and QUIET_TO (local hours) only act-level alerts are sent; the rest wait for the morning report."
QUIET_FROM:
  default: "22"
  help: "Local hour quiet starts."
QUIET_TO:
  default: "6"
  help: "Local hour quiet ends."
ALERT_LOCALE:
  default: "en"
  help: "Language of the alerts and reports. en | id | es   (every rules.yml carries all three)"
ALERT_ENGINE:
  default: "rules"
  help: "rules (default) | shadow | events. docs/SPEC_alerts.md: shadow records what the event engine would send and sends nothing; events sends the engine's heat and air messages instead of the old heat and air rules."
ALERT_MAX_PER_DAY:
  default: "4"
  help: "With the event engine: pushes a day outside danger."
HOME_HAS:
  default: ""
  help: "What this home has, comma-separated: purifier, ac, fan, windows."
PARENT_API_URL:
  default: ""
  help: "---- network (v0.2, leave empty on node #1) ---- http://<district-node>:8080  → hourly aggregates go up"
PARENT_TOKEN:
  default: ""
  help: "What this node presents to its parent, and what it demands from its own children. Without AGGREGATE_TOKEN this node accepts no children at all (POST /aggregates returns 403)."
AGGREGATE_TOKEN:
  default: ""
  help: "What this node presents to its parent, and what it demands from its own children. Without AGGREGATE_TOKEN this node accepts no children at all (POST /aggregates returns 403)."
DECISION_REQUIRED:
  default: "0"
  help: "1 refuses to record an act unless a decision was recorded against the same alert first. Off by default and meant for a node that acts for more than one household: four of the five ways to record an act have no screen to decide on — a LoRa reply, the MCP tool, the terminal, curl — and a node in a house should record \"I opened the window\" whether or not anybody deliberated first."
COMPOSE_PROFILES:
  default: ""
  help: "---- optional layers (set by `planetai meshtastic` / `planetai reticulum`; leave alone by hand) ---- Which extra containers to run: mqtt, reticulum, or both, comma-separated. Empty = the two base containers only."
GRAFANA_PORT:
  default: "3000"
  help: "Grafana (profile grafana, `planetai grafana`): the port, the address it listens on (127.0.0.1 = this machine only; 0.0.0.0 = the house network, after a password) and its admin password (blank = admin). docs/site/grafana.md"
GRAFANA_BIND:
  default: "127.0.0.1"
  help: "Grafana (profile grafana, `planetai grafana`): the port, the address it listens on (127.0.0.1 = this machine only; 0.0.0.0 = the house network, after a password) and its admin password (blank = admin). docs/site/grafana.md"
GRAFANA_ADMIN_PASSWORD:
  default: ""
  help: "Grafana (profile grafana, `planetai grafana`): the port, the address it listens on (127.0.0.1 = this machine only; 0.0.0.0 = the house network, after a password) and its admin password (blank = admin). docs/site/grafana.md"
MQTT_HOST:
  default: ""
  help: "Meshtastic via MQTT. The gateway radio publishes to the node's Mosquitto with these credentials."
MQTT_USER:
  default: ""
  help: "Meshtastic via MQTT. The gateway radio publishes to the node's Mosquitto with these credentials."
MQTT_PASS:
  default: ""
  help: "Meshtastic via MQTT. The gateway radio publishes to the node's Mosquitto with these credentials."
SC_FORWARD:
  default: ""
  help: "Smart Citizen Kits and DIY nodes can publish to this broker instead of the platform (`planetai broker`). The tokens listed here are forwarded on to smartcitizen.me unchanged; anything not listed stays in the house."
MESH_INDOOR_NODES:
  default: ""
  help: "Mesh node ids that are indoors, e.g. !abcd1234,!beef5678  (mesh sensors default to outdoor)"
MESH_ALERTS:
  default: "0"
  help: "Send act-level alerts back over the mesh (needs downlink enabled on the gateway's channel)"
MESH_GATEWAY_NODE_NUM:
  default: "0"
  help: "The gateway's node number (decimal), used as the sender for downlink. `planetai meshtastic` shows how to find it."
RADIO_PEERS:
  default: ""
  help: "Other nodes this node's broker bridges to (planetai radio federate): name=<tailnet host>:1883:<their MQTT_PASS>,… Only fabcity/ topics cross: text and alerts on the fabcity channel, and presence. Never a reading."
RETICULUM_URL:
  default: ""
  help: "Reticulum bridge (LXMF). Alert destinations: LXMF address hashes from Sideband, comma-separated, no spaces."
RETICULUM_ALERT_DESTINATIONS:
  default: ""
  help: "Reticulum bridge (LXMF). Alert destinations: LXMF address hashes from Sideband, comma-separated, no spaces."
PACKS_ENABLED:
  default: ""
  help: "---- packs: core ones ship here, wild ones are added with planetai packs add (docs/PACKS.md) ---- Empty = load every pack in packs/. Or list ids to load only those."
PACKS_ALLOW_CODE:
  default: "0"
  help: "Data packs (rules/cells) always load. Code packs (adapter.py) run Python with this node's privileges: read the code, then set this to 1."
APP_PORT:
  default: "8080"
  help: "---- ports ---- change if something else on this machine already uses 8080"
POSTGRES_PASSWORD:
  default: "change-me"
  help: "---- storage ---- install.sh replaces this"
ADMIN_TOKEN:
  default: ""
  help: "install.sh generates ADMIN_TOKEN; it unlocks the GUI's settings pages. planetai ui shows it."
BACKUP_TOKEN:
  default: ""
  help: "read-only token a NAS presents to fetch /backups; generated by update.sh when blank. planetai ui prints it; planetai storage says whether it is set."
ACT_TOKEN:
  default: ""
  help: "weaker token for recording that someone acted on an alert (POST /actions) from off this machine; it cannot read a secret or change a setting. planetai ui generates it and shows it beside the admin token."
SHARE_LEVEL:
  default: "off"
  help: "What a request carrying no token may read. off (default) = the dashboard, /health with the position as the centre of the node's resolution 8 cell, the daily export, the layout. open = the whole read API to anything on your network, which is what a wall screen or a phone needs; writes still need a token. A request WITH a token reads everything at either level, from anywhere, so the NAS, Home Assistant and the agent are unaffected. The building's plan needs a token always."
MAP_TILES:
  default: "off"
  help: "dashboard: live map tiles (satellite and street) under the cells. Each tile request tells a tile server which square of the planet this house is looking at, so this is off until a keeper turns it on in Set up. off | on"
UPDATE_CHECK:
  default: "on"
  help: "Every hour, ask planetai.fab.city which version is current and read the programme's list of nodes from GitHub, and say so in the header, planetai doctor and once on Telegram when a newer version is out. The request carries nothing about this house, but it shows this house's internet address to Fab City's host. Nothing is installed: planetai update stays yours to run. on | off"
SPECIES_MATCH:
  default: "off"
  help: "Name the species in images with GBIF: a plant or animal's scientific name is asked of api.gbif.org, and nothing else, never the picture or where it was taken. GBIF's server sees this house's internet address. Weekly, it also reads this country's list of introduced and invasive species (GRIIS), which tells GBIF the country (from NODE_TZ), and counts the open records others made in the node's seven cells, which tells GBIF the area, about 2 km across. off | on"
STATIONS_SHOWN:
  default: "3"
  help: "How many of the neighbourhood's stations the dashboard lists, nearest first. 0 lists every one; this node's own hardware is always listed and is never counted here."
UI_MODE:
  default: "advanced"
  help: "dashboard: how much of the page a reader is shown when they open it. simple = one sentence per stage, written by this node, and nothing else. advanced = every section. learn = the advanced page with a question mark at each part that opens this node's own documentation for it. Anyone reading can switch from the header; their choice is remembered by their browser and changes nothing for anybody else. simple | advanced | learn"
UI_ASK:
  default: "on"
  help: "dashboard: a toggle that opens a pane asking this node's own model, on this machine, about what the page shows. It reads and changes nothing; nothing typed there is kept. on | off"
UI_GROUND:
  default: "svg"
  help: "dashboard: how the ground is drawn. svg is the drawing the page has always made; map draws it with MapLibre and deck.gl, which pan and zoom and need WebGL2. Changes nothing that leaves the house. svg | map"
RETICULUM_PRESENCE:
  default: "0"
  help: "radio: announce this node's presence over Reticulum, and at what H3 resolution. 0 is off, and off is the default — a node says nothing to the mesh until somebody here decides it should. The resolution is the floor a cell may be published at: 3 is about 160 km across, so a listener learns a region and never an address."
RETICULUM_PRESENCE_RES:
  default: "3"
  help: "radio: announce this node's presence over Reticulum, and at what H3 resolution. 0 is off, and off is the default — a node says nothing to the mesh until somebody here decides it should. The resolution is the floor a cell may be published at: 3 is about 160 km across, so a listener learns a region and never an address."
BACKUP_DIR:
  default: "./backups"
  help: "radio: announce this node's presence over Reticulum, and at what H3 resolution. 0 is off, and off is the default — a node says nothing to the mesh until somebody here decides it should. The resolution is the floor a cell may be published at: 3 is about 160 km across, so a listener learns a region and never an address. or a NAS mount, e.g. /Volumes/nas/planetai/bayu-2 — must be mounted, or the backup refuses"
BACKUP_KEEP:
  default: "30"
  help: "radio: announce this node's presence over Reticulum, and at what H3 resolution. 0 is off, and off is the default — a node says nothing to the mesh until somebody here decides it should. The resolution is the floor a cell may be published at: 3 is about 160 km across, so a listener learns a region and never an address. days of dumps to keep in BACKUP_DIR"
BACKUP_REMOTE:
  default: ""
  help: "Off-machine copy after each backup: an rclone remote:path (S3, B2, R2, Drive, Dropbox, SFTP, WebDAV, Nextcloud…). rclone config once."
EXPORT_ENABLED:
  default: "1"
  help: "Open-data export each night (hourly means, cells, alerts, rho — never raw) to exports/<node>/YYYY-MM-DD.json"
IPFS_PUBLISH:
  default: "0"
  help: "Publish each export to IPFS (planetai ipfs turns this on and starts the container)"
DATA_DIR:
  default: ""
  help: "Where the live database lives. Blank = a Docker volume on this machine. A path = a LOCAL disk or partition only."
CAPTURES_DIR:
  default: ""
  help: "Where the pictures the household takes are kept (SPEC_eyes). Blank = ./out/captures on this machine. Unlike DATA_DIR this MAY be a NAS share or any mounted storage — these are files, not Postgres. The node refuses a capture with a clear error, and `planetai doctor` goes red, when the folder is missing or not writable. Change it with: planetai storage set captures <dir>"
EE_PROJECT:
  default: ""
  help: "---- code packs (only needed if you enable the pack that uses them; see packs/<id>/README.md) ---- earth-engine: a registered Earth Engine project and a service-account key"
EE_SERVICE_ACCOUNT:
  default: ""
  help: "---- code packs (only needed if you enable the pack that uses them; see packs/<id>/README.md) ---- earth-engine: a registered Earth Engine project and a service-account key"
EE_KEY_FILE:
  default: "/app/config/ee-key.json"
  help: "---- code packs (only needed if you enable the pack that uses them; see packs/<id>/README.md) ---- earth-engine: a registered Earth Engine project and a service-account key"
COAST_MAX_KM:
  default: "30"
  help: "coast: refuse to report if the nearest ocean grid cell is further away than this"
MAKE_ENABLED:
  default: "0"
  help: "make: OFF by default, and deliberately. The Fab Lab Network directory this pack reads is NOT openly licensed — each lab keeps copyright in its own record and no data licence is published. Fab City Foundation decided it may read it and took responsibility for that; that decision does not cover you. Read packs/make/README.md before setting this to 1."
MAKE_RADIUS_KM:
  default: "50"
  help: "make: how far to look for a fab lab, in km. 50 is a morning's travel in most places."
MAKE_SOURCE:
  default: "archive"
  help: "make: archive (the Fab Foundation's dated monthly snapshots, pinnable) or live (api.fablabs.io, which its own root page says has been removed). See packs/make/README.md before enabling either."
MAKE_SNAPSHOT:
  default: ""
  help: "make: which dated snapshot to read. Blank takes the newest; pin it to a filename such as 2026.07.31_labs.json and every node on this release answers the same question the same way."
MAKE_REFRESH_DAYS:
  default: "30"
  help: "make: how often to re-read. The archive is published monthly, so 30 is the publisher's cadence."
OLLAMA_URL:
  default: "http://host.docker.internal:11434"
  help: "---- a model that runs the node (planetai agent local) ---- Ollama on this machine runs the `local` rung. The bot also uses a stronger model when it can reach one; these are runtime settings, so the Model page in the dashboard changes them live."
AGENT_MODEL:
  default: "qwen3:4b"
  help: "---- a model that runs the node (planetai agent local) ---- Ollama on this machine runs the `local` rung. The bot also uses a stronger model when it can reach one; these are runtime settings, so the Model page in the dashboard changes them live. 8 GB machine. qwen3:8b on 16 GB+. Must do tool calling; gemma3 does not."
AGENT_NAME:
  default: "local-model"
  help: "---- a model that runs the node (planetai agent local) ---- Ollama on this machine runs the `local` rung. The bot also uses a stronger model when it can reach one; these are runtime settings, so the Model page in the dashboard changes them live. how its actions appear in the audit trail"
AGENT_PREFER:
  default: "private"
  help: "private   = nothing leaves your network. This is the default, and it is the default because the alternative is a household that pasted a key into the Model page and never opened this line having its report bundle — its numbers, its room names, its own sentences — sent to somebody else's API first. fallback  = your own remote model, then online, then the small local one. Online sits above local on purpose: a rung is skipped only when it fails, and a 4B model never fails, it answers badly. Local is the floor that still works with no internet. strongest = online, remote, local in that order — every question goes to the online model when one is set. This decides for the dashboard's ask pane too. With fallback or strongest, what somebody asks there and the page's own sentences and numbers (never a position, a sensor name or an id) go to the online provider."
AGENT_REMOTE_URL:
  default: ""
  help: "A bigger model on another machine of yours, on this network or the tailnet. An address outside both counts as online, so private does not use it. Ollama on a laptop: http://<laptop>.local:11434/v1, with OLLAMA_HOST=0.0.0.0 set on the laptop. exo: http://100.107.91.18:8082/v1 Comments go ABOVE a key that ships blank, never after it: compose's env_file strips a trailing comment only when the key has a value, so `KEY=   # note` hands the container \"# note\" as the value. That is how node #1 came to hold the text of this file's own comment in AGENT_ONLINE_URL."
AGENT_REMOTE_MODEL:
  default: "gpt-oss-120b"
  help: "A bigger model on another machine of yours, on this network or the tailnet. An address outside both counts as online, so private does not use it. Ollama on a laptop: http://<laptop>.local:11434/v1, with OLLAMA_HOST=0.0.0.0 set on the laptop. exo: http://100.107.91.18:8082/v1 Comments go ABOVE a key that ships blank, never after it: compose's env_file strips a trailing comment only when the key has a value, so `KEY=   # note` hands the container \"# note\" as the value. That is how node #1 came to hold the text of this file's own comment in AGENT_ONLINE_URL."
AGENT_REMOTE_KEY:
  default: ""
  help: "A bigger model on another machine of yours, on this network or the tailnet. An address outside both counts as online, so private does not use it. Ollama on a laptop: http://<laptop>.local:11434/v1, with OLLAMA_HOST=0.0.0.0 set on the laptop. exo: http://100.107.91.18:8082/v1 Comments go ABOVE a key that ships blank, never after it: compose's env_file strips a trailing comment only when the key has a value, so `KEY=   # note` hands the container \"# note\" as the value. That is how node #1 came to hold the text of this file's own comment in AGENT_ONLINE_URL."
AGENT_ONLINE_URL:
  default: ""
  help: "https://api.anthropic.com/v1 · https://api.openai.com/v1 · https://generativelanguage.googleapis.com/v1beta/openai The URL and nothing else. A value that is not a URL is not a rung: the agent logs it and skips that rung."
AGENT_ONLINE_MODEL:
  default: "claude-sonnet-4-6"
  help: "Ask the key which models it can actually see, and paste an id from that list: curl -s \"$AGENT_ONLINE_URL/models\" -H \"Authorization: Bearer $AGENT_ONLINE_KEY\" | grep -o '\"id\":\"[^\"]*\"' Worth doing rather than trusting a name you remember. Providers retire models, and a retired one answers 404, which reads like a bad key or a wrong URL — node #1 lost an evening to `gemini-2.5-flash`, gone by then. Gemini also prefixes its ids: models/gemini-3.8-flash, not gemini-3.8-flash. Its key comes from aistudio.google.com; a Gemini *app* subscription is a different product and carries no API access."
AGENT_ONLINE_KEY:
  default: ""
  help: "Ask the key which models it can actually see, and paste an id from that list: curl -s \"$AGENT_ONLINE_URL/models\" -H \"Authorization: Bearer $AGENT_ONLINE_KEY\" | grep -o '\"id\":\"[^\"]*\"' Worth doing rather than trusting a name you remember. Providers retire models, and a retired one answers 404, which reads like a bad key or a wrong URL — node #1 lost an evening to `gemini-2.5-flash`, gone by then. Gemini also prefixes its ids: models/gemini-3.8-flash, not gemini-3.8-flash. Its key comes from aistudio.google.com; a Gemini *app* subscription is a different product and carries no API access."
EYES_MODEL:
  default: ""
  help: "The image model (SPEC_eyes step 2): a vision model in this machine's Ollama that describes each image and lists what it finds. Local only; the picture never leaves. Blank = off. On 16 GB: qwen2.5vl:7b (ollama pull qwen2.5vl:7b). Each upload form has a Describe it box; Data, Images can describe any image again."
